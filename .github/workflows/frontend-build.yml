name: Frontend build (PR)

# Pre-merge gate: catches TypeScript errors, webpack build failures and
# jest regressions
# BEFORE a PR is merged, not after. Motivated by the post-mortem in #191:
# a TS6133 error rode through to the protected branch and caused all three
# post-merge deploy jobs to fail after spending minutes on infrastructure
# only to hit the same tsc error inside the Dockerfile frontend-builder stage.
#
# Companion to frontend-build-sentinel.yml, which guards the protected
# branch post-merge against rebases and GitHub-UI merge commits.
# This job guards the PR gate itself — the earlier the catch, the cheaper.
#
# Uses pull_request (not pull_request_target) so this job runs in the
# PR-head context with no access to repository secrets. pull_request_target
# executes in the base-branch context WITH secrets, which is a known
# fork-exfiltration vector and must not be used for untrusted code builds.
#
# See also: #177 (sentinel), #191 (this PR gate).

# No `paths:` filter, on purpose. docs/ci-required-checks.md asks for
# `Build frontend` to be a required status check, and a path-filtered workflow
# reports no status at all on a PR that touches none of its paths: such a PR
# would wait forever on "Expected - Waiting for status to be reported". So
# the job runs on every PR and its first step decides whether the build steps
# are needed. Do not restore the filter.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel redundant runs when new commits are pushed to the same PR.
  group: frontend-build-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull_request checkout is the test-merge commit; depth 2 brings
          # in its first parent (the base branch tip) for the diff below.
          fetch-depth: 2

      # Replaces the old `paths:` filter (see the comment on `on:`). It fails
      # closed: if the changed files cannot be listed, the build runs.
      - name: Detect frontend changes
        id: changes
        working-directory: .
        run: |
          set -euo pipefail
          pattern='^(frontend/|\.github/workflows/frontend-build\.yml$)'
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null ||
            ! changed="$(git diff --name-only 'HEAD^1' HEAD)"; then
            echo "::warning::Could not list the files this PR changes; running the frontend build anyway."
            echo "frontend=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE "$pattern" <<<"$changed"; then
            echo "frontend=true" >>"$GITHUB_OUTPUT"
          else
            echo "No frontend changes in this PR; skipping the frontend build."
            echo "frontend=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: TypeScript typecheck
        if: steps.changes.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build

      # Same invocation as frontend-build-sentinel.yml; the sentinel only
      # fires post-merge on main / feat/**, so this is the pre-merge jest gate.
      - name: Run frontend tests
        if: steps.changes.outputs.frontend == 'true'
        run: npx jest --no-coverage --silent
