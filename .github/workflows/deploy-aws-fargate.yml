# Deploy to AWS ECS Fargate
#
# This workflow deploys the CUDly application to AWS ECS Fargate with ALB.
# Alternative to Lambda for always-on containerized workloads.
#
# Required GitHub Secrets:
#   - ADMIN_EMAIL: Admin email for notifications
#   - ALERT_EMAILS: Optional, comma-separated addresses that receive monitoring alerts (#714)
#
# Required GitHub Variables:
#   - AWS_REGION: AWS region
#   - AWS_ROLE_TO_ASSUME: IAM role ARN for OIDC keyless auth
#   - ECR_REPOSITORY: ECR repository name
#
# Triggered by:
#   - Manual workflow dispatch only (push trigger disabled; Fargate is not the primary compute platform)
#   - Workflow call from deploy-all.yml
#
# Lock cleanup is intentionally manual. If a prior run crashed and left a stuck
# lock, re-run this workflow with clear_stale_lock=true (workflow_dispatch only).
# See runbooks/terraform-stuck-lock.md for diagnosis and manual recovery steps.

name: Deploy to AWS Fargate

permissions:
  contents: read

# No workflow-level `concurrency` on purpose. What needs protecting is the
# Terraform state object, which is keyed on the environment, and only the
# job-level key can see `needs.prepare.outputs.target_environment` -- this level is
# limited to the `github`, `inputs` and `vars` contexts. Keying it on
# `github.ref` put two runs on different refs that both resolve to the same
# environment into different groups against one state file (#1806). The group
# lives on `deploy` below.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, staging, prod]
      clear_stale_lock:
        description: 'Force-clear a stale S3 state lock from a prior crashed run (use only when you know the prior run is dead)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_uri:
        required: false
        type: string
    secrets:
      ADMIN_EMAIL:
        required: true
      ALERT_EMAILS:
        required: false
      TF_BACKEND_AWS:
        required: true

env:
  TF_VERSION: '1.10.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine deployment environment
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # NOTE: `target_environment` below is an OUTPUT, not an `environment:`
    # binding -- this job is deliberately ungated and must never hold
    # `id-token: write`. Naming it plain `environment` reads like a gate while
    # gating nothing; matches the convention deploy-aws-lambda.yml uses.
    outputs:
      target_environment: ${{ steps.set-env.outputs.target_environment }}
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Determine environment
        id: set-env
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          INPUT_ENVIRONMENT="${INPUT_ENVIRONMENT:-}"

          # workflow_dispatch and workflow_call are this workflow's only
          # triggers and both declare `environment` as `required: true`, so the
          # input is the single source of truth and there is nothing to fall
          # back to. Branching on `github.event_name` here was issue #1805:
          # inside a reusable workflow it reports the CALLER's event and is
          # never "workflow_call", so a release-triggered caller passing
          # environment=prod would have mis-resolved to a `dev` default arm.
          # deploy-all.yml hardcodes this workflow off, so the case was latent
          # here and live only for Azure and GCP.
          ENVIRONMENT="$INPUT_ENVIRONMENT"

          # workflow_dispatch constrains this to the declared `choice` options,
          # but the workflow_call input is typed as a free-form string, so the
          # allowlist is enforced here rather than assumed.
          case "$ENVIRONMENT" in
            dev|staging|prod) ;;
            *)
              echo "::error::Refusing unknown environment: '$ENVIRONMENT'"
              exit 1
              ;;
          esac

          echo "target_environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: set-tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # Deploy with Terraform
  deploy:
    name: Deploy to Fargate
    runs-on: ubuntu-24.04-arm
    needs: prepare
    permissions:
      id-token: write
      contents: read
    # Every run that writes
    # s3://<bucket>/github-fargate-<environment>/terraform.tfstate serializes
    # here, whatever ref or workflow it came from (#1806). This is a DIFFERENT
    # state object from the Lambda one (github-<environment>/), so it takes its
    # own group rather than sharing `aws-tfstate-*`; sharing would serialize two
    # independent state files against each other for no gain. The suffix is the
    # exact value the backend key below is built from, and `prepare` fails the
    # run on anything outside dev|staging|prod so it can never be empty.
    #
    # `cancel-in-progress: false` is stated rather than left to the default:
    # cancelling mid-`terraform apply` is how you get a half-applied stack and a
    # lock nobody releases.
    concurrency:
      group: aws-fargate-tfstate-${{ needs.prepare.outputs.target_environment }}
      cancel-in-progress: false
    outputs:
      alb_url: ${{ steps.outputs.outputs.alb_url }}
      app_url: ${{ steps.outputs.outputs.app_url }}
      service_name: ${{ steps.outputs.outputs.service_name }}
    # Set at job level, not workflow level: workflow-level `env:` is resolved
    # before this job's `environment:` is in scope, so an environment-scoped
    # AWS_REGION variable would be invisible there. Matches cleanup-staging.yml.
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    environment:
      name: aws-fargate-${{ needs.prepare.outputs.target_environment }}
      url: ${{ steps.outputs.outputs.alb_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Clear stale state lock (operator-triggered only)
        if: ${{ inputs.clear_stale_lock == true }}
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_AWS }}
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          printf '%s\nkey = "github-fargate-%s/terraform.tfstate"\n' "$TF_BACKEND" "$ENVIRONMENT" > /tmp/backend.tfbackend
          BUCKET=$(grep -E '^\s*bucket\s*=' /tmp/backend.tfbackend 2>/dev/null | tr -d ' "' | cut -d= -f2)
          if [ -n "$BUCKET" ]; then
            LOCK_KEY="github-fargate-${ENVIRONMENT}/terraform.tfstate.tflock"
            echo "Removing stale lock: s3://${BUCKET}/${LOCK_KEY}"
            aws s3 rm "s3://${BUCKET}/${LOCK_KEY}" 2>/dev/null || echo "No lock file found (already clean)"
          else
            echo "Could not parse bucket from backend config; skipping lock clear"
          fi

      - name: Terraform Init
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_AWS }}
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          printf '%s\nkey = "github-fargate-%s/terraform.tfstate"\n' "$TF_BACKEND" "$ENVIRONMENT" > /tmp/backend.tfbackend
          cd terraform/environments/aws
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Terraform Plan
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }}
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          cd terraform/environments/aws
          terraform plan \
            -var-file="github-${ENVIRONMENT}.tfvars" \
            -var="compute_platform=fargate" \
            -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }}
        run: |
          cd terraform/environments/aws
          terraform apply -auto-approve tfplan

      # No automatic state-lock release on failure. A blanket failure-path
      # delete is itself a state-corruption risk: a run that fails *because*
      # it could not acquire the lock would delete the lock held by another
      # run that is still actively applying. Terraform already releases its
      # own lock on a clean apply error; a lock that survives a run means the
      # run died abnormally, which requires operator confirmation that the
      # owning run is dead before clearing it via the clear_stale_lock input.
      # See runbooks/terraform-stuck-lock.md.

      - name: Get outputs
        id: outputs
        run: |
          cd terraform/environments/aws
          {
            echo "alb_url=$(terraform output -raw fargate_alb_dns_name 2>/dev/null | grep -v '::' || echo "")"
            # The URL that actually serves the app (https on the api-<env>
            # alias when HTTPS is enabled), for the test-deployment gates (#647).
            echo "app_url=$(terraform output -raw fargate_app_url 2>/dev/null | grep -v '::' || echo "")"
            echo "service_name=$(terraform output -raw fargate_service_name 2>/dev/null | grep -v '::' || echo "")"
          } >> "$GITHUB_OUTPUT"

      - name: Save deployment info
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          ALB_URL: ${{ steps.outputs.outputs.alb_url }}
          SERVICE_NAME: ${{ steps.outputs.outputs.service_name }}
          DEPLOYED_BY: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg image_tag "$IMAGE_TAG" \
            --arg alb_url "$ALB_URL" \
            --arg service_name "$SERVICE_NAME" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployed_by "$DEPLOYED_BY" \
            --arg commit "$COMMIT" \
            '{environment: $environment, image_tag: $image_tag, alb_url: $alb_url, service_name: $service_name, deployed_at: $deployed_at, deployed_by: $deployed_by, commit: $commit}' \
            > deployment-info.json
          cat deployment-info.json

      - name: Upload deployment info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deployment-info-fargate-${{ needs.prepare.outputs.target_environment }}
          path: deployment-info.json
          retention-days: 90

  # Test deployment
  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    if: always() && needs.deploy.result == 'success'
    permissions:
      contents: read

    steps:
      # Gate on the URL that serves the app, not the bare ALB DNS name: with
      # HTTPS enabled the port 80 listener answers 301 on every path, so an
      # http://<ALB> gate would never reach a task (#647). fargate_app_url is
      # https on the api-<env> alias then (the name the listener certificate
      # covers), otherwise http on the ALB DNS name.
      - name: Get app URL
        id: get-url
        env:
          APP_URL: ${{ needs.deploy.outputs.app_url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Failed to get the app URL (fargate_app_url) from deploy outputs"
            exit 1
          fi
          case "$APP_URL" in
            http://*|https://*) ;;
            *) echo "fargate_app_url has no scheme: $APP_URL"; exit 1 ;;
          esac
          APP_URL="${APP_URL%/}"
          echo "Gating on $APP_URL"
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          echo "Waiting 60 seconds for ECS service to stabilize..."
          sleep 60

      # Needs the repo for scripts/wait-for-healthy.sh, used by both gates below.
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/wait-for-healthy.sh

      # Fast fail gate: the server initializes its database in the background
      # at startup, so no warm-up request is needed to make progress (#488).
      # /ready answers 503 while the task that answers is still initializing,
      # which the script counts as a failed attempt (#647). 30 x 10s covers the
      # 300s ECS health check grace period, so a slow first boot that ECS
      # still tolerates does not fail this gate.
      - name: Test readiness endpoint
        env:
          APP_URL: ${{ steps.get-url.outputs.url }}
          HEALTH_REQUIRED_STREAK: "1"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_INTERVAL_SECONDS: "10"
        run: bash scripts/wait-for-healthy.sh "$APP_URL"

      # Rollout race (#513): during a rolling deploy the ALB can route a probe
      # to a different task than the previous one, so one not-ready response
      # must not fail the step. The script requires HEALTH_REQUIRED_STREAK
      # consecutive ready responses within HEALTH_MAX_ATTEMPTS rounds and
      # fails with the last body otherwise.
      - name: Run smoke tests
        env:
          APP_URL: ${{ steps.get-url.outputs.url }}
          HEALTH_REQUIRED_STREAK: "3"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_INTERVAL_SECONDS: "5"
        run: bash scripts/wait-for-healthy.sh "$APP_URL"

  # Summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, deploy, test-deployment]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Download deployment info
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-info-fargate-${{ needs.prepare.outputs.target_environment }}
        continue-on-error: true

      - name: Post summary
        env:
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TEST_RESULT: ${{ needs.test-deployment.result }}
        run: |
          {
            echo "## AWS Fargate Deployment Summary"
            echo ""
            echo "**Environment:** $TARGET_ENVIRONMENT"
            echo "**Deploy Status:** $DEPLOY_RESULT"
            echo ""

            if [ -f deployment-info.json ]; then
              echo "### Deployment Details"
              echo "\`\`\`json"
              cat deployment-info.json
              echo "\`\`\`"
            fi

            echo ""
            echo "### Job Results"
            echo "- Deploy: $DEPLOY_RESULT"
            echo "- Test: $TEST_RESULT"

            if [ "$DEPLOY_RESULT" == "success" ] && [ "$TEST_RESULT" == "success" ]; then
              echo ""
              echo "**Deployment successful!**"
            else
              echo ""
              echo "**Deployment failed. Check logs for details.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
