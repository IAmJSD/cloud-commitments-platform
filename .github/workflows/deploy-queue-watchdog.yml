name: deploy-queue-watchdog

# Alerts when a deploy or rollback run has sat in `queued` or `pending` for
# hours, or in `waiting` for most of a day. The per-cloud deploy jobs share a
# job-level concurrency group
# (`<cloud>-tfstate-<env>`, cancel-in-progress: false), so one run that never
# starts holds the slot and every later deploy or rollback waits behind it
# (issue #708: GCP and Azure dev deploys frozen from 2026-10-05).
#
# Alert-only on purpose: the job fails (red scheduled run, GitHub notifies) and
# lists the stuck runs; a human cancels them. `waiting` is how the AWS dev
# orphan in #708 showed up (no approval gate on dev), but it is also the state
# of a run awaiting a required environment approval, so it only alerts after
# 720 minutes and is labeled "approval or orphaned". The `test` job runs the
# script's self-test when the script or this workflow changes.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-queue-watchdog.yml"
      - "scripts/check-stuck-deploy-runs.sh"
      - "scripts/test-check-stuck-deploy-runs.sh"

permissions:
  contents: read

concurrency:
  group: deploy-queue-watchdog-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Watchdog script self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run self-test
        run: bash scripts/test-check-stuck-deploy-runs.sh

  watch:
    name: Look for stuck deploy runs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STUCK_AFTER_MINUTES: "120"
      WAITING_AFTER_MINUTES: "720"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect queued, pending and waiting runs of the deploy workflows
        run: |
          set -euo pipefail
          : > runs.jsonl
          for wf in deploy-gcp.yml deploy-azure.yml deploy-aws-lambda.yml deploy-aws-fargate.yml deploy-all.yml rollback.yml; do
            for status in queued pending waiting; do
              gh run list --workflow "$wf" --status "$status" --limit 50 \
                --json databaseId,workflowName,status,createdAt,url,headBranch >> runs.jsonl
            done
          done
          jq -s 'add // []' runs.jsonl > runs.json

      - name: Fail on stuck runs
        run: |
          set -euo pipefail
          status=0
          bash scripts/check-stuck-deploy-runs.sh < runs.json | tee report.txt || status=$?
          {
            echo '### Deploy queue watchdog'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
