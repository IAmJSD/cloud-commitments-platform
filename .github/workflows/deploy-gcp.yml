# Deploy to GCP Cloud Run
#
# This workflow deploys the CUDly application to GCP Cloud Run.
# Serverless container platform with automatic scaling.
#
# Required GitHub Secrets:
#   - ADMIN_EMAIL: Admin email for notifications
#   - ALERT_EMAILS: Optional, comma-separated addresses that receive monitoring alerts (#714)
#
# Required GitHub Variables:
#   - GCP_REGION: GCP region (e.g., us-central1)
#   - GCP_PROJECT_ID: GCP project ID
#   - GCP_WORKLOAD_IDENTITY_PROVIDER: WIF provider resource name for OIDC keyless auth
#   - GCP_SERVICE_ACCOUNT: SA email for OIDC keyless auth
#   - ARTIFACT_REGISTRY_REPO: Artifact Registry repository name (default: cudly)
#
# Triggered by:
#   - Pushes to main branch
#   - Manual workflow dispatch
#   - Workflow call from deploy-all.yml

name: Deploy to GCP Cloud Run

permissions:
  contents: read

# No workflow-level `concurrency` on purpose. What needs protecting is the
# Terraform state object, which is keyed on the environment, and only the
# job-level key can see `needs.prepare.outputs.target_environment` -- this level is
# limited to the `github`, `inputs` and `vars` contexts. Keying it on
# `github.ref` put two runs on different refs that both resolve to `dev` into
# different groups against one state file (#1806). The group lives on
# `build-and-deploy` below.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, staging, prod]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      ADMIN_EMAIL:
        required: true
      ALERT_EMAILS:
        required: false
      TF_BACKEND_GCP:
        required: true

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'cudly' }}
  TF_VERSION: '1.10.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine deployment environment
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # NOTE: `target_environment` below is an OUTPUT, not an `environment:`
    # binding -- this job is deliberately ungated and must never hold
    # `id-token: write`. Naming it plain `environment` reads like a gate while
    # gating nothing; matches the convention deploy-aws-lambda.yml uses.
    outputs:
      target_environment: ${{ steps.set-env.outputs.target_environment }}
    steps:
      - name: Determine environment
        id: set-env
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          INPUT_ENVIRONMENT="${INPUT_ENVIRONMENT:-}"

          # Branch on whether an environment was REQUESTED, not on the event
          # name. Inside a reusable workflow `github.event_name` is the CALLER's
          # event and is never "workflow_call", so no event name can identify a
          # workflow_call invocation: a release-triggered deploy-all.yml passing
          # environment=prod would have landed on a `dev` default arm and
          # resolved to dev while the summary said prod (issue #1805).
          #
          # `inputs` is populated on workflow_dispatch and workflow_call, the
          # only two triggers that carry an environment, so a non-empty input is
          # always an explicit request and wins. An empty input means none was
          # supplied: under `push` that is this workflow's own main-branch
          # deploy and means dev, and every other event stops the run rather
          # than guessing. A workflow_call from a push-triggered caller would
          # read as `push` here too, since `github.event_name` is inherited, but
          # deploy-all.yml is the only caller, has no push trigger, and
          # allowlists the value it passes.
          if [ -n "$INPUT_ENVIRONMENT" ]; then
            ENVIRONMENT="$INPUT_ENVIRONMENT"
          elif [ "$EVENT_NAME" = push ]; then
            ENVIRONMENT=dev
          else
            echo "::error::No environment supplied on a '$EVENT_NAME'-triggered run; refusing to guess a deployment target."
            exit 1
          fi

          # workflow_dispatch constrains this to the declared `choice` options,
          # but the workflow_call input is typed as a free-form string, so the
          # allowlist is enforced here rather than assumed.
          case "$ENVIRONMENT" in
            dev|staging|prod) ;;
            *)
              echo "::error::Refusing unknown environment: '$ENVIRONMENT'"
              exit 1
              ;;
          esac

          echo "target_environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  # Build Docker image (via Terraform build module) and deploy
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      # Assumes the GCP deploy identity via Workload Identity Federation. The
      # `environment:` binding below scopes this job's OIDC `sub` to
      # `repo:<org/repo>:environment:<name>`. NOTE it is not by itself a
      # reviewer gate: an Environment only blocks a job once required-reviewer
      # protection rules are configured on it in repo settings. See #141.
      id-token: write
      contents: read
    # Every run that writes gs://<bucket>/github-<environment>/default.tfstate
    # serializes here, whatever ref or workflow it came from (#1806). The suffix
    # is the exact value the backend prefix below is built from, so the group and
    # the state object cannot drift apart, and `prepare` fails the run on
    # anything outside dev|staging|prod so it can never be empty.
    #
    # `cancel-in-progress: false` is stated rather than left to the default:
    # cancelling mid-`terraform apply` is how you get a half-applied stack and a
    # lock nobody releases.
    concurrency:
      group: gcp-tfstate-${{ needs.prepare.outputs.target_environment }}
      cancel-in-progress: false
    # Bind to the named GitHub Environment matching the target so secrets/vars
    # resolve to environment-scoped values and the OIDC subject scopes to
    # `environment:<name>` instead of `ref:refs/heads/main`. Matches
    # deploy-aws-lambda.yml / deploy-aws-fargate.yml. See #140.
    environment: ${{ needs.prepare.outputs.target_environment }}
    outputs:
      service_url: ${{ steps.deploy.outputs.service_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # This step used to `gsutil rm` the state lock object before every init,
      # unconditionally and with no check that the lock was stale or anyone
      # else's, so it deleted a live lock held by a concurrent writer. Removed
      # with #1806; the job-level `concurrency` group above is what keeps
      # writers apart now, and a loud "Error acquiring the state lock" is the
      # correct outcome if one ever slips through. Recovery from a genuinely
      # stranded lock is `terraform force-unlock <ID>` -- see
      # runbooks/terraform-stuck-lock.md.
      - name: Terraform Init
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_GCP }}
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          printf '%s\nprefix = "github-%s"\n' "$TF_BACKEND" "$ENVIRONMENT" > /tmp/backend.tfbackend
          cd terraform/environments/gcp
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Terraform Plan
        env:
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }}
        run: |
          cd terraform/environments/gcp
          terraform plan \
            -var-file="github-${TARGET_ENVIRONMENT}.tfvars" \
            -var="project_id=${GCP_PROJECT_ID}" \
            -out=tfplan

      - name: Terraform Apply
        id: deploy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }}
        run: |
          cd terraform/environments/gcp
          terraform apply -auto-approve tfplan

          # Get service URL
          SERVICE_URL=$(terraform output -raw cloud_run_service_url 2>/dev/null | grep -v '::' || echo "")
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      # No automatic state-lock release on failure. The step that used to live
      # here ran on `failure() || cancelled()` with no age check and no check
      # that the lock was this run's, so it deleted whatever lock object was
      # there. The `cancelled()` half is the decisive one: GitHub runs those
      # steps while `terraform apply` is still shutting down and may still be
      # writing state, so it destroyed a lock out from under an active writer.
      # Terraform releases its own lock on a clean apply error; a lock that
      # survives a run means the run died abnormally, which needs operator
      # confirmation that the owning run is dead. Recovery is
      # `terraform force-unlock <ID>` -- see runbooks/terraform-stuck-lock.md.

      - name: Save deployment info
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          DEPLOYED_BY: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg service_url "$SERVICE_URL" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployed_by "$DEPLOYED_BY" \
            --arg commit "$COMMIT" \
            '{environment: $environment, service_url: $service_url, deployed_at: $deployed_at, deployed_by: $deployed_by, commit: $commit}' \
            > deployment-info.json
          cat deployment-info.json

      - name: Upload deployment info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deployment-info-gcp-${{ needs.prepare.outputs.target_environment }}
          path: deployment-info.json
          retention-days: 90

  # Test the deployment
  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: [prepare, build-and-deploy]
    if: always() && needs.build-and-deploy.result == 'success'
    permissions:
      contents: read

    steps:
      - name: Get Service URL
        id: get-url
        env:
          DEPLOY_SERVICE_URL: ${{ needs.build-and-deploy.outputs.service_url }}
        run: |
          SERVICE_URL="$DEPLOY_SERVICE_URL"
          if [ -z "$SERVICE_URL" ]; then
            echo "Failed to get service URL from deploy outputs"
            exit 1
          fi
          SERVICE_URL="${SERVICE_URL%/}"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloud Run to be ready
        run: |
          echo "Waiting 30 seconds for Cloud Run to be ready..."
          sleep 30

      # Needs the repo for scripts/wait-for-healthy.sh, used by both gates below.
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/wait-for-healthy.sh

      # Fast fail gate: the server initializes its database in the background
      # at startup, so no warm-up request is needed to make progress (#488).
      # /ready answers 503 while the instance is still initializing, which the
      # script counts as a failed attempt. The old inline gate warmed up
      # /api/auth/check-admin and then parsed /health, and the two requests
      # could land on different instances (#648).
      - name: Test readiness endpoint
        env:
          APP_URL: ${{ steps.get-url.outputs.url }}
          HEALTH_REQUIRED_STREAK: "1"
          HEALTH_MAX_ATTEMPTS: "5"
          HEALTH_INTERVAL_SECONDS: "10"
        run: bash scripts/wait-for-healthy.sh "$APP_URL"

      # Rollout race (#513): a probe can land on an instance of the new
      # revision that is still initializing, so one not-ready response must
      # not fail the step. The script requires HEALTH_REQUIRED_STREAK
      # consecutive ready responses within HEALTH_MAX_ATTEMPTS rounds and fails
      # with the last body otherwise.
      - name: Run smoke tests
        env:
          APP_URL: ${{ steps.get-url.outputs.url }}
          HEALTH_REQUIRED_STREAK: "3"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_INTERVAL_SECONDS: "5"
        run: bash scripts/wait-for-healthy.sh "$APP_URL"

  # Post deployment summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, build-and-deploy, test-deployment]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Download deployment info
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: deployment-info-gcp-${{ needs.prepare.outputs.target_environment }}
        continue-on-error: true

      - name: Post summary
        env:
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
          TEST_RESULT: ${{ needs.test-deployment.result }}
        run: |
          {
            echo "## GCP Cloud Run Deployment Summary"
            echo ""
            echo "**Environment:** $TARGET_ENVIRONMENT"
            echo "**Region:** $GCP_REGION"
            echo ""

            if [ -f deployment-info.json ]; then
              echo "### Deployment Details"
              echo "\`\`\`json"
              cat deployment-info.json
              echo "\`\`\`"
            fi

            echo ""
            echo "### Job Results"
            echo "- Deploy: $DEPLOY_RESULT"
            echo "- Test: $TEST_RESULT"

            if [ "$DEPLOY_RESULT" == "success" ] && [ "$TEST_RESULT" == "success" ]; then
              echo ""
              echo "✅ **Deployment successful!**"
            else
              echo ""
              echo "❌ **Deployment failed. Check logs for details.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
