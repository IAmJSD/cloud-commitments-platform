# Deploy to Azure Container Apps
#
# This workflow deploys the CUDly application to Azure Container Apps.
# Serverless container platform with automatic scaling and built-in HTTPS.
#
# Required GitHub Secrets:
#   - AZURE_CLIENT_ID: App registration client ID for OIDC keyless auth
#   - AZURE_TENANT_ID: Azure AD tenant ID for OIDC keyless auth
#   - AZURE_SUBSCRIPTION_ID: Azure subscription ID
#   - ADMIN_EMAIL: Admin email for notifications
#   - ALERT_EMAILS: Optional, comma-separated addresses that receive monitoring alerts (#714)
#
# Required GitHub Variables:
#   - AZURE_LOCATION: Azure region (e.g., eastus)
#   - ACR_NAME: Azure Container Registry name
#   - KEY_VAULT_NAME: Azure Key Vault name
#
# Triggered by:
#   - Pushes to main branch
#   - Manual workflow dispatch
#   - Workflow call from deploy-all.yml

name: Deploy to Azure Container Apps

permissions:
  contents: read

# No workflow-level `concurrency` on purpose. What needs protecting is the
# Terraform state blob, which is keyed on the environment, and only the
# job-level key can see `needs.prepare.outputs.target_environment` -- this level is
# limited to the `github`, `inputs` and `vars` contexts. Keying it on
# `github.ref` here was issue #1801: two refs resolving to the same environment
# landed in different groups and applied against one state file. See
# `build-and-deploy` below.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, staging, prod]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      ADMIN_EMAIL:
        required: true
      ALERT_EMAILS:
        required: false
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      TF_BACKEND_AZURE:
        required: true

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}
  ACR_NAME: ${{ vars.ACR_NAME || 'cudlyacr' }}
  TF_VERSION: '1.10.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine deployment environment
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # NOTE: `target_environment` below is an OUTPUT, not an `environment:`
    # binding -- this job is deliberately ungated and must never hold
    # `id-token: write`. Naming it plain `environment` reads like a gate while
    # gating nothing; matches the convention deploy-aws-lambda.yml uses.
    outputs:
      target_environment: ${{ steps.set-env.outputs.target_environment }}
    steps:
      - name: Determine environment
        id: set-env
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          INPUT_ENVIRONMENT="${INPUT_ENVIRONMENT:-}"

          # Branch on whether an environment was REQUESTED, not on the event
          # name. Inside a reusable workflow `github.event_name` is the CALLER's
          # event and is never "workflow_call", so no event name can identify a
          # workflow_call invocation: a release-triggered deploy-all.yml passing
          # environment=prod would have landed on a `dev` default arm and
          # resolved to dev while the summary said prod (issue #1805).
          #
          # `inputs` is populated on workflow_dispatch and workflow_call, the
          # only two triggers that carry an environment, so a non-empty input is
          # always an explicit request and wins. An empty input means none was
          # supplied: under `push` that is this workflow's own main-branch
          # deploy and means dev, and every other event stops the run rather
          # than guessing. A workflow_call from a push-triggered caller would
          # read as `push` here too, since `github.event_name` is inherited, but
          # deploy-all.yml is the only caller, has no push trigger, and
          # allowlists the value it passes.
          if [ -n "$INPUT_ENVIRONMENT" ]; then
            ENVIRONMENT="$INPUT_ENVIRONMENT"
          elif [ "$EVENT_NAME" = push ]; then
            ENVIRONMENT=dev
          else
            echo "::error::No environment supplied on a '$EVENT_NAME'-triggered run; refusing to guess a deployment target."
            exit 1
          fi

          # workflow_dispatch constrains this to the declared `choice` options,
          # but the workflow_call input is typed as a free-form string, so the
          # allowlist is enforced here rather than assumed.
          case "$ENVIRONMENT" in
            dev|staging|prod) ;;
            *)
              echo "::error::Refusing unknown environment: '$ENVIRONMENT'"
              exit 1
              ;;
          esac

          echo "target_environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  # Build Docker image (via Terraform build module) and deploy
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      # Assumes the Azure deploy SP via federated identity. The `environment:`
      # binding below scopes this job's OIDC `sub` to
      # `repo:<org/repo>:environment:<name>`, which must have a matching
      # `azuread_application_federated_identity_credential` (see
      # terraform/environments/azure/ci-cd-permissions/sp.tf) or `azure/login`
      # fails with AADSTS70021. NOTE the binding is not by itself a reviewer
      # gate: it only blocks a job once required-reviewer protection rules are
      # configured on the Environment in repo settings. See #141.
      id-token: write
      contents: read
    # Every run that writes github-<environment>.terraform.tfstate serializes
    # here, whatever its ref and whatever workflow it came from. The group name
    # is a 1:1 function of the state key, and the same literal prefix is used by
    # cleanup-staging.yml and rollback.yml, which write the same blob.
    #
    # `prepare` rejects anything outside dev|staging|prod and fails the run, so
    # this expression cannot evaluate to an empty suffix while this job runs --
    # that would collapse every environment into one group.
    #
    # cancel-in-progress stays false, stated explicitly rather than left to the
    # default: cancelling mid-`terraform apply` is how you get a half-applied
    # stack and a lease nobody releases.
    concurrency:
      group: azure-tfstate-${{ needs.prepare.outputs.target_environment }}
      cancel-in-progress: false
    # Bind to the named GitHub Environment matching the target so secrets/vars
    # resolve to environment-scoped values and the OIDC subject scopes to
    # `environment:<name>` instead of `ref:refs/heads/main`. Matches
    # deploy-aws-lambda.yml / deploy-aws-fargate.yml. See #140.
    environment: ${{ needs.prepare.outputs.target_environment }}
    outputs:
      app_url: ${{ steps.deploy.outputs.app_url }}
      app_name: ${{ steps.deploy.outputs.app_name }}
      resource_group_name: ${{ steps.deploy.outputs.resource_group_name }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # This step used to also run `az storage blob lease break` on the state
      # blob, with no lease-age check and no --lease-break-period, so it broke a
      # *live* lease immediately. Removed with #1801: the lease is the last line
      # of defence against two writers, and a loud "Error acquiring the state
      # lock" is the correct outcome of a real collision. A genuinely stranded
      # lease (runner killed mid-apply) is recovered with `terraform
      # force-unlock <ID>`, using the lock ID Terraform prints in that error.
      - name: Write Terraform backend config
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_AZURE }}
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          printf '%s\nkey = "github-%s.terraform.tfstate"\n' "$TF_BACKEND" "$ENVIRONMENT" > /tmp/backend.tfbackend

      - name: Terraform Init
        run: |
          cd terraform/environments/azure
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Terraform Plan
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          # pipefail for the same reason as the apply step below: the default
          # shell is `bash -e`, where a pipeline takes tee's exit status and a
          # failed plan would be reported as success.
          set -o pipefail
          cd terraform/environments/azure
          terraform plan \
            -var-file="github-${TARGET_ENVIRONMENT}.tfvars" \
            -var="location=${AZURE_LOCATION}" \
            -out=tfplan 2>&1 | tee "${RUNNER_TEMP}/tf-plan.log"


      - name: Wait for resource group deletion to complete
        env:
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          ENVIRONMENT="$TARGET_ENVIRONMENT"
          RG_NAME="cudly-${ENVIRONMENT}-rg"
          echo "Checking resource group ${RG_NAME} state..."
          for i in $(seq 1 30); do
            STATE=$(az group show --name "${RG_NAME}" --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
            if [ "$STATE" = "Deleting" ]; then
              echo "  Resource group is being deleted ($i/30), waiting 30s..."
              sleep 30
            else
              echo "  Resource group state: ${STATE} — proceeding"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for resource group deletion"
              exit 1
            fi
          done

      - name: Remove orphaned or soft-deleted Key Vault
        env:
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
        run: |
          ENVIRONMENT="$TARGET_ENVIRONMENT"
          KV_NAME="cudly-${ENVIRONMENT}-kv"
          # If the KV exists in Azure but not in Terraform state (orphaned from a failed run),
          # delete it so Terraform can re-create it cleanly
          KV_RG=$(az keyvault show --name "${KV_NAME}" --query "resourceGroup" -o tsv 2>/dev/null || echo "")
          if [ -n "$KV_RG" ]; then
            echo "Key Vault ${KV_NAME} exists in Azure (rg: ${KV_RG}) — deleting so Terraform can recreate it"
            az keyvault delete --name "${KV_NAME}" --resource-group "${KV_RG}" 2>/dev/null || true
          fi
          # Purge any soft-deleted Key Vault (including the one we just deleted)
          # so the name can be immediately reused
          DELETED=$(az keyvault list-deleted --query "[?name=='${KV_NAME}'].name" -o tsv 2>/dev/null || echo "")
          if [ -n "$DELETED" ]; then
            echo "Purging soft-deleted Key Vault ${KV_NAME}..."
            az keyvault purge --name "${KV_NAME}" --location "${AZURE_LOCATION}" 2>/dev/null \
              && echo "Purged" || echo "Purge failed (continuing)"
          fi

      - name: Terraform Apply
        id: deploy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # pipefail is required: the default shell is `bash -e`, where a pipeline
          # takes tee's exit status and a failed apply would be reported as success.
          set -o pipefail
          cd terraform/environments/azure
          terraform apply -auto-approve tfplan 2>&1 | tee "${RUNNER_TEMP}/tf-apply.log"

          # A missing or unreadable output fails this step with terraform's own
          # error, instead of passing an empty value on to test-deployment
          # (#438). The script still drops setup-terraform's `::debug::` lines.
          bash "${GITHUB_WORKSPACE}/scripts/read-tf-outputs.sh" \
            app_url=container_app_url \
            app_name=container_app_name \
            resource_group_name=resource_group_name

      # The provider fails the data read outright when the custom role is absent,
      # so a Terraform precondition can never run for this case. Issue #1794: the
      # Azure deploy failed on every main run since 2026-07-19 because the
      # bootstrap stack's role definition carried an action that does not exist
      # in Azure's operation catalog, so Azure rejected the whole role definition
      # with InvalidActionOrNotAction and the role was never created. That action
      # is removed in this PR. The message below still covers the general "role
      # missing" case for any future recurrence.
      - name: Explain a missing bootstrap role
        if: failure()
        run: |
          # Both logs are checked. Today the role lookup runs at plan: it lives in
          # the root module (terraform/environments/azure/compute.tf), outside the
          # module-level depends_on that used to defer it to apply and churn the
          # assignment on every deploy (#1802). Keeping the apply log in the loop
          # costs nothing and means the diagnostic does not have to move if the
          # read ever shifts back.
          #
          # Each file is checked separately so that "this log does not exist" is an
          # explicit, expected case at the point of reading -- either log is absent
          # when an earlier step failed first. Passing both to one grep would also
          # work (POSIX: -q exits 0 if a line is selected, and the only combinations
          # returning 2 are those with no match anywhere, where silence is wanted),
          # but it leaves that reasoning implicit.
          found=0
          for log in "${RUNNER_TEMP}/tf-plan.log" "${RUNNER_TEMP}/tf-apply.log"; do
            [ -f "$log" ] || continue
            if grep -qiE 'could not find role|Role Definition .* was not found' "$log"; then
              found=1
              break
            fi
          done
          [ "$found" -eq 1 ] || exit 0
          cat >&2 <<'EOT'
          ::error title=Missing bootstrap role::The custom reservation-purchaser role does not exist in this subscription.

          Apply the bootstrap stack that creates it:
              terraform/environments/azure/ci-cd-permissions

          Do NOT grant Microsoft.Authorization/roleDefinitions/write to the deploy
          service principal to work around this. The split is deliberate: this
          pipeline holds roleAssignments/write only.

          If the bootstrap HAS been applied, check in this order:
            1. the bootstrap stack's own apply log for InvalidActionOrNotAction.
               That means the role definition itself was rejected by Azure and
               never created, not merely unassigned (issue #1794's root cause:
               a nonexistent action in the role's actions list). Make sure the
               bootstrap module is on a commit that includes that fix.
            2. the deploy SP has Microsoft.Authorization/roleDefinitions/read.
               Without it the lookup returns empty, which is indistinguishable
               from the role being absent.
            3. the role was not renamed or deleted out of band.
            4. the name suffix still matches. The runtime module looks up
               "CUDly Reservation Purchaser (custom) - <subscription-id>";
               the bootstrap builds the name from its own var.name_suffix.
          EOT

      # A "Release state lock on failure" step used to break the lease here on
      # `failure() || cancelled()`. Removed with #1801. On failure Terraform
      # ordinarily unlocks on its way out, so the step usually did nothing; on
      # cancelled() a SIGINT'd apply is still shutting down and may still be
      # writing state, so it broke the lease out from under it. That is the
      # decisive half: a live lease must never be broken.
      #
      # The residue is real and is accepted, not denied. A lease IS stranded
      # when the unlock call itself fails ("Error releasing the state lock",
      # e.g. OIDC expiry mid-apply), when Terraform crashes, or when Actions
      # SIGKILLs after the cancellation grace period. The azurerm backend takes
      # an INFINITE lease, so none of those self-expire. Recovery is deliberate
      # and manual: `terraform force-unlock <ID>` with the ID Terraform prints.
      # A step that clears those cases can only do so by also breaking live
      # leases, which is the bug this issue is about.

      - name: Save deployment info
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
          APP_URL: ${{ steps.deploy.outputs.app_url }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          DEPLOYED_BY: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg app_url "$APP_URL" \
            --arg app_name "$APP_NAME" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployed_by "$DEPLOYED_BY" \
            --arg commit "$COMMIT" \
            '{environment: $environment, app_url: $app_url, app_name: $app_name, deployed_at: $deployed_at, deployed_by: $deployed_by, commit: $commit}' \
            > deployment-info.json
          cat deployment-info.json

      - name: Upload deployment info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deployment-info-azure-${{ needs.prepare.outputs.target_environment }}
          path: deployment-info.json
          retention-days: 90

  # Test the deployment
  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: [prepare, build-and-deploy]
    if: always() && needs.build-and-deploy.result == 'success'
    permissions:
      # Assumes the Azure deploy SP to look up the Container App URL. See the
      # comment on build-and-deploy's `permissions:` for what the binding
      # below does and does not buy.
      id-token: write
      contents: read
    # Bind to the same named environment as build-and-deploy so the OIDC
    # subject is the same `environment:<name>` the federated credential
    # trusts. See #140.
    environment: ${{ needs.prepare.outputs.target_environment }}

    steps:
      - name: Azure Login
        id: azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container App URL
        id: get-url
        env:
          DEPLOY_APP_URL: ${{ needs.build-and-deploy.outputs.app_url }}
        run: |
          APP_URL="$DEPLOY_APP_URL"
          if [ -z "$APP_URL" ]; then
            echo "Failed to get app URL from deploy outputs"
            exit 1
          fi
          # Ensure URL has scheme and no trailing slash
          case "$APP_URL" in
            http://*|https://*) ;; # already has scheme
            *) APP_URL="https://$APP_URL" ;;
          esac
          APP_URL="${APP_URL%/}"
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for Container App to be ready
        run: |
          echo "Waiting 30 seconds for Container App to be ready..."
          sleep 30

      # Needs the repo for scripts/wait-for-healthy.sh, used by both gates below.
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/wait-for-healthy.sh

      # Fast fail gate: the server initializes its database in the background
      # at startup, so no warm-up request is needed to make progress (#488).
      # /ready answers 503 while this replica is still initializing, which
      # curl -f turns into a failed attempt.
      - name: Test readiness endpoint
        env:
          APP_URL: ${{ steps.get-url.outputs.url }}
          HEALTH_REQUIRED_STREAK: "1"
          HEALTH_MAX_ATTEMPTS: "5"
          HEALTH_INTERVAL_SECONDS: "10"
        run: bash scripts/wait-for-healthy.sh "$APP_URL"

      # Rollout race (#513): a probe can land on the new revision while it is
      # still initializing (auth_store "not initialized"), so one not-ready
      # response must not fail the step. The script requires
      # HEALTH_REQUIRED_STREAK consecutive ready responses within
      # HEALTH_MAX_ATTEMPTS rounds and fails with the last body otherwise.
      - name: Run smoke tests
        env:
          APP_URL: ${{ steps.get-url.outputs.url }}
          HEALTH_REQUIRED_STREAK: "3"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_INTERVAL_SECONDS: "5"
        run: bash scripts/wait-for-healthy.sh "$APP_URL"

      # Runs when an earlier step failed too (#438): a failed readiness or smoke
      # gate is exactly when the logs are needed. It still needs a working
      # Azure login. Missing outputs only warn here, because build-and-deploy
      # now fails at the source when it cannot read them, so this job never
      # starts without them; failing here would only bury the real error. An
      # az lookup error still fails the step (#217).
      - name: Check Container App logs
        if: always() && steps.azure-login.outcome == 'success'
        env:
          APP_NAME: ${{ needs.build-and-deploy.outputs.app_name }}
          RESOURCE_GROUP_NAME: ${{ needs.build-and-deploy.outputs.resource_group_name }}
        run: |
          if [ -z "$APP_NAME" ] || [ -z "$RESOURCE_GROUP_NAME" ]; then
            echo "::warning::No Container App to read logs from: app_name='$APP_NAME' resource_group_name='$RESOURCE_GROUP_NAME'"
            exit 0
          fi
          echo "Recent Container App logs:"
          az containerapp logs show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --tail 50

  # Post deployment summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, build-and-deploy, test-deployment]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Download deployment info
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-info-azure-${{ needs.prepare.outputs.target_environment }}
        continue-on-error: true

      - name: Post summary
        env:
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.target_environment }}
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
          TEST_RESULT: ${{ needs.test-deployment.result }}
        run: |
          {
            echo "## Azure Container Apps Deployment Summary"
            echo ""
            echo "**Environment:** $TARGET_ENVIRONMENT"
            echo "**Location:** $AZURE_LOCATION"
            echo ""

            if [ -f deployment-info.json ]; then
              echo "### Deployment Details"
              echo "\`\`\`json"
              cat deployment-info.json
              echo "\`\`\`"
            fi

            echo ""
            echo "### Job Results"
            echo "- Deploy: $DEPLOY_RESULT"
            echo "- Test: $TEST_RESULT"

            if [ "$DEPLOY_RESULT" == "success" ] && [ "$TEST_RESULT" == "success" ]; then
              echo ""
              echo "✅ **Deployment successful!**"
            else
              echo ""
              echo "❌ **Deployment failed. Check logs for details.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
