  # ---- Cloud Accounts ---------------------------------------------------
  /api/accounts/discover-org:
    post:
      operationId: discoverOrgAccounts
      tags: [Accounts]
      summary: Import the member accounts of an AWS organization (admin only)
      description: >
        Uses the stored credentials of an AWS org-root account to list the
        organization's member accounts and creates a cloud account for each
        one not already registered (matched by external_id). New accounts are
        created disabled, with an empty aws_auth_mode and aws_bastion_id set
        to the org root, so an operator must configure and enable each one.
        The caller needs unrestricted account access.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverOrgRequest'
      responses:
        '200':
          description: Discovery summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverOrgResult'
        '400':
          description: >
            Invalid JSON body, account_id is not a UUID, the account is not an
            AWS account, or it is not configured as an org root.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the caller is not an admin, or the caller's
            account access is restricted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Org-root account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            The org root's credentials could not be resolved, the AWS
            Organizations call failed, or a discovered account could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/self:
    post:
      operationId: createSelfAccount
      tags: [Accounts]
      summary: Register CUDly's own host cloud account (admin only)
      description: >
        Creates an enabled cloud account for the AWS account, Azure
        subscription or GCP project CUDly itself runs in, using the host's
        ambient credentials. No request body is read.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Created account (is_self is true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAccount'
        '400':
          description: >
            CUDly cannot detect its own host identity, or the detected values
            fail account validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The host account is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/list:
    get:
      operationId: listAccountSummaries
      tags: [Accounts]
      summary: List accounts with minimal fields
      description: >
        Returns only id, name, external_id and provider for each account in
        the caller's account scope, for account pickers and filters. Requires
        view:recommendations rather than view:accounts. Sorted by name.
      parameters:
        - name: provider
          in: query
          description: >
            Only return accounts of this provider (aws, azure or gcp). "all"
            means every provider. Any other value is a 400.
          schema:
            type: string
        - name: enabled
          in: query
          description: Only return enabled (true) or disabled (false) accounts. Any other value is a 400.
          schema:
            type: boolean
        - name: search
          in: query
          description: Case-insensitive substring match on name or external_id.
          schema:
            type: string
      responses:
        '200':
          description: Account summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/accounts/service-overrides/export:
    get:
      operationId: exportAccountServiceOverrides
      tags: [Accounts]
      summary: Export every per-service override in the caller's account scope
      description: >
        Returns every account_service_overrides row on the accounts the
        caller's scope allows, with each account's provider and external ID
        so the file can be imported into another tenant (issue #9). Requires
        view:accounts. JSON by default; format=csv returns the same rows as
        CSV (list cells are semicolon-separated, an empty cell is an unset
        field). A CSV text cell starting with = + - @ tab, CR or ' gets a '
        prefix so a spreadsheet does not run it as a formula; import strips
        that prefix again.
      parameters:
        - name: format
          in: query
          description: json (default) or csv. Any other value is a 400.
          schema:
            type: string
            enum: [json, csv]
      responses:
        '200':
          description: The overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideExport'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/accounts/service-overrides/import:
    post:
      operationId: importAccountServiceOverrides
      tags: [Accounts]
      summary: Import per-service overrides from an export file
      description: >
        Applies an export file (JSON rows or CSV text) as desired state
        (issue #9). Each row names its account by account_id, else by
        provider and account_external_id, and must be in the caller's account
        scope. A row sets every field of its override (an unset field clears
        it); overrides not in the file are left alone. Rows are validated with
        the service-config rules, the commitment-option check of the PUT
        endpoint and the column bounds (ramp_schedule at most 32 characters,
        coverage at most 2 decimal places, no control characters in
        ramp_schedule or list values). strict (default) writes nothing when
        any row is rejected and answers 400 with the report under
        details.report; best_effort writes the valid rows. dry_run reports
        without writing. The writes run in one transaction, so a store
        failure writes nothing. Requires update:accounts. Writes are upserts,
        so re-running an import is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideImportRequest'
      responses:
        '200':
          description: Per-row report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideImportReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List cloud accounts
      description: >
        Returns the full account objects in the caller's account scope,
        sorted by name. Requires view:accounts.
      parameters:
        - name: provider
          in: query
          description: >
            Only return accounts of this provider (aws, azure or gcp). "all"
            means every provider. Any other value is a 400.
          schema:
            type: string
        - name: enabled
          in: query
          description: Only return enabled (true) or disabled (false) accounts. Any other value is a 400.
          schema:
            type: boolean
        - name: search
          in: query
          description: Case-insensitive substring match on name or external_id.
          schema:
            type: string
      responses:
        '200':
          description: Cloud accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create a cloud account (admin only)
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAccountRequest'
      responses:
        '200':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this provider and external_id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}/credentials:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: saveAccountCredentials
      tags: [Accounts]
      summary: Store credentials for a cloud account (admin only)
      description: >
        Stores (or replaces) one credential of the given type for the account.
        The payload keys are validated per credential_type and unknown keys
        are rejected.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCredentialsRequest'
      responses:
        '200':
          description: Stored. The body is an empty JSON object.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/accounts/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: testAccountCredentials
      tags: [Accounts]
      summary: Test a cloud account's credentials (admin only)
      description: >
        Checks that the account's credentials work. AWS accounts are resolved
        the same way purchases resolve them and then probed with
        sts:GetCallerIdentity, which must return the account's external_id.
        Azure managed identity and GCP application default credentials
        report ok without a live check. Azure and GCP workload identity
        federation accounts perform a live token exchange when the deployment
        has an OIDC signer; other modes only check that the expected
        credential is stored. A failed check is reported as ok=false with
        status 200.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}/service-overrides:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listAccountServiceOverrides
      tags: [Accounts]
      summary: List an account's per-service overrides
      responses:
        '200':
          description: Service overrides (empty array when none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountServiceOverride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}/service-overrides/{provider}/{service}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [aws, azure, gcp]
      - name: service
        in: path
        required: true
        description: Service name, for example ec2.
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    put:
      operationId: saveAccountServiceOverride
      tags: [Accounts]
      summary: Create or replace an account's override for one service (admin only)
      description: >
        Upserts the override for this account, provider and service. The
        override is replaced as a whole: fields omitted from the body are
        cleared and inherit the global service configuration.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountServiceOverrideRequest'
      responses:
        '200':
          description: Saved override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountServiceOverride'
        '400':
          description: >
            Invalid path (account ID, provider or service name), invalid
            request body, or an AWS term and payment combination the service
            does not offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAccountServiceOverride
      tags: [Accounts]
      summary: Delete an account's override for one service (admin only)
      description: >
        Removes the override so the service inherits the global
        configuration again. Succeeds when no override exists.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Deleted. The body is an empty JSON object.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid path (account ID, provider or service name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get a cloud account by ID
      responses:
        '200':
          description: Cloud account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateAccount
      tags: [Accounts]
      summary: Replace a cloud account (admin only)
      description: >
        Replaces the account's configuration with the request body; fields
        omitted from the body are cleared, and enabled defaults to false.
        The provider is validated but not changed. Stored credentials are
        not affected.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAccountRequest'
      responses:
        '200':
          description: >
            Updated account, built from the request (credentials_configured
            is always false here; read the account again for the stored value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another account with this provider and external_id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Delete a cloud account (admin only)
      description: >
        Deletes the account with its credentials and service overrides.
        Purchase executions in a terminal status are kept as history and
        detached from the account, and enabled plans that target only this
        account are disabled. The delete is refused while any other purchase
        execution still uses the account.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Deleted. The body is an empty JSON object.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Purchase executions still need the account. reason is
            pending_executions when pending or notified purchases must be
            canceled first, or active_executions when approved, running,
            scheduled or paused purchases must finish or be revoked or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteConflict'

  # ---- Account Registration ---------------------------------------------
  /api/register:
    post:
      operationId: submitRegistration
      tags: [Registrations]
      summary: Submit an account self-registration request
      description: >
        Public endpoint called by the federation IaC templates (or by hand) to
        ask an admin to onboard a cloud account. Creates a pending
        registration and notifies the admins. Rate limited per client IP.
        Keep the returned reference_token to poll GET /api/register/{token}.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Registration recorded as pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A pending registration already exists for this provider and external_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/register/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Reference token returned by POST /api/register (64 hex characters).
        schema:
          type: string
    get:
      operationId: getRegistrationStatus
      tags: [Registrations]
      summary: Get the status of a registration by its reference token
      description: >
        Public, limited view of a registration: only its status, creation
        time and, when rejected, the rejection reason.
      security: []
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/registrations:
    get:
      operationId: listRegistrations
      tags: [Registrations]
      summary: List account registrations (admin only)
      description: Returns matching registrations, newest first. Filters combine with AND.
      parameters:
        - name: status
          in: query
          description: Exact status match.
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: provider
          in: query
          description: Exact provider match.
          schema:
            type: string
            enum: [aws, azure, gcp]
        - name: search
          in: query
          description: >
            Case-insensitive substring match against account_name,
            external_id and contact_email. % and _ are matched literally.
          schema:
            type: string
      responses:
        '200':
          description: Registrations (empty array when none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountRegistration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/registrations/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: approveRegistration
      tags: [Registrations]
      summary: Approve a pending registration and create the cloud account (admin only)
      description: >
        The body has the same format as the account-create request,
        typically pre-filled from the registration and optionally edited.
        The registration moves to approved, a cloud account is created from
        the body, and any credential submitted with the registration is
        stored for the new account and wiped from the registration. The
        account is enabled when the registration carried a credential or its
        auth mode needs no stored secret; the body's enabled value is
        ignored. The contact email is notified of the decision.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAccountRequest'
      responses:
        '200':
          description: The created cloud account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The registration is not pending, another request processed it
            concurrently, or an account with this provider and external_id
            already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/registrations/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: rejectRegistration
      tags: [Registrations]
      summary: Reject a pending registration (admin only)
      description: >
        Moves the registration to rejected and notifies its contact email.
        The body is optional.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRegistrationRequest'
      responses:
        '200':
          description: The rejected registration (reference token omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The registration is not pending, or another request processed it
            concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/registrations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRegistration
      tags: [Registrations]
      summary: Get a registration by ID (admin only)
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteRegistration
      tags: [Registrations]
      summary: Delete a registration (admin only)
      description: Deletes the registration record in any status. A cloud account created by approving it is kept.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Deleted (status is "deleted")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---- Federation -------------------------------------------------------
  /api/federation/iac:
    get:
      operationId: getFederationIaC
      tags: [Federation]
      summary: Generate federation IaC for onboarding a target account
      description: >
        Renders generic infrastructure-as-code that sets up trust from a
        target cloud account to this CUDly deployment and self-registers the
        account. Requires view:accounts. The file is returned inside a JSON
        envelope: format=cli yields a shell script as plain text; every other
        format yields a zip archive, base64-encoded. format=cfn requires
        target=aws; format=bicep and format=arm require target=azure. When
        target equals source, CUDly must be deployed on that cloud.
      parameters:
        - name: target
          in: query
          required: true
          description: Cloud of the account being onboarded.
          schema:
            type: string
            enum: [aws, azure, gcp]
        - name: source
          in: query
          required: true
          description: Cloud whose identity CUDly uses to reach the target.
          schema:
            type: string
            enum: [aws, azure, gcp]
        - name: format
          in: query
          required: true
          description: >
            cli (shell script), bundle (Terraform module and tfvars, plus a
            CloudFormation fallback for target=aws), cfn (CloudFormation),
            bicep or arm (Azure templates).
          schema:
            type: string
            enum: [cli, bundle, cfn, bicep, arm]
      responses:
        '200':
          description: Generated file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationIaCResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >
            Server error, including a deployment whose own cloud identity
            (AWS account ID, Azure subscription or tenant, GCP project) cannot
            be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---- Inventory --------------------------------------------------------
  /api/inventory/commitments:
    get:
      operationId: listInventoryCommitments
      tags: [Inventory]
      summary: List active commitments
      description: >
        Requires `view:purchases` permission. Returns unexpired commitments
        from purchase history within the session's allowed accounts, soonest
        expiring first. An `account_id` outside the allowed accounts yields an
        empty list.
      parameters:
        - name: account_id
          in: query
          description: Cloud account ID or external account ID
          schema:
            type: string
        - name: provider
          in: query
          description: >
            Only return commitments of this provider (aws, azure or gcp).
            "all" means every provider. Any other value is a 400.
          schema:
            type: string
      responses:
        '200':
          description: Active commitments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCommitmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventory/coverage:
    get:
      operationId: getCoverageBreakdown
      tags: [Inventory]
      summary: Get commitment coverage by provider and service
      description: >
        Requires `view:purchases` permission. Covered monthly spend comes from
        active commitments (recurring cost plus amortized upfront); the
        on-demand gap comes from recommendation savings and is treated as zero
        if recommendations cannot be read. Always returns one section per
        provider (aws, azure, gcp).
      parameters:
        - name: account_id
          in: query
          description: Cloud account ID or external account ID
          schema:
            type: string
        - name: provider
          in: query
          description: >
            Only fill in this provider (aws, azure or gcp); the other
            providers are still listed, with no services. "all" means every
            provider. Any other value is a 400.
          schema:
            type: string
      responses:
        '200':
          description: Coverage breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageBreakdownResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- Commitment Laddering ---------------------------------------------
  /api/ladder/configs:
    get:
      operationId: listLadderConfigs
      tags: [Ladder]
      summary: List ladder configurations
      description: >
        Requires `view:config` permission. Only configurations for the
        session's allowed accounts are returned.
      responses:
        '200':
          description: Ladder configurations, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LadderConfigsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: upsertLadderConfig
      tags: [Ladder]
      summary: Create or update a ladder configuration
      description: >
        Requires `update:config` permission within the target account's scope.
        Upserts on (cloud_account_id, provider). Omitted numeric fields take
        their defaults; unknown fields are rejected. A write that arms the
        config (enabled with mode `auto_approve`) or raises or clears an armed
        config's cap also requires `execute:purchases`, and the admin API key
        is refused.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LadderConfigUpsertRequest'
      responses:
        '200':
          description: Stored configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LadderConfig'
        '400':
          description: >
            Invalid body, missing or invalid field, or the provider does not
            match the cloud account's provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The cloud account does not exist or is outside the session's allowed accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ladder/runs:
    get:
      operationId: listLadderRuns
      tags: [Ladder]
      summary: List ladder runs for an account
      description: >
        Requires `view:config` permission within the account's scope. Pages of
        up to 100 runs, oldest first. AWS accounts only.
      parameters:
        - name: account_id
          in: query
          required: true
          description: Cloud account ID
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          required: true
          description: Must match the account's provider; only aws is served.
          schema:
            type: string
        - name: after_created_at
          in: query
          description: >
            Cursor from `next_cursor.created_at` (RFC 3339). Send together
            with `after_id`.
          schema:
            type: string
            format: date-time
        - name: after_id
          in: query
          description: Cursor from `next_cursor.id`. Send together with `after_created_at`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page of runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LadderTimelineRunPage'
        '400':
          description: Missing account_id or provider, or an invalid cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            The account does not exist, is outside the session's allowed
            accounts, or has a different provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Ladder planning is available only for AWS accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Ladder timeline storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ladder/tranches:
    get:
      operationId: listLadderTranches
      tags: [Ladder]
      summary: List ladder tranches for an account
      description: >
        Requires `view:config` permission within the account's scope. Pages of
        up to 100 tranches, oldest first; totals cover every tranche of the
        account, not only the page. AWS accounts only.
      parameters:
        - name: account_id
          in: query
          required: true
          description: Cloud account ID
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          required: true
          description: Must match the account's provider; only aws is served.
          schema:
            type: string
        - name: after_created_at
          in: query
          description: >
            Cursor from `next_cursor.created_at` (RFC 3339). Send together
            with `after_id`.
          schema:
            type: string
            format: date-time
        - name: after_id
          in: query
          description: Cursor from `next_cursor.id`. Send together with `after_created_at`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page of tranches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LadderTimelinePage'
        '400':
          description: Missing account_id or provider, or an invalid cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            The account does not exist, is outside the session's allowed
            accounts, or has a different provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            A tranche has an unreadable amount basis or commitment rate, or
            another server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Ladder planning is available only for AWS accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Ladder timeline storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ladder/tranches/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      operationId: amendLadderTranche
      tags: [Ladder]
      summary: Amend a scheduled ladder tranche
      description: >
        Requires `update:config` permission within the tranche's account
        scope. Changes the amount and date of a future, scheduled tranche of a
        planned run that has no execution yet, guarded by `expected_revision`.
        AWS accounts only. A malformed ID answers 404.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LadderTrancheAmendment'
      responses:
        '200':
          description: Amended tranche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LadderTrancheAmendmentResult'
        '400':
          description: >
            Invalid body, a past scheduled_date, or the new amount would
            exceed the original run total, the current per-run cap or the
            config commitment ceiling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The tranche changed (revision mismatch) or is no longer editable:
            its run is not planned, it is not scheduled, it has an execution,
            or its date has passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Ladder planning is available only for AWS accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >
            The ladder lock is busy (retry after the Retry-After delay), or
            ladder amendment storage is unavailable.
          headers:
            Retry-After:
              description: Seconds to wait before retrying (lock busy only)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ladder/tranches/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: resolveLadderTranche
      tags: [Ladder]
      summary: Resolve a fired ladder tranche
      description: >
        Requires `execute:purchases` permission within the tranche's account
        scope; the admin API key is refused. Moves a fired tranche to failed
        when no execution of its retry chain can still run or has bought
        anything. If an execution's outcome is unknown, the request must set
        `acknowledge_unknown_outcome` and name the `cloud_check` performed. An
        identical repeat returns 200 with `replayed: true`. Outcome
        `completed` is not implemented yet (501). AWS accounts only. A
        malformed ID answers 404.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LadderTrancheResolveRequest'
      responses:
        '200':
          description: Tranche resolved as failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LadderTrancheResolveResponse'
        '400':
          description: >
            Invalid body (over 4096 bytes, unknown field, bad length or
            characters, acknowledge_unknown_outcome without cloud_check or the
            reverse), or a cloud_check that names another account or service,
            is dated in the future, or predates the last execution change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The tranche cannot be resolved: it is not fired (or was resolved
            with a different reason), an execution may still run or may have
            purchased, an unknown outcome was not acknowledged, or the chain
            changed too recently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >
            Outcome `completed` is not available yet, or the account is not an
            AWS account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Ladder resolve storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---- Notifications ----------------------------------------------------
  /api/notifications/unsubscribe:
    parameters:
      - name: token
        in: query
        required: true
        description: Signed token for the email and scope, from the email's unsubscribe link.
        schema:
          type: string
      - name: email
        in: query
        required: true
        description: Recipient address to mute.
        schema:
          type: string
      - name: scope
        in: query
        required: true
        description: Notification category to mute.
        schema:
          type: string
          enum: [purchase_approvals, ri_exchange_approvals]
    get:
      operationId: unsubscribeNotification
      tags: [Notifications]
      summary: Unsubscribe from a notification category (email link)
      description: >
        Verifies the signed token, records the mute for the email and scope,
        and returns an HTML confirmation page. Errors are returned as JSON.
      security: []
      responses:
        '200':
          description: Unsubscribed; HTML confirmation page
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid unsubscribe token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            Server error, including a deployment with no unsubscribe signing
            secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: unsubscribeNotificationOneClick
      tags: [Notifications]
      summary: One-click unsubscribe (RFC 8058)
      description: >
        The POST a mail client sends for a List-Unsubscribe-Post header.
        Same query parameters, effect and responses as the GET. The body
        must be exactly List-Unsubscribe=One-Click.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [List-Unsubscribe]
              additionalProperties: false
              properties:
                List-Unsubscribe:
                  type: string
                  enum: [One-Click]
      responses:
        '200':
          description: Unsubscribed; HTML confirmation page
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid unsubscribe token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            Server error, including a deployment with no unsubscribe signing
            secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---- Health -------------------------------------------------------------
  /health:
    get:
      operationId: healthCheckRoot
      tags: [Health]
      summary: Health check (root path)
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      operationId: readinessCheckRoot
      tags: [Health]
      summary: Readiness check (root path)
      description: >-
        Traffic-admission contract: answers 200 with the same payload as
        /health once this replica has completed initialization, 503 while any
        store check is pending or failed or migrations have not run yet. A
        failed migration run is reported in the body but still answers 200.
        /health is the liveness counterpart and always answers 200.
      security: []
      responses:
        '200':
          description: Replica is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Replica is still initializing or a store check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/health:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ---- Public Info --------------------------------------------------------
  /api/info:
    get:
      operationId: getPublicInfo
      tags: [Info]
      summary: Public instance information (version, admin status — no auth required)
      security: []
      responses:
        '200':
          description: Public info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInfoResponse'

  /api/info/deployment:
    get:
      operationId: getDeploymentInfo
      tags: [Info]
      summary: Deployment-scoped identifiers (AuthUser required)
      description: >
        Returns the Secrets Manager console URL and the deployment AWS account ID.
        Requires at least a valid user session. Not accessible to unauthenticated
        callers (closes #633).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Deployment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /version:
    get:
      operationId: getVersion
      tags: [Info]
      summary: Build version, git commit and build time (no auth required)
      security: []
      responses:
        '200':
          description: Build identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  # ---- Docs --------------------------------------------------------------
  /api/docs:
    get:
      operationId: swaggerUI
      tags: [Docs]
      summary: Swagger UI
      security: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
    head:
      operationId: swaggerUIHead
      tags: [Docs]
      summary: Swagger UI (headers only)
      security: []
      responses:
        '200':
          description: Same headers as GET, empty body

  /api/docs/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [Docs]
      summary: Raw OpenAPI specification
      security: []
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
    head:
      operationId: getOpenAPISpecHead
      tags: [Docs]
      summary: Raw OpenAPI specification (headers only)
      security: []
      responses:
        '200':
          description: Same headers as GET, empty body

  /docs:
    get:
      operationId: swaggerUIAlias
      tags: [Docs]
      summary: Swagger UI (alias)
      security: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
    head:
      operationId: swaggerUIAliasHead
      tags: [Docs]
      summary: Swagger UI (alias) (headers only)
      security: []
      responses:
        '200':
          description: Same headers as GET, empty body

  /docs/openapi.yaml:
    get:
      operationId: getOpenAPISpecAlias
      tags: [Docs]
      summary: Raw OpenAPI specification (alias)
      security: []
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
    head:
      operationId: getOpenAPISpecAliasHead
      tags: [Docs]
      summary: Raw OpenAPI specification (alias) (headers only)
      security: []
      responses:
        '200':
          description: Same headers as GET, empty body

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # ---- Security Schemes ---------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token returned by POST /api/auth/login
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key created via POST /api/api-keys

  # ---- Reusable Parameters ------------------------------------------------
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AccountID:
      name: account_id
      in: query
      schema:
        type: string

    StartDate:
      name: start
      in: query
      description: >
        Range start, as an RFC 3339 timestamp or YYYY-MM-DD. Defaults to 7
        days before end. The range may span at most 366 days.
      schema:
        type: string

    EndDate:
      name: end
      in: query
      description: >
        Range end, as an RFC 3339 timestamp or YYYY-MM-DD (a date includes
        the whole day). Defaults to now.
      schema:
        type: string

    AnalyticsAccountID:
      name: account_id
      in: query
      description: >
        Cloud account UUID. Required for callers restricted to specific
        accounts; empty means all accounts for unrestricted callers.
      schema:
        type: string

    HistoryProvider:
      name: provider
      in: query
      description: Filter by cloud provider; "all" or empty means no filter.
      schema:
        type: string
        enum: [aws, azure, gcp, all]

    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token from the login response
      schema:
        type: string

  # ---- Reusable Responses -------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Request understood but rejected by a business-rule guardrail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >
        An identical submit already holds the idempotency claim, so THIS
        request was not executed. The claim is retained unconditionally once
        taken, including when the earlier submit failed, so this response
        asserts nothing about that submit's outcome: it may still be running,
        it may have committed, its outcome may be unresolved (the provider
        call can fail after the operation was already submitted), or it may
        have failed without committing anything. Do not read a 409 as
        confirmation that the earlier submit succeeded. Verify its outcome
        with the provider before resubmitting.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EditorReconciliationRequired:
      description: >
        The plan is managed by the schedule editor and this legacy change
        needs the editor (code editor_reconciliation_required).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWithCode'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimiterUnavailable:
      description: >
        The rate limiter could not be reached, so this credential endpoint
        fails closed. Retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AnalyticsUnavailable:
      description: Analytics storage is not configured on this deployment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ---- Schemas ------------------------------------------------------------
  schemas:
    InsuranceStatus:
      type: object
      required: [missing, configured]
      properties:
        missing:
          type: array
          items: {type: string, enum: [ARCHERA_API_KEY_SECRET, ARCHERA_ORG_ID, ARCHERA_PLAN_ID]}
        configured: {type: boolean}

    ArcheraDecimal:
      type: string
      nullable: true
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      description: Exact finite decimal, without rounding; null means unknown and differs from zero.

    ArcheraFinancials:
      type: object
      description: Monthly rates use a 730-hour basis; Archera premium is included in total commitment cost.
      required: [monthly_730h_commitment_cost_total, monthly_730h_cloud_provider_cost, monthly_730h_archera_premium, monthly_730h_gross_savings, monthly_730h_net_savings, monthly_730h_covered_on_demand_cost]
      properties:
        monthly_730h_commitment_cost_total: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly_730h_cloud_provider_cost: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly_730h_archera_premium: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly_730h_gross_savings: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly_730h_net_savings: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly_730h_covered_on_demand_cost: {$ref: '#/components/schemas/ArcheraDecimal'}

    ArcheraTotals:
      allOf:
        - {$ref: '#/components/schemas/ArcheraFinancials'}
        - type: object
          required: [upfront_one_time_cost]
          properties:
            upfront_one_time_cost: {$ref: '#/components/schemas/ArcheraDecimal'}
      description: Flat monthly financial fields plus a separate one-time upfront amount.

    ArcheraProductSupport:
      type: object
      required: [status, underwriting_allowance, customer_eligibility]
      properties:
        status: {type: string}
        source: {type: string}
        evidence: {type: string}
        underwriting_allowance: {type: string}
        customer_eligibility: {type: string}

    ArcheraDelta:
      type: object
      required: [monthly_730h_net_savings, upfront_one_time_cost, discount_rate, breakeven_days]
      properties:
        monthly_730h_net_savings: {$ref: '#/components/schemas/ArcheraDecimal'}
        upfront_one_time_cost: {$ref: '#/components/schemas/ArcheraDecimal'}
        discount_rate: {$ref: '#/components/schemas/ArcheraDecimal'}
        breakeven_days: {$ref: '#/components/schemas/ArcheraDecimal'}

    ArcheraHypotheticalDelta:
      type: object
      required: [monthly_730h_net_savings, monthly_730h_commitment_cost, upfront_one_time_cost]
      properties:
        monthly_730h_net_savings: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly_730h_commitment_cost: {$ref: '#/components/schemas/ArcheraDecimal'}
        upfront_one_time_cost: {$ref: '#/components/schemas/ArcheraDecimal'}

    ArcheraLineItem:
      type: object
      required: [line_item_id, reason, actual_term, actual_payment_option, actual_commitment_type]
      properties:
        line_item_id: {type: string}
        reason: {type: string}
        actual_term: {type: string, nullable: true}
        actual_payment_option: {type: string, nullable: true}
        actual_commitment_type: {type: string, nullable: true}

    ArcheraHypothetical:
      type: object
      required: [contract_term, payment_option, totals, delta_vs_current, line_items]
      properties:
        contract_term: {type: string, nullable: true}
        payment_option: {type: string}
        totals: {$ref: '#/components/schemas/ArcheraTotals'}
        delta_vs_current: {$ref: '#/components/schemas/ArcheraHypotheticalDelta'}
        line_items: {type: array, items: {$ref: '#/components/schemas/ArcheraLineItem'}}

    ArcheraOffer:
      type: object
      required: [offer_id, is_current, provider, commitment_type, region, contract_term, payment_option, lease_attached, lease_menu_item_id, archera_product_support, discount_rate, breakeven_days, monthly, upfront_one_time_cost, delta_vs_current]
      properties:
        offer_id: {type: string}
        is_current: {type: boolean}
        provider: {type: string}
        commitment_type: {type: string}
        region: {type: string, nullable: true}
        contract_term: {type: string, nullable: true}
        payment_option: {type: string, nullable: true}
        lease_attached: {type: boolean}
        lease_menu_item_id: {type: string, nullable: true}
        archera_offer_name: {type: string, nullable: true}
        archera_offer_name_note: {type: string}
        archera_product_support: {$ref: '#/components/schemas/ArcheraProductSupport'}
        discount_rate: {$ref: '#/components/schemas/ArcheraDecimal'}
        breakeven_days: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly: {$ref: '#/components/schemas/ArcheraFinancials'}
        upfront_one_time_cost: {$ref: '#/components/schemas/ArcheraDecimal'}
        delta_vs_current: {$ref: '#/components/schemas/ArcheraDelta'}

    ArcheraRow:
      type: object
      required: [line_item_id, current, candidates]
      properties:
        line_item_id: {type: string}
        current: {$ref: '#/components/schemas/ArcheraOffer'}
        candidates: {type: array, items: {$ref: '#/components/schemas/ArcheraOffer'}}

    ArcheraComparison:
      type: object
      required: [title, plan_id, fetched_at, currency, currency_note, premium_included, basis_note, delta_basis_note, current, hypotheticals, rows, non_gating_disclosure, sponsorship_disclosure]
      properties:
        title: {type: string}
        plan_id: {type: string}
        fetched_at: {type: string, format: date-time}
        currency: {type: string, nullable: true, enum: [null]}
        currency_note: {type: string}
        premium_included: {type: boolean}
        basis_note: {type: string}
        delta_basis_note: {type: string}
        current: {$ref: '#/components/schemas/ArcheraTotals'}
        hypotheticals: {type: array, items: {$ref: '#/components/schemas/ArcheraHypothetical'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ArcheraRow'}}
        non_gating_disclosure: {type: string}
        sponsorship_disclosure: {type: string}

    ArcheraRecommendationComparison:
      type: object
      description: Existing internal recommendation DTO contract; no HTTP operation is advertised here. Resource association does not establish comparable economics.
      required: [recommendation_id, status, reason, amount_provenance, economic_status, fetched_at, currency, currency_note, comparable_delta, premium_included, current, candidates, non_gating_disclosure, sponsorship_disclosure]
      properties:
        recommendation_id: {type: string}
        status: {type: string}
        reason: {type: string}
        amount_provenance: {type: string}
        economic_status: {type: string}
        fetched_at: {type: string, format: date-time}
        currency: {type: string, nullable: true, enum: [null]}
        currency_note: {type: string}
        comparable_delta: {type: string, nullable: true, enum: [null]}
        premium_included: {type: boolean}
        current: {$ref: '#/components/schemas/ArcheraRecommendationOffer'}
        candidates: {type: array, items: {$ref: '#/components/schemas/ArcheraRecommendationAlternative'}}
        non_gating_disclosure: {type: string}
        sponsorship_disclosure: {type: string}

    ArcheraRecommendationOffer:
      type: object
      nullable: true
      description: Existing internal offer DTO; native duration is seconds. Candidate native identity stays null rather than inheriting current identity. Upfront cost is one-time; currency is not inferred.
      required: [offer_id, provider, commitment_type, hourly_selected_commitment, native_duration_seconds, native_plan_type, native_instance_family, effective_contract_term, payment_option, lease_attached, monthly, upfront_one_time_cost]
      properties:
        offer_id: {type: string}
        provider: {type: string}
        commitment_type: {type: string}
        hourly_selected_commitment: {$ref: '#/components/schemas/ArcheraDecimal'}
        native_duration_seconds: {$ref: '#/components/schemas/ArcheraDecimal'}
        native_plan_type: {type: string, nullable: true}
        native_instance_family: {type: string, nullable: true}
        effective_contract_term: {type: string, nullable: true}
        payment_option: {type: string, nullable: true}
        lease_attached: {type: boolean}
        monthly: {$ref: '#/components/schemas/ArcheraFinancials'}
        upfront_one_time_cost: {$ref: '#/components/schemas/ArcheraDecimal'}

    ArcheraRecommendationAlternative:
      type: object
      description: Existing internal candidate DTO; a candidate can have null figures when its basis is unproven.
      required: [offer_id, status, reason, native_identity_status, figures]
      properties:
        offer_id: {type: string}
        status: {type: string}
        reason: {type: string}
        native_identity_status: {type: string}
        figures: {$ref: '#/components/schemas/ArcheraRecommendationOffer'}

    # -- Azure RI exchange --------------------------------------------------
    AzureExchangeSource:
      type: object
      description: One Azure VM reservation to hand back in an exchange.
      required: [reservation_id, quantity]
      properties:
        reservation_id:
          type: string
          description: >
            Full ARM resource id of the reservation item, as returned by
            GET /api/ri-exchange/azure-instances, e.g.
            /providers/Microsoft.Capacity/reservationOrders/{orderId}/reservations/{reservationId}
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Number of instances to hand back.

    AzureExchangeableReservation:
      type: object
      description: >
        One Azure VM reservation eligible for exchange, as listed by
        GET /api/ri-exchange/azure-instances. An exchange buys its
        replacement reservations with the source's applied scope.
      required: [reservation_order_id, reservation_id, sku, quantity, instance_flexibility]
      properties:
        reservation_order_id:
          type: string
          description: GUID of the parent reservation order.
        reservation_id:
          type: string
          description: Full ARM resource id of the reservation item.
        billing_scope_id:
          type: string
          description: >
            ARM scope charged for the reservation, e.g. /subscriptions/{id}.
            Omitted when Azure did not report one; such a reservation cannot
            be exchanged.
        applied_scope_type:
          type: string
          description: >
            Who receives the reservation's discount. Only Shared and Single
            can be carried through an exchange; a source with any other
            value, or with none, is refused with 422 on compatible-offerings
            and execute. Omitted when Azure did not report one.
          example: Shared
        applied_scopes:
          type: array
          items:
            type: string
          description: >
            ARM scopes a Single-scoped reservation applies to (exactly one
            for an exchange). Omitted for Shared.
        sku:
          type: string
          description: VM size, e.g. Standard_D2s_v3.
        quantity:
          type: integer
          format: int32
          description: Number of VM instances covered.
        region:
          type: string
          description: ARM region name. May be omitted for Shared reservations.
        term:
          type: string
          description: Reservation term (P1Y, P3Y or P5Y).
        expiry_date:
          type: string
          format: date-time
        instance_flexibility:
          type: string
        display_name:
          type: string

    ExchangeTarget:
      type: object
      description: One AWS RI offering to acquire in an exchange.
      required: [offering_id, count]
      properties:
        offering_id:
          type: string
          format: uuid
        count:
          type: integer
          format: int32
          minimum: 1

    AzureExchangeTarget:
      type: object
      description: One Azure VM reservation to acquire in an exchange.
      required: [sku, location, term, quantity]
      properties:
        sku:
          type: string
          description: VM size to purchase, e.g. Standard_D4s_v3.
        location:
          type: string
          description: Azure region, e.g. eastus.
        term:
          type: string
          description: >
            Reservation term, validated against the Azure SDK's own term
            enum; any other value is a 400. Which of these Azure actually
            accepts depends on the resource type (VM reservations are sold
            for one and three years), so a term Azure does not offer for
            this SKU comes back as a policy error from the pricing call
            rather than being rejected here.
          enum: [P1Y, P3Y, P5Y]
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Number of instances to reserve.
        billing_scope_id:
          type: string
          description: >
            Optional, and NOT the scope that gets charged: the billing scope
            is always derived from subscription_id. Supplying a value that
            names a different subscription is a 400, so a caller cannot
            direct the charge away from the subscription their permission
            constraints were evaluated against. Omit it to charge the
            subscription's own scope.

    # -- Generic ------------------------------------------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ErrorWithCode:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable reason, for example editor_reconciliation_required.

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    DeletePlannedPurchaseResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        plan_disabled:
          type: boolean
          description: >-
            Present, and true, when the execution belongs to a plan, which
            the request disabled. Omitted for executions without a plan. A
            plan the caller may not disable fails the request instead of
            returning false.

    StatusMessageResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string

    # -- Auth ---------------------------------------------------------------
    LoginRequest:
      type: object
      description: >
        Either the password form (email, password, optional mfa_code) or the
        MFA token form (email, mfa_token, mfa_code). A body with both password
        and mfa_token is a 400.
      required: [email]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: Base64-encoded password. Required unless mfa_token is sent.
        mfa_code:
          type: string
          description: TOTP or recovery code. Required with mfa_token.
        mfa_token:
          type: string
          description: >
            The token from an mfa_required answer. Sent with email and
            mfa_code in place of password.

    LoginError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [mfa_required, invalid_mfa_code, invalid_mfa_token, invalid credentials]
        mfa_token:
          type: string
          description: Set with mfa_required. Single use; valid for 5 minutes and 3 code attempts.
        mfa_token_expires_at:
          type: string
          format: date-time
          description: Set with mfa_required.

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserInfo'
        csrf_token:
          type: string

    UserInfo:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, readonly]
        groups:
          type: array
          items:
            type: string
        mfa_enabled:
          type: boolean

    SetupAdminRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: Base64-encoded password

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          description: Base64-encoded new password

    ProfileUpdateRequest:
      type: object
      required: [email, current_password]
      properties:
        email:
          type: string
          format: email
        current_password:
          type: string
          description: Base64-encoded current password
        new_password:
          type: string
          description: Base64-encoded new password (optional)

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: Base64-encoded current password
        new_password:
          type: string
          description: Base64-encoded new password

    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        mfa_enabled:
          type: boolean

    AdminExistsResponse:
      type: object
      properties:
        admin_exists:
          type: boolean

    # -- Users / Groups -----------------------------------------------------
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, readonly]
        groups:
          type: array
          items:
            type: string
        mfa_enabled:
          type: boolean
        active:
          type: boolean
          description: Whether the account is active. A deactivated user's existing sessions are revoked and cannot be restored via password reset.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: Base64-encoded password
        role:
          type: string
          enum: [admin, user, readonly]
        groups:
          type: array
          items:
            type: string

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, readonly]
        groups:
          type: array
          items:
            type: string
        active:
          type: boolean
          description: Set false to deactivate the user (revokes their existing sessions); set true to reactivate. Omit to leave unchanged.

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        allowed_accounts:
          type: array
          description: >
            Cloud accounts the group may reach: account IDs (or provider
            external IDs), or "*" for all accounts. Entries match by ID only;
            a display name stored before #1034 that no longer identifies its
            account matches nothing.
          items:
            type: string
        system_managed:
          type: boolean
          readOnly: true
          description: >
            True for a built-in group seeded and maintained by migrations
            (for example Administrators and Purchaser). Updating or deleting
            it returns 403. Omitted when false.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGroupRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        allowed_accounts:
          type: array
          description: >
            Account IDs, provider external IDs, or "*". A display name is
            accepted only when exactly one registered account that the caller
            can access carries it, and is stored as that account's ID, so the
            grant stays with the account after a rename. Any other entry is
            rejected with 400.
          items:
            type: string

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        allowed_accounts:
          type: array
          description: >
            Account IDs, provider external IDs, or "*". A display name is
            accepted only when exactly one registered account that the caller
            can access carries it, and is stored as that account's ID, so the
            grant stays with the account after a rename. Any other entry is
            rejected with 400.
          items:
            type: string

    Permission:
      type: object
      required: [action, resource]
      properties:
        action:
          type: string
        resource:
          type: string
        constraints:
          $ref: '#/components/schemas/PermissionConstraint'

    PermissionConstraint:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: string
        providers:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
        max_amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: >-
            Spend cap per purchase. Omit for no cap. An explicit 0 is rejected
            with 400 on group writes (create and update) and on API-key
            creation.

    # -- API Keys -----------------------------------------------------------
    CreateAPIKeyRequest:
      type: object
      required: [name, password, permissions, expires_at]
      properties:
        name:
          type: string
        password:
          type: string
          description: Base64-encoded password, re-verified before minting the key
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          minItems: 1
          description: |
            At least one permission is required. An unscoped key would
            authenticate its owner but authorize nothing (issue #61), so the
            API rejects an empty or missing list with 400 rather than
            accepting a key that can never be used.
        expires_at:
          type: string
          format: date-time
          description: Required and capped at the server-side maximum API key lifetime

    CreateAPIKeyResponse:
      type: object
      properties:
        api_key:
          type: string
          description: Full key value (shown only once)
        key_id:
          type: string
        info:
          $ref: '#/components/schemas/APIKeyInfo'

    APIKeyInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: First 8 characters for display
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        request_count_total:
          type: integer
          format: int64
          nullable: true
          description: |
            Lifetime request count since the key was created. Null when the
            count is unknown: keys already in use before migration 000094
            introduced the counter have no recoverable lifetime figure, and
            reporting 0 for them would assert a volume nobody measured. A key
            that has genuinely never been used reports 0, not null.
        request_count_window:
          type: integer
          format: int64
          description: |
            Request count since request_count_window_start. This is a
            FIXED/TUMBLING window, not a true trailing-24h rolling count:
            once the window is older than 24h, the next request restarts
            both this count and request_count_window_start, discarding
            whatever count the previous window had even if some of those
            requests happened within the preceding 24h.

            Reported as 0 once the window is older than 24h, even though
            the underlying row still holds the closed window's count until
            the key is used again: a key that went idle has no current
            activity. Use request_count_window_start to see exactly which
            period this count covers.
        request_count_window_start:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp the current request_count_window began at. Null when
            the key has never recorded a request, and also null once the
            window has closed, since there is then no current period for
            the count to refer to.

    APIKeysUsageStats:
      type: object
      properties:
        total_active:
          type: integer
          description: |
            Number of the caller's API keys that are currently usable, i.e.
            neither revoked nor past their expiry. Matches the keys the
            authentication path will accept.
        total_requests_window:
          type: integer
          format: int64
          description: |
            Sum of request_count_window across the caller's keys, counting
            only windows that are still open. Each summand is a fixed-window
            count (see APIKeyInfo.request_count_window), not a true rolling
            24h total, and the windows are not aligned with each other.
        total_requests_lifetime:
          type: integer
          format: int64
          description: |
            Sum of request_count_total across the caller's keys, counting only
            the keys whose lifetime count is known. See lifetime_partial.
        lifetime_partial:
          type: boolean
          description: |
            True when at least one key was excluded from total_requests_lifetime
            because its usage predates the counters, making that total a lower
            bound rather than an exact figure.
        top_keys:
          type: array
          description: |
            Top keys by request_count_window (lifetime count as
            tiebreaker). At most 3 entries; keys with zero window
            activity are omitted.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              key_prefix:
                type: string
              request_count_window:
                type: integer
                format: int64

    # -- Configuration ------------------------------------------------------
    ConfigResponse:
      type: object
      properties:
        global:
          $ref: '#/components/schemas/GlobalConfig'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceConfig'

    GlobalConfig:
      type: object
      properties:
        enabled_providers:
          type: array
          items:
            type: string
            enum: [aws, azure, gcp]
        notification_email:
          type: string
          format: email
          nullable: true
        approval_required:
          type: boolean
        default_term:
          type: integer
          description: Term in years (1 or 3)
        default_payment:
          type: string
          enum: [no-upfront, partial-upfront, all-upfront]
        default_coverage:
          type: number
          format: double
          description: Target coverage percentage (0-100)
        default_ramp_schedule:
          type: string
          enum: [immediate, weekly-25pct, monthly-10pct, custom]

    ServiceConfig:
      type: object
      properties:
        provider:
          type: string
        service:
          type: string
        enabled:
          type: boolean
        term:
          type: integer
        payment:
          type: string
        coverage:
          type: number
          format: double
        ramp_schedule:
          type: string
        include_engines:
          type: array
          items:
            type: string
        exclude_engines:
          type: array
          items:
            type: string
        include_regions:
          type: array
          items:
            type: string
        exclude_regions:
          type: array
          items:
            type: string
        include_types:
          type: array
          items:
            type: string
        exclude_types:
          type: array
          items:
            type: string
        min_count:
          type: integer
          minimum: 0
          description: |
            Minimum instance/node count a recommendation must carry to be
            surfaced (GUI/persisted equivalent of the CLI --min-count flag).
            0 (default) disables the filter.

    CommitmentOptionsResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
          description: |
            `ok` means `aws` carries the probed combos. `unavailable` means
            the probe hasn't run (no AWS account connected) or the most
            recent attempt failed; the frontend should use hardcoded
            defaults.
        aws:
          type: object
          description: |
            Per-service supported (term, payment) tuples. Keys are service
            identifiers (rds, elasticache, opensearch, redshift, memorydb,
            ec2). Omitted when status is `unavailable`.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/CommitmentOptionCombo'

    CommitmentOptionCombo:
      type: object
      required: [term, payment]
      properties:
        term:
          type: integer
          enum: [1, 3]
          description: Commitment length in years.
        payment:
          type: string
          enum: [all-upfront, partial-upfront, no-upfront]

    # -- Dashboard ----------------------------------------------------------
    DashboardSummary:
      type: object
      properties:
        potential_monthly_savings:
          type: number
          format: double
        total_recommendations:
          type: integer
        active_commitments:
          type: integer
        committed_monthly:
          type: number
          format: double
        current_coverage:
          type: number
          format: double
          nullable: true
          description: >-
            Committed / (committed + potential) monthly savings, as a
            percentage. Null when both are zero, so there is nothing to
            measure.
        target_coverage:
          type: number
          format: double
        ytd_savings:
          type: number
          format: double
        by_service:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceSavings'

    ServiceSavings:
      type: object
      properties:
        potential_savings:
          type: number
          format: double
        current_savings:
          type: number
          format: double

    UpcomingPurchaseResponse:
      type: object
      properties:
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingPurchase'

    UpcomingPurchase:
      type: object
      properties:
        execution_id:
          type: string
        plan_name:
          type: string
        scheduled_date:
          type: string
          format: date
        provider:
          type: string
        service:
          type: string
        step_number:
          type: integer
        total_steps:
          type: integer
        estimated_savings:
          type: number
          format: double
        has_recommendations:
          type: boolean
          description: >
            False for a plan step that carries no recommendations;
            estimated_savings is then a placeholder, not data (platform#609).

    # -- Recommendations ----------------------------------------------------
    RecommendationsResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationRecord'
        regions:
          type: array
          items:
            type: string
        summary:
          type: object
          description: Totals over the full filtered set, not just the returned page.
          properties:
            total_count:
              type: integer
            total_monthly_savings:
              type: number
              format: double
            total_upfront_cost:
              type: number
              format: double
            avg_payback_months:
              type: number
              format: double
        next_cursor:
          type: string
          description: >-
            Present only on a paginated request that has more rows; pass it as
            the cursor query parameter to fetch the next page. Its absence is
            the only end-of-list signal: a page with fewer rows than limit is
            not necessarily the last one, because each page is also capped by
            serialized size.

    RecommendationRecord:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        service:
          type: string
        region:
          type: string
        resource_type:
          type: string
        engine:
          type: string
        cloud_account_id:
          type: string
          nullable: true
          description: >
            The cloud account this recommendation belongs to. Matched
            against the stored recommendation set together with provider,
            service, region, resource_type, engine, term and payment
            (#1905); an account-scoped recommendation cannot be resolved
            without it. Null or omitted only for recommendations that are
            not tied to a specific account.
        count:
          type: integer
        recommended_count:
          type: integer
          description: >
            The pre-scaling count originally recommended, before any
            Capacity % scaling was applied to produce count. Optional:
            omitted or 0 means "not supplied" and the capacity-consistency
            check is skipped for this recommendation. For a Savings Plan,
            the stored value of this field is also the count that count
            must equal, since Savings Plans are priced by hourly commitment
            rather than by count.
        term:
          type: integer
        payment:
          type: string
        upfront_cost:
          type: number
          format: double
        monthly_cost:
          type: number
          format: double
        savings:
          type: number
          format: double
        selected:
          type: boolean
        purchased:
          type: boolean
        purchase_id:
          type: string
        error:
          type: string

    RefreshResponse:
      type: object
      required: [started_at, last_collected_at]
      properties:
        started_at:
          type: string
          format: date-time
          description: When this collection started.
        last_collected_at:
          type: string
          format: date-time
          nullable: true
          description: Previous successful collection, or null if none.

    RecommendationsFreshness:
      type: object
      required: [last_collected_at, last_collection_error, last_collection_started_at, last_collection_partial]
      properties:
        last_collected_at:
          type: string
          format: date-time
          nullable: true
          description: When recommendations were last persisted; null on a cold start.
        last_collection_error:
          type: string
          nullable: true
          description: Error from the most recent collection when a provider failed; null otherwise.
        last_collection_started_at:
          type: string
          format: date-time
          nullable: true
          description: Set while a collection is in flight.
        last_collection_partial:
          $ref: '#/components/schemas/RecommendationsCollectionPartial'

    RecommendationsCollectionPartial:
      type: object
      nullable: true
      description: >
        Non-null when the most recent persisted collection kept rows from
        at least one incomplete sweep. Cleared by the next collection whose
        sweeps are all complete. Carries counts and reason categories only.
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/PartialProviderSweep'

    PartialProviderSweep:
      type: object
      required: [provider, incomplete_accounts, attempted_scopes, failed_scopes, failed_details, skipped_recommendations, reasons]
      properties:
        provider:
          type: string
          enum: [aws, azure, gcp]
        incomplete_accounts:
          type: integer
          description: Accounts (or the ambient host identity) whose sweep was incomplete.
        attempted_scopes:
          type: integer
          description: >
            Scopes (Azure subscriptions, GCP projects) the incomplete sweeps
            were asked to cover; 0 when the provider does not report it (AWS).
        failed_scopes:
          type: integer
          description: Scopes that could not be queried.
        failed_details:
          type: integer
          description: Individual recommendation details rejected inside answering scopes (AWS).
        skipped_recommendations:
          type: integer
          description: >
            Recommendations the provider dropped as invalid (GCP: non-USD,
            malformed amount or plan, unrecognized term) while returning the
            rest. Their accounts' sweeps were complete.
        reasons:
          type: object
          description: >
            Failure count per reason category. Keys are drawn from a closed
            set: permission_denied, throttled, timeout, canceled, not_found,
            provider_unavailable, other.
          additionalProperties:
            type: integer
          example:
            permission_denied: 2
            throttled: 1

    # -- Plans --------------------------------------------------------------
    PlansResponse:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanWithHealth'

    PlanRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        auto_purchase:
          type: boolean
        notification_days_before:
          type: integer
        max_step_commitment:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: >-
            Ceiling on the total commitment (upfront + monthly * term) one ramp
            step may auto-purchase. Omit on create for no cap (auto-purchase of
            steps with recommendations is then refused); omit on update to keep
            the current cap. On update, explicit null clears a manual plan's
            cap and is refused while auto_purchase is true.
        provider:
          type: string
        service:
          type: string
        term:
          type: integer
        payment:
          type: string
        target_coverage:
          type: integer
          minimum: 1
          maximum: 100
          description: Percentage, 1 to 100. Defaults to 80 when omitted on create.
        ramp_schedule:
          type: string
          enum: [immediate, weekly-25pct, monthly-10pct, custom]
        custom_step_percent:
          type: integer
        custom_interval_days:
          type: integer
        target_accounts:
          type: array
          minItems: 1
          description: >
            UUIDs of cloud accounts the plan will purchase for. Required on
            POST /plans — a plan must be tied to at least one account. Sending
            an empty array returns HTTP 400.
          items:
            type: string
            format: uuid

    PurchasePlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        auto_purchase:
          type: boolean
        notification_days_before:
          type: integer
        max_step_commitment:
          type: number
          nullable: true
          description: Cap on the total commitment one ramp step may auto-purchase; null means auto-purchase of steps with recommendations is refused.
        services:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceConfig'
        ramp_schedule:
          $ref: '#/components/schemas/RampSchedule'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        next_execution_date:
          type: string
          format: date-time
          nullable: true
        last_execution_date:
          type: string
          format: date-time
          nullable: true
        last_notification_sent:
          type: string
          format: date-time
          nullable: true

    # PlanWithHealth wraps PurchasePlan with a read-time-only health-score
    # badge (issue #340 follow-up): score/factors are computed from the
    # plan's attributes and recent executions, never persisted, so they
    # can't drift into the PurchasePlan schema above.
    PlanWithHealth:
      allOf:
        - $ref: '#/components/schemas/PurchasePlan'
        - type: object
          properties:
            health_score:
              type: integer
              nullable: true
              minimum: 0
              maximum: 100
              description: >
                0-100 plan health score. Green >= 80, amber 50-79, red < 50.
                Null when the score could not be computed because one of its
                required inputs was unavailable: the plan's execution counts,
                or the stuck-ramp report that ramp_blocked is derived from.
                Every factor only ever subtracts, so a score computed without
                one of them would read healthier than the plan is; the whole
                score is withheld instead. Clients must render null as
                "unknown" rather than substituting a default.
            health_factors:
              type: array
              items:
                $ref: '#/components/schemas/PlanHealthFactor'

    PlanHealthFactor:
      type: object
      description: One penalty subtracted from a plan's health score, named so a bad score is actionable instead of opaque.
      properties:
        code:
          type: string
          description: >
            Which check produced the penalty. The two execution-based codes
            (failed_executions, canceled_executions) count only executions
            that entered that state within the trailing execution-retention
            window (30 days), not over all history, so they describe the
            plan's recent behaviour rather than its lifetime record.
            ramp_blocked is derived from the execution rows of the plan's next
            ramp step, not time-windowed, and pre-empts stalled /
            behind_schedule: it means the step cannot complete because one of
            its executions (one per cloud account, once the step has fanned
            out) failed with no retry in flight, as opposed to the plan merely
            running late. The remaining codes are derived from the plan's
            current attributes and ramp schedule.
          enum: [overdue, failed_executions, canceled_executions, ramp_blocked, stalled, behind_schedule, disabled_midway]
        penalty:
          type: integer
          description: Points subtracted from 100 by this factor.
        note:
          type: string
          description: >
            Human-readable reason for display in the badge tooltip. Free
            text, and its wording may change; clients must branch on `code`
            rather than parsing this.

    RampSchedule:
      type: object
      properties:
        type:
          type: string
          enum: [immediate, weekly, monthly, custom]
        percent_per_step:
          type: number
          format: double
        step_interval_days:
          type: integer
        current_step:
          type: integer
        total_steps:
          type: integer
        start_date:
          type: string
          format: date-time

    CreatePlannedPurchasesRequest:
      type: object
      properties:
        count:
          type: integer
        start_date:
          type: string
          format: date
          description: >
            First purchase date (YYYY-MM-DD), interpreted as midnight UTC.
            Must be after the current time, so the earliest accepted value
            is tomorrow's date in UTC.

    CreatePlannedPurchasesResponse:
      type: object
      properties:
        created:
          type: integer

    # -- Purchases ----------------------------------------------------------
    ExecutePurchaseRequest:
      type: object
      required: [recommendations]
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationRecord'
          minItems: 1
          maxItems: 1000
          description: >
            Each item must match a recommendation in the current recommendation set on
            (provider, cloud_account_id, service, region, resource_type, engine, term,
            payment). Only count, recommended_count and selected are honoured; every other
            field (including id, details, upfront_cost, monthly_cost, savings,
            on_demand_cost, purchased, purchase_id and error) is replaced server-side from
            the stored recommendation, with the cost fields scaled by count. The spend-cap
            check, execution record and approval email use those replaced values. Savings
            plan items must keep the recommended count.

    ExecutePurchaseResponse:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        status:
          type: string
        recommendation_count:
          type: integer
        total_upfront_cost:
          type: number
          format: double
        estimated_savings:
          type: number
          format: double
        message:
          type: string

    PurchaseExecution:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        plan_id:
          type: string
        plan_name:
          type: string
        status:
          type: string
          # Migration 000089 (expand-contract rename, cancelled -> canceled):
          # both spellings are valid during the rolling deploy window. New code
          # writes "canceled" (US); rows written by old code retain "cancelled"
          # until the CONTRACT migration (#1278) normalizes them, at which
          # point the legacy entry can be removed from this enum.
          enum: [pending, notified, approved, canceled, cancelled, completed, failed, running, paused]
        step_number:
          type: integer
        scheduled_date:
          type: string
          format: date
        total_upfront_cost:
          type: number
          format: double
        estimated_savings:
          type: number
          format: double
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationRecord'
        notification_sent:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string

    PlannedPurchasesResponse:
      type: object
      properties:
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/PlannedPurchase'

    PlannedPurchase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
        plan_name:
          type: string
        scheduled_date:
          type: string
          format: date
        provider:
          type: string
        service:
          type: string
        resource_type:
          type: string
        region:
          type: string
        count:
          type: integer
        term:
          type: integer
        payment:
          type: string
        estimated_savings:
          type: number
          format: double
        upfront_cost:
          type: number
          format: double
        has_recommendations:
          type: boolean
          description: >
            False for a plan step that carries no recommendations; count,
            resource_type, upfront_cost and estimated_savings are then
            placeholders, not data (platform#609).
        status:
          type: string
        step_number:
          type: integer
        total_steps:
          type: integer

    RunPurchaseResponse:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        status:
          type: string
        message:
          type: string

    # -- History / Analytics ------------------------------------------------
    HistoryResponse:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/HistorySummary'
        summary_complete:
          type: boolean
          description: >-
            True when summary counts and sums every row matching the request's
            filters and the caller's account scope, including rows beyond the
            row caps. False only when that aggregate failed and summary fell
            back to the rows in purchases, which under-reports when truncated
            is true.
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseHistoryRecord'
        truncated:
          type: boolean
          description: >-
            True when a fetch reached its row cap, so older rows (and possibly
            pending approvals) may be missing from purchases. summary still
            counts them while summary_complete is true. May
            be a false positive when exactly `limit` or `executions_limit` rows exist.
            Also true when the actionable executions class (pending, approved,
            running, ...) reached its own cap (`actionable_executions_limit`),
            and when listing either execution class failed, so its rows are
            missing.
        limit:
          type: integer
          description: >-
            Page size: the most completed purchases and terminal executions
            together that this response lists.
        executions_limit:
          type: integer
          description: >-
            Row cap on terminal executions (failed, expired, canceled, ...).
            They share the page with completed purchases, so it equals
            `limit`. Actionable executions use the separate
            `actionable_executions_limit` cap.
        actionable_executions_limit:
          type: integer
          description: >-
            Row cap on actionable executions (pending, notified, scheduled,
            approved, running, paused), fixed at 1000 and ignoring the limit
            parameter. Actionable executions are listed on the first page only.
        has_more:
          type: boolean
          description: >-
            True when more completed purchases or terminal executions the
            caller may see follow this page; fetch them with `next_cursor`.
            `truncated` is also true then. When `truncated` is true and
            `has_more` is false, the missing rows cannot be paged to: the
            actionable executions reached their cap, or an execution listing
            failed.
        next_cursor:
          type: string
          description: >-
            Opaque position after the last paged row of this response; pass it
            as the `cursor` parameter to fetch the next page. Present only when
            `has_more` is true.

    HistorySummary:
      type: object
      description: >-
        Counts and dollar totals. Dollar totals cover completed, non-revoked
        rows only; audit-gap and partially completed execution rows count as
        completed without dollars, and canceled rows count only toward
        total_purchases. Revoked rows count toward total_purchases and
        total_revoked only.
      properties:
        total_purchases:
          type: integer
        total_completed:
          type: integer
        total_pending:
          type: integer
          description: Rows with status pending, notified or scheduled.
        total_in_progress:
          type: integer
          description: Rows with status approved, running or paused.
        total_failed:
          type: integer
        total_expired:
          type: integer
        total_revoked:
          type: integer
          description: Revoked commitments; excluded from total_completed.
        total_upfront:
          type: number
          format: double
          nullable: true
        total_monthly_savings:
          type: number
          format: double
        total_annual_savings:
          type: number
          format: double

    PurchaseHistoryRecord:
      type: object
      description: >-
        One completed purchase_history row or one synthesized execution row
        (pending, failed, expired, ...). Fields marked as execution-only are
        computed at read time and absent from completed rows.
      properties:
        account_id:
          type: string
        purchase_id:
          type: string
          description: Provider purchase ID, or the execution ID on execution rows.
        timestamp:
          type: string
          format: date-time
        provider:
          type: string
        service:
          type: string
        region:
          type: string
        resource_type:
          type: string
        count:
          type: integer
        term:
          type: integer
        payment:
          type: string
        upfront_cost:
          type: number
          format: double
          nullable: true
        monthly_cost:
          type: number
          format: double
          nullable: true
          description: >-
            Null when the provider returned no monthly recurring breakdown.
            Aggregations skip nulls rather than counting them as 0.
        estimated_savings:
          type: number
          format: double
        plan_id:
          type: string
        plan_name:
          type: string
        ramp_step:
          type: integer
        cloud_account_id:
          type: string
        status:
          type: string
          description: >-
            "completed" for purchase_history rows. Execution rows carry the
            execution status: pending, notified, scheduled, approved,
            running, paused, completed, partially_completed, failed, expired
            or canceled (legacy rows may say "cancelled").
        approver:
          type: string
          description: Approval recipient email; pending and notified rows only.
        source:
          type: string
        status_description:
          type: string
          description: Short explanation for non-completed rows.
        created_by_user_id:
          type: string
          description: Execution-only.
        created_by_system:
          type: boolean
          description: Execution-only. True for scheduler-created executions.
        retry_execution_id:
          type: string
          description: Execution-only. Successor execution when this row was retried.
        retry_attempt_n:
          type: integer
          description: Execution-only. Position in the retry chain (0 for the original).
        ops_hint:
          type: string
          description: Execution-only. Operator hint shown instead of Retry on failed rows.
        redrive_unsafe:
          type: boolean
          description: Execution-only. True when ops_hint is a permanent re-drive refusal.
        is_audit_gap:
          type: boolean
          description: >-
            Execution-only. A completed purchase whose history write failed;
            its dollars are excluded from the summary totals.
        created_by_user_email:
          type: string
          description: Execution-only. Email of the user who created the execution.
        revocation_window_closes_at:
          type: string
          format: date-time
          description: End of the provider's free-cancel window, when it has one.
        revoked_at:
          type: string
          format: date-time
        revoked_via:
          type: string
          description: direct-api or support-case.
        support_case_id:
          type: string
        calc_refund_amount:
          type: number
          format: double
          description: Refund amount quoted when the revoke was calculated.
        calc_refund_currency:
          type: string
        revocation_in_flight:
          type: boolean
        offering_class:
          type: string
          description: standard or convertible (AWS RIs).
        listing_id:
          type: string
        listing_state:
          type: string
          description: Marketplace listing state (active, pending, cancelled or closed).

    AnalyticsResponse:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        interval:
          type: string
        summary:
          $ref: '#/components/schemas/HistorySummary'
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/HistoryDataPoint'

    HistoryDataPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        total_savings:
          type: number
          format: double
        total_upfront:
          type: number
          format: double
          nullable: true
        purchase_count:
          type: integer
        cumulative_savings:
          type: number
          format: double
        by_service:
          type: object
          additionalProperties:
            type: number
            format: double
        by_provider:
          type: object
          additionalProperties:
            type: number
            format: double

    BreakdownResponse:
      type: object
      properties:
        dimension:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BreakdownValue'

    BreakdownValue:
      type: object
      properties:
        total_savings:
          type: number
          format: double
        total_upfront:
          type: number
          format: double
          nullable: true
        purchase_count:
          type: integer
        percentage:
          type: number
          format: double

    # -- Health -------------------------------------------------------------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        message:
          type: string
          description: Fixed human-readable text; never a raw error string.
        reason:
          type: string
          description: Stable code for a failed check, e.g. db_unreachable or migration_failed.

    # -- Info ---------------------------------------------------------------
    PublicInfoResponse:
      type: object
      description: >
        Unauthenticated public info. Only safe-to-expose fields are included.
        Sensitive identifiers (API key secret URL, AWS account ID) are served
        by the authenticated /api/info/deployment endpoint (#633).
      properties:
        version:
          type: string
        admin_exists:
          type: boolean

    DeploymentInfoResponse:
      type: object
      description: >
        Deployment-scoped identifiers. Requires AuthUser. Not accessible to
        unauthenticated callers (#633).
      properties:
        api_key_secret_url:
          type: string
          description: AWS Console deep-link to the Secrets Manager secret holding the API key.
        deployment_aws_account_id:
          type: string
          description: >
            AWS account ID of the CUDly Lambda deployment (from STS GetCallerIdentity).
            Present only on AWS-hosted deployments; omitted on Azure/GCP or when STS
            is unreachable. Used by the frontend to distinguish legitimate ambient-credential
            executions (cloud_account_id IS NULL because the rec targets this account)
            from orphan rows whose account was deleted (issue #608).

    CloudAccount:
      type: object
      description: A managed cloud account (AWS account, Azure subscription or GCP project).
      required: [id, name, enabled, provider, external_id, credentials_configured, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        contact_email:
          type: string
        enabled:
          type: boolean
        provider:
          type: string
          enum: [aws, azure, gcp]
        external_id:
          type: string
          description: AWS account ID, Azure subscription ID or GCP project ID.
        aws_auth_mode:
          type: string
          description: Empty for accounts imported by org discovery until configured.
        aws_role_arn:
          type: string
        aws_external_id:
          type: string
          description: sts:ExternalId used when assuming aws_role_arn.
        aws_bastion_id:
          type: string
          description: ID of the cloud account whose credentials are used as the bastion.
        aws_web_identity_token_file:
          type: string
        aws_is_org_root:
          type: boolean
        azure_subscription_id:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_auth_mode:
          type: string
        gcp_project_id:
          type: string
        gcp_client_email:
          type: string
        gcp_auth_mode:
          type: string
        gcp_wif_audience:
          type: string
          description: Workload Identity Pool provider resource used as the STS audience.
        credentials_configured:
          type: boolean
          description: True when at least one credential is stored for the account.
        is_self:
          type: boolean
          description: >
            Present (true) on the account that matches CUDly's own host
            identity. Set by GET /api/accounts and POST /api/accounts/self only.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string

    CloudAccountRequest:
      type: object
      description: >
        Create or replace a cloud account. Provider-specific fields are
        stored as sent. For AWS, aws_external_id is required (16 to 1224
        characters from letters, digits and _+=,.@:/-) when aws_auth_mode is
        role_arn or bastion and aws_role_arn is set.
      required: [name, provider, external_id]
      properties:
        name:
          type: string
          description: Must not contain control characters.
        provider:
          type: string
          enum: [aws, azure, gcp]
        external_id:
          type: string
          description: >
            AWS account ID, Azure subscription ID or GCP project ID. Must not
            contain control characters.
        description:
          type: string
        contact_email:
          type: string
          format: email
        enabled:
          type: boolean
          description: Defaults to false when omitted.
        aws_auth_mode:
          type: string
          enum: [access_keys, role_arn, bastion, workload_identity_federation]
        aws_role_arn:
          type: string
          description: IAM role ARN in any AWS partition.
        aws_external_id:
          type: string
        aws_bastion_id:
          type: string
        aws_web_identity_token_file:
          type: string
          description: >
            Must start with /var/run/secrets/eks.amazonaws.com/serviceaccount/
            or /var/run/secrets/kubernetes.io/serviceaccount/ and must not
            contain "..".
        aws_is_org_root:
          type: boolean
        azure_subscription_id:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_auth_mode:
          type: string
          enum: [client_secret, managed_identity, workload_identity_federation]
        gcp_project_id:
          type: string
        gcp_client_email:
          type: string
          description: Service account email (name@project.iam.gserviceaccount.com).
        gcp_auth_mode:
          type: string
          enum: [service_account, application_default, workload_identity_federation]
        gcp_wif_audience:
          type: string

    AccountSummary:
      type: object
      description: Minimal account projection without credential or configuration fields.
      required: [id, name, external_id, provider]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        external_id:
          type: string
        provider:
          type: string
          enum: [aws, azure, gcp]

    AccountCredentialsRequest:
      type: object
      required: [credential_type, payload]
      properties:
        credential_type:
          type: string
          enum: [aws_access_keys, azure_client_secret, gcp_service_account, gcp_workload_identity_config]
        payload:
          type: object
          additionalProperties: true
          description: >
            Credential fields, at most two levels deep; unknown keys are
            rejected. aws_access_keys requires access_key_id and
            secret_access_key. azure_client_secret requires client_secret.
            gcp_service_account takes a service account key JSON (type
            service_account with project_id, private_key and client_email).
            gcp_workload_identity_config takes an external_account credential
            configuration JSON (audience, subject_token_type, token_url and a
            credential_source object).

    AccountTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string

    OverrideTransferRow:
      type: object
      description: >
        One override in an export or import file. account_name, created_at
        and updated_at are informational and ignored on import.
      required: [provider, service]
      properties:
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        account_external_id:
          type: string
        provider:
          type: string
          enum: [aws, azure, gcp]
        service:
          type: string
        enabled:
          type: boolean
        term:
          type: integer
        payment:
          type: string
        coverage:
          type: number
          format: double
        ramp_schedule:
          type: string
          maxLength: 32
        include_engines:
          type: array
          items:
            type: string
        exclude_engines:
          type: array
          items:
            type: string
        include_regions:
          type: array
          items:
            type: string
        exclude_regions:
          type: array
          items:
            type: string
        include_types:
          type: array
          items:
            type: string
        exclude_types:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OverrideExport:
      type: object
      required: [version, exported_at, overrides]
      properties:
        version:
          type: integer
        exported_at:
          type: string
          format: date-time
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/OverrideTransferRow'

    OverrideImportRequest:
      type: object
      description: Send exactly one of overrides or csv (1 to 5000 rows).
      properties:
        mode:
          type: string
          enum: [strict, best_effort]
        dry_run:
          type: boolean
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/OverrideTransferRow'
        csv:
          type: string

    OverrideImportReport:
      type: object
      required: [mode, dry_run, applied, summary, rows]
      properties:
        mode:
          type: string
          enum: [strict, best_effort]
        dry_run:
          type: boolean
        applied:
          type: boolean
        summary:
          type: object
          description: Row count per action (insert, update, unchanged, rejected).
          additionalProperties:
            type: integer
        rows:
          type: array
          items:
            type: object
            required: [row, provider, service, action]
            properties:
              row:
                type: integer
              account_id:
                type: string
                format: uuid
              provider:
                type: string
              service:
                type: string
              action:
                type: string
                enum: [insert, update, unchanged, rejected]
              error:
                type: string

    AccountServiceOverride:
      type: object
      description: >
        Per-account override of the global service configuration. Omitted
        fields inherit the global value.
      required: [id, account_id, provider, service, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [aws, azure, gcp]
        service:
          type: string
        enabled:
          type: boolean
        term:
          type: integer
        payment:
          type: string
        coverage:
          type: number
          format: double
        ramp_schedule:
          type: string
        include_engines:
          type: array
          items:
            type: string
        exclude_engines:
          type: array
          items:
            type: string
        include_regions:
          type: array
          items:
            type: string
        exclude_regions:
          type: array
          items:
            type: string
        include_types:
          type: array
          items:
            type: string
        exclude_types:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountServiceOverrideRequest:
      type: object
      description: Fields to override. Omitted fields inherit the global value.
      properties:
        enabled:
          type: boolean
        term:
          type: integer
        payment:
          type: string
        coverage:
          type: number
          format: double
        ramp_schedule:
          type: string
        include_engines:
          type: array
          items:
            type: string
        exclude_engines:
          type: array
          items:
            type: string
        include_regions:
          type: array
          items:
            type: string
        exclude_regions:
          type: array
          items:
            type: string
        include_types:
          type: array
          items:
            type: string
        exclude_types:
          type: array
          items:
            type: string

    DiscoverOrgRequest:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: string
          format: uuid
          description: ID of the AWS org-root cloud account (aws_is_org_root true).

    DiscoverOrgResult:
      type: object
      required: [discovered, created, skipped]
      properties:
        discovered:
          type: integer
          description: Member accounts returned by AWS Organizations.
        created:
          type: integer
          description: New cloud accounts created.
        skipped:
          type: integer
          description: Members already registered (matched by external_id).

    AccountDeleteConflict:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
        reason:
          type: string
          enum: [pending_executions, active_executions]
        pending_count:
          type: integer
          description: Pending or notified executions (reason pending_executions only).
        pending_execution_ids:
          type: array
          description: >
            IDs of those executions, at most 1000 (reason pending_executions
            only; omitted when they could not be listed).
          items:
            type: string
        active_count:
          type: integer
          description: Approved, running, scheduled or paused executions (reason active_executions only).

    RegistrationRequest:
      type: object
      required: [provider, external_id, account_name, contact_email]
      properties:
        provider:
          type: string
          enum: [aws, azure, gcp]
        external_id:
          type: string
          description: Provider account identifier (AWS account ID, Azure subscription ID or GCP project ID). No control characters.
        account_name:
          type: string
          description: >
            Display name. Line breaks are stripped, surrounding whitespace is
            trimmed, and the result is truncated to 256 characters; it must
            then be non-empty and free of control characters.
        contact_email:
          type: string
          description: Address notified of the decision. Must contain @ and be at least 5 characters.
        description:
          type: string
        source_provider:
          type: string
          description: Cloud whose identity CUDly uses to reach this account.
        aws_role_arn:
          type: string
        aws_auth_mode:
          type: string
        aws_external_id:
          type: string
        azure_subscription_id:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_auth_mode:
          type: string
        gcp_project_id:
          type: string
        gcp_client_email:
          type: string
        gcp_auth_mode:
          type: string
        gcp_wif_audience:
          type: string
          description: Full Workload Identity Pool provider resource name (federated path only).
        credential_type:
          type: string
          description: Type of the credential in credential_payload, stored for the account on approval.
        credential_payload:
          type: string
          description: >
            Optional credential, encrypted at rest and never returned. Moved
            to the account's credential store on approval and then wiped
            from the registration.

    RegistrationSubmitResponse:
      type: object
      required: [reference_token, status]
      properties:
        reference_token:
          type: string
          description: 64 hex characters. Use with GET /api/register/{token}.
        status:
          type: string
          enum: [pending]

    RegistrationStatusResponse:
      type: object
      required: [status, created_at]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
          format: date-time
        rejection_reason:
          type: string
          description: Present only when non-empty.

    AccountRegistration:
      type: object
      description: >
        Registration record as seen by admins. Optional string fields are
        omitted when empty. The credential payload is never returned.
      required: [id, reference_token, status, provider, external_id, account_name, contact_email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        reference_token:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        provider:
          type: string
          enum: [aws, azure, gcp]
        external_id:
          type: string
        account_name:
          type: string
        contact_email:
          type: string
        description:
          type: string
        source_provider:
          type: string
        aws_role_arn:
          type: string
        aws_auth_mode:
          type: string
        aws_external_id:
          type: string
        azure_subscription_id:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_auth_mode:
          type: string
        gcp_project_id:
          type: string
        gcp_client_email:
          type: string
        gcp_auth_mode:
          type: string
        gcp_wif_audience:
          type: string
        reg_credential_type:
          type: string
          description: Type of the credential submitted with the registration.
        has_credentials:
          type: boolean
          description: True when a credential type was submitted; omitted otherwise.
        rejection_reason:
          type: string
        cloud_account_id:
          type: string
          format: uuid
          description: Account created on approval.
        reviewed_by:
          type: string
          description: Reviewing user ID, or admin-api-key when approved or rejected with the admin API key.
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RejectRegistrationRequest:
      type: object
      properties:
        reason:
          type: string
          description: Shown to the registrant via GET /api/register/{token} and in the decision email.

    RejectRegistrationResponse:
      type: object
      required: [id, status, provider, external_id, account_name, rejection_reason]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [rejected]
        provider:
          type: string
        external_id:
          type: string
        account_name:
          type: string
        rejection_reason:
          type: string
          description: Empty string when no reason was given.

    # -- Cloud Accounts -----------------------------------------------------

    FederationIaCResponse:
      type: object
      required: [filename, content, content_type]
      properties:
        filename:
          type: string
          description: Suggested download file name (.sh or .zip).
        content:
          type: string
          description: File content; base64-encoded when content_encoding is base64.
        content_type:
          type: string
          enum: [text/x-shellscript, application/zip]
        content_encoding:
          type: string
          enum: [base64]
          description: Present (base64) for zip archives; omitted for the shell script.

    # -- Version ------------------------------------------------------------

    VersionResponse:
      type: object
      required: [version, git_sha, build_time]
      properties:
        version:
          type: string
          description: Build version, or dev when not stamped at build time.
        git_sha:
          type: string
          description: Git commit SHA, or unknown when not stamped.
        build_time:
          type: string
          description: Build timestamp, or unknown when not stamped.

    RecommendationDetailResponse:
      type: object
      required: [id, usage_history, confidence_bucket, provenance_note]
      properties:
        id:
          type: string
        usage_history:
          type: array
          description: >
            Utilization history. Always empty for now: the collector does not
            yet persist per-recommendation utilization.
          items:
            $ref: '#/components/schemas/UsagePoint'
        confidence_bucket:
          type: string
          enum: [low, medium, high]
          description: >
            high is at least 200 monthly savings and a count of at least 3,
            medium is at least 50 monthly savings, low otherwise.
        provenance_note:
          type: string
          description: >
            Human-readable source of the recommendation, plus the last
            collection time (RFC 3339, UTC) when it is known.
        hidden_by:
          type: array
          description: >
            Present when an account service override would hide this
            recommendation from the list; names each failing dimension.
            Omitted when the recommendation is visible.
          items:
            type: string
            enum: [enabled=false, engine, region, resource_type]

    UsagePoint:
      type: object
      required: [timestamp, cpu_pct, mem_pct]
      properties:
        timestamp:
          type: string
        cpu_pct:
          type: number
          format: double
        mem_pct:
          type: number
          format: double

    # -- Plan accounts ------------------------------------------------------

    SetPlanAccountsRequest:
      type: object
      required: [account_ids]
      properties:
        account_ids:
          type: array
          minItems: 1
          description: The plan's complete new account list (cloud account UUIDs).
          items:
            type: string
            format: uuid

    # -- Purchase retry -----------------------------------------------------

    RetryPurchaseResponse:
      type: object
      required: [execution_id, original_execution, status, recommendation_count, total_upfront_cost, estimated_savings, email_sent, retry_attempt_n]
      properties:
        execution_id:
          type: string
          format: uuid
          description: The new execution.
        original_execution:
          type: string
          format: uuid
          description: The failed execution that was retried.
        status:
          type: string
          enum: [pending, failed]
          description: failed when the approval email could not be sent (see email_reason).
        recommendation_count:
          type: integer
        total_upfront_cost:
          type: number
          format: double
        estimated_savings:
          type: number
          format: double
        email_sent:
          type: boolean
        retry_attempt_n:
          type: integer
          description: Attempt number of the new execution in the retry chain.
        email_reason:
          type: string
          description: Why the approval email was not sent. Omitted when it was sent.
        approval_recipient:
          type: string
          description: Address the approval email went to. Omitted when none.

    # -- Purchase revoke ----------------------------------------------------

    RevokePurchaseRequest:
      type: object
      description: >
        The refund quote the user confirmed, from GET
        /api/purchases/{id}/revoke/calculate. Both fields are required to
        revoke an Azure reservation; other paths ignore the body.
      properties:
        expected_refund_amount:
          type: number
          format: double
        expected_refund_currency:
          type: string

    RevokePurchaseResponse:
      type: object
      description: >
        One of three shapes. A canceled scheduled execution: status
        "canceled" and message. A revoked purchase history row: status
        "revoked" or "already_revoked" with revoked_at and revoked_via. An
        Azure refund that was issued but could not be recorded yet, or that a
        concurrent revoke of the same purchase is posting: code
        RECONCILE_PENDING, azure_returned and message (do not retry).
      properties:
        status:
          type: string
          enum: [canceled, revoked, already_revoked]
        message:
          type: string
        revoked_at:
          type: string
          format: date-time
        revoked_via:
          type: string
          description: How the revocation was made, for example direct-api.
        code:
          type: string
          enum: [RECONCILE_PENDING]
        azure_returned:
          type: boolean

    RevokeRefundQuote:
      type: object
      required: [refund_amount, refund_currency, quoted_at]
      properties:
        refund_amount:
          type: number
          format: double
        refund_currency:
          type: string
        quoted_at:
          type: string
          format: date-time

    # -- RI Marketplace -----------------------------------------------------

    MarketplacePriceTier:
      type: object
      required: [term_months, price]
      properties:
        term_months:
          type: integer
          format: int64
          minimum: 1
          description: Remaining months this tier covers; at most the RI's remaining months.
        price:
          type: number
          format: double
          description: >
            One-time USD sale price per instance when term_months remain. Must
            be positive.

    MarketplaceListRequest:
      type: object
      properties:
        price_schedule:
          type: array
          description: >
            Optional. Each tier's price must be at least 5% of the per-instance
            upfront residual prorated to its term. When omitted, a single tier
            covering the remaining months is priced at 95% of the per-instance
            prorated upfront residual.
          items:
            $ref: '#/components/schemas/MarketplacePriceTier'

    MarketplaceListResponse:
      type: object
      required: [listing_id, listing_state, price_schedule, aws_fee_percent]
      properties:
        listing_id:
          type: string
        listing_state:
          type: string
        price_schedule:
          type: array
          description: >
            The schedule the listing was created with; on a retry of an
            earlier attempt this is the stored schedule, not the request's.
          items:
            $ref: '#/components/schemas/MarketplacePriceTier'
        aws_fee_percent:
          type: number
          description: AWS Marketplace transaction fee charged on proceeds (12).
        note:
          type: string

    UserPermissionsResponse:
      type: object
      required: [permissions, is_admin]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [action, resource]
            properties:
              action:
                type: string
              resource:
                type: string
        is_admin:
          type: boolean
          description: True when permissions include `{admin, *}`.

    ResetPasswordStatusResponse:
      type: object
      required: [state, flow]
      properties:
        state:
          type: string
          enum: [valid, expired, used]
          description: >
            `used` also covers tokens that were never issued and deactivated
            accounts.
        flow:
          type: string
          enum: [reset, invite]
          description: >
            `invite` for a not-yet-activated invited user; `reset` otherwise,
            including every `used` token.

    MFASetupRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Base64-encoded current password

    MFASetupResponse:
      type: object
      required: [secret, provisioning_uri]
      properties:
        secret:
          type: string
          description: Pending TOTP secret (base32), stored server side
        provisioning_uri:
          type: string
          description: otpauth:// URI for rendering as a QR code

    MFAEnableRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: TOTP code from the authenticator

    MFADisableRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Base64-encoded current password
        code:
          type: string
          description: >
            TOTP code or unused recovery code. Required while MFA is enabled.

    MFARegenerateRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: TOTP code (recovery codes are not accepted)

    MFARecoveryCodesResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Plaintext recovery codes, returned only once
          items:
            type: string

    # -- Analytics trends ---------------------------------------------------

    AnalyticsTrendsResponse:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        months:
          type: integer
          description: Calendar months spanned by start..end (at least 1); the length of the monthly window.
        monthly:
          type: array
          items:
            $ref: '#/components/schemas/TrendsMonthlySummary'
        by_provider:
          type: array
          items:
            $ref: '#/components/schemas/TrendsProviderBreakdown'
        by_service:
          type: array
          items:
            $ref: '#/components/schemas/TrendsServiceBreakdown'

    TrendsMonthlySummary:
      type: object
      properties:
        month:
          type: string
          format: date-time
        cloud_account_id:
          type: string
          description: Omitted when the snapshot has no linked cloud account.
        account_id:
          type: string
          description: External account ID recorded on the snapshot
        provider:
          type: string
        service:
          type: string
        total_savings:
          type: number
          format: double
        avg_coverage:
          type: number
          format: double
          description: Average coverage percentage. Omitted when coverage data is absent (not zero).
        snapshot_count:
          type: integer

    TrendsProviderBreakdown:
      type: object
      properties:
        provider:
          type: string
        service:
          type: string
        total_savings:
          type: number
          format: double
        avg_coverage:
          type: number
          format: double
          description: Omitted when coverage data is absent.

    TrendsServiceBreakdown:
      type: object
      properties:
        service:
          type: string
        region:
          type: string
        total_savings:
          type: number
          format: double
        avg_coverage:
          type: number
          format: double
          description: Omitted when coverage data is absent.

    # -- Inventory ----------------------------------------------------------

    InventoryCommitmentsResponse:
      type: object
      required: [commitments]
      properties:
        commitments:
          type: array
          items:
            $ref: '#/components/schemas/InventoryCommitment'

    InventoryCommitment:
      type: object
      properties:
        id:
          type: string
          description: '`<account_id>:<purchase_id>`'
        provider:
          type: string
        account_id:
          type: string
        account_name:
          type: string
          description: Omitted when the account name cannot be resolved.
        service:
          type: string
        resource_type:
          type: string
        region:
          type: string
        count:
          type: integer
        term_years:
          type: integer
        payment_option:
          type: string
        start_date:
          type: string
          format: date-time
          description: Purchase time
        end_date:
          type: string
          format: date-time
          description: Computed expiry
        upfront_cost:
          type: number
          format: double
          nullable: true
        monthly_cost:
          type: number
          format: double
          nullable: true
          description: Null when the provider reported no monthly breakdown.
        estimated_savings:
          type: number
          format: double
        status:
          type: string
          enum: [active]

    CoverageBreakdownResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          description: One section each for aws, azure and gcp, in that order.
          items:
            $ref: '#/components/schemas/ProviderCoverageSection'

    ProviderCoverageSection:
      type: object
      properties:
        provider:
          type: string
          enum: [aws, azure, gcp]
        services:
          type: array
          nullable: true
          description: Null when the provider has no usage data.
          items:
            $ref: '#/components/schemas/CoverageServiceRow'
        overall_coverage_pct:
          type: number
          format: double
          nullable: true
          description: Null when there is no usage signal (not zero).

    CoverageServiceRow:
      type: object
      properties:
        service:
          type: string
        covered_monthly:
          type: number
          format: double
          nullable: true
          description: >
            Monthly spend covered by active commitments (recurring plus
            amortized upfront). Null when a commitment's upfront cost is
            unknown.
        on_demand_monthly:
          type: number
          format: double
          description: Uncommitted monthly spend, from recommendation savings
        coverage_pct:
          type: number
          format: double
          nullable: true
          description: covered / (covered + on_demand) * 100. Null when unknown or both are zero.

    # -- Ladder -------------------------------------------------------------

    LadderRampSchedule:
      type: object
      required: [steps]
      description: >
        At least one step; after_days strictly ascending; fractions in (0, 1]
        summing to 1.
      properties:
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [after_days, fraction]
            properties:
              after_days:
                type: integer
                minimum: 0
                description: Days after the run starts at which the tranche fires
              fraction:
                type: number
                format: double
                maximum: 1
                description: Share of the target allocation, greater than 0

    LadderConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cloud_account_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [aws, azure, gcp]
        enabled:
          type: boolean
        mode:
          type: string
          enum: [email_approval, auto_approve]
        cadence:
          type: string
          enum: [daily, weekly]
        target_coverage:
          type: number
          format: double
        buffer_fraction:
          type: number
          format: double
        baseline_percentile:
          type: number
          format: double
        lookback_days:
          type: integer
        buffer_utilization_threshold:
          type: number
          format: double
        max_hourly_commit_per_run:
          type: number
          format: double
          description: Omitted when there is no cap.
        max_actions_per_run:
          type: integer
        ramp_schedule:
          $ref: '#/components/schemas/LadderRampSchedule'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LadderConfigsResponse:
      type: object
      required: [configs]
      properties:
        configs:
          type: array
          items:
            $ref: '#/components/schemas/LadderConfig'

    LadderConfigUpsertRequest:
      type: object
      additionalProperties: false
      required: [cloud_account_id, provider, mode, cadence, ramp_schedule]
      properties:
        cloud_account_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [aws, azure, gcp]
          description: Must match the cloud account's provider.
        enabled:
          type: boolean
          default: false
        mode:
          type: string
          enum: [email_approval, auto_approve]
        cadence:
          type: string
          enum: [daily, weekly]
        target_coverage:
          type: number
          format: double
          maximum: 100
          default: 100
          description: Percentage, greater than 0.
        buffer_fraction:
          type: number
          format: double
          minimum: 0
          default: 0.1
          description: Less than 1.
        baseline_percentile:
          type: number
          format: double
          maximum: 50
          default: 5
          description: Greater than 0.
        lookback_days:
          type: integer
          minimum: 1
          default: 30
          description: At least 10 for aws.
        buffer_utilization_threshold:
          type: number
          format: double
          maximum: 100
          default: 90
          description: Percentage, greater than 0.
        max_hourly_commit_per_run:
          type: number
          format: double
          nullable: true
          minimum: 0.000001
          maximum: 1.0e+12
          description: >
            Cap on the hourly commitment one run may buy, with at most 6
            decimal places. Omit or send null for no cap.
        max_actions_per_run:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        ramp_schedule:
          $ref: '#/components/schemas/LadderRampSchedule'
        id:
          type: string
          description: Used as the row ID only when a new row is inserted; ignored on update.
        created_at:
          type: string
          format: date-time
          description: Accepted and ignored.
        updated_at:
          type: string
          format: date-time
          description: Accepted and ignored.

    LadderTimelineCursor:
      type: object
      required: [created_at, id]
      description: Pass as after_created_at and after_id to fetch the next page.
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid

    LadderTimelinePage:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/LadderTimelineEvent'
        next_cursor:
          $ref: '#/components/schemas/LadderTimelineCursor'
        total_count:
          type: integer
          format: int64
          description: Tranches across all pages
        total_usd_hr:
          type: string
          description: Decimal sum of amount_usd_hr across all pages
        total_od_usd_hr:
          type: string
          description: Decimal sum of od_usd_hr across all pages

    LadderTimelineEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        config_id:
          type: string
          format: uuid
        layer_type:
          type: string
          enum: [ec2-instance-sp, compute-sp, convertible-ri, azure-reservation, azure-savings-plan]
        term:
          type: string
          enum: [1yr, 3yr]
        payment_option:
          type: string
          enum: [all-upfront, partial-upfront, no-upfront]
        status:
          type: string
          enum: [scheduled, fired, completed, cancelled, failed]
        run_status:
          type: string
          enum: [planned, awaiting_approval, approved, executing, completed, failed, cancelled, expired]
        execution_id:
          type: string
          description: Omitted until the tranche has an execution.
        revision:
          type: integer
          format: int64
          description: Pass as expected_revision when amending.
        amount_usd_hr:
          type: string
          description: Decimal hourly amount in the basis given by amount_basis
        amount_basis:
          type: string
          enum: [on_demand_equivalent, commitment]
          description: Omitted for older rows, which are treated as on_demand_equivalent.
        commitment_rate:
          type: string
          description: Present when amount_basis is commitment.
        od_usd_hr:
          type: string
          description: On-demand-equivalent hourly amount, 6 decimal places, rounded up
        scheduled_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LadderTimelineRunPage:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/LadderTimelineRun'
        next_cursor:
          $ref: '#/components/schemas/LadderTimelineCursor'
        total_count:
          type: integer
          format: int64
          description: Runs across all pages

    LadderTimelineRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        config_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [planned, awaiting_approval, approved, executing, completed, failed, cancelled, expired]
        started_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        baseline_usd_hr:
          type: string
          nullable: true
          description: Decimal; null when not computed
        target_usd_hr:
          type: string
          nullable: true
          description: Decimal; null when not computed
        existing_usd_hr:
          type: string
          nullable: true
          description: Decimal; null when not computed
        gap_usd_hr:
          type: string
          nullable: true
          description: Decimal; null when not computed
        total_hourly_commit:
          type: string
          description: Decimal
        actions:
          type: array
          items:
            $ref: '#/components/schemas/LadderTimelineAction'

    LadderTimelineAction:
      type: object
      properties:
        action:
          type: string
        layer:
          type: string
        rationale:
          type: string
        data_sources:
          type: array
          items:
            type: string

    LadderTrancheAmendment:
      type: object
      additionalProperties: false
      required: [expected_revision, scheduled_date, amount_usd_hr]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: The tranche's current revision
        scheduled_date:
          type: string
          format: date-time
          description: Must be in the future.
        amount_usd_hr:
          type: string
          pattern: '^(0|[1-9]\d{0,13})(\.\d{1,6})?$'
          description: Positive decimal with at most 6 fractional digits

    LadderTrancheAmendmentResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        scheduled_date:
          type: string
          format: date-time
        amount_usd_hr:
          type: string
        run_total_usd_hr:
          type: string
          description: The run's total hourly amount after the change

    LadderTrancheResolveRequest:
      type: object
      additionalProperties: false
      required: [outcome, reason]
      description: At most 4096 bytes.
      properties:
        outcome:
          type: string
          enum: [failed, completed]
          description: Only failed is implemented; completed answers 501.
        reason:
          type: string
          minLength: 10
          maxLength: 300
          description: Trimmed; no control characters.
        note:
          type: string
          maxLength: 200
          description: Trimmed; no control characters.
        acknowledge_unknown_outcome:
          type: boolean
          description: Must be true exactly when cloud_check is sent.
        cloud_check:
          type: object
          additionalProperties: false
          required: [checked_account_id, checked_region, checked_service, checked_at]
          description: Where the operator looked for the purchase.
          properties:
            checked_account_id:
              type: string
              pattern: '^[A-Za-z0-9_-]{1,64}$'
              description: The tranche's cloud account ID or provider account number
            checked_region:
              type: string
              pattern: '^[a-z0-9-]{1,32}$'
            checked_service:
              type: string
              pattern: '^[a-z0-9-]{1,32}$'
              description: Must equal the tranche's layer_type.
            checked_at:
              type: string
              format: date-time
              description: >
                Must not be in the future and must follow the last execution
                change; checked only when an execution's outcome is unknown.

    LadderTrancheResolveResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [failed]
        status_reason:
          type: string
        replayed:
          type: boolean
          description: True when an identical earlier request already resolved it.
