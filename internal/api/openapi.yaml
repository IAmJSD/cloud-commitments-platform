openapi: 3.0.3
info:
  title: CUDly API
  description: >
    CUDly is a multi-cloud commitment (Reserved Instances, Savings Plans)
    purchase automation and cost-optimization dashboard.
  version: "1.0.0"
  license:
    name: Proprietary

servers:
  - url: /
    description: Same-origin (relative)

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

tags:
  - name: Dashboard
  - name: Configuration
  - name: Credentials
  - name: Recommendations
  - name: Plans
  - name: Purchases
  - name: PlannedPurchases
  - name: History
  - name: Analytics
  - name: Auth
  - name: APIKeys
  - name: Users
  - name: Groups
  - name: RIExchange
  - name: Health
  - name: Info
  - name: Docs
  - name: Accounts
  - name: Registrations
  - name: Federation
  - name: Inventory
  - name: Ladder
  - name: Notifications
  - name: Insurance
    description: Read-only configuration status and configured plan comparison.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /api/insurance/status:
    get:
      operationId: getInsuranceStatus
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      tags: [Insurance]
      summary: Check insurance comparison configuration
      description: >
        Requires view:recommendations and unrestricted account scope; scoped
        sessions receive 404. Reports setting presence only, without resolving
        secrets or contacting Archera. Missing contains setting names, never values.
      responses:
        '200':
          description: Configuration presence; an unwired provider is unconfigured.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsuranceStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/insurance/comparison:
    get:
      operationId: getInsuranceComparison
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      tags: [Insurance]
      summary: Read the configured plan's insurance comparison
      description: >
        Requires view:recommendations and unrestricted account scope; scoped
        sessions receive 404. Disabled until ARCHERA_ORG_ID, ARCHERA_PLAN_ID and
        ARCHERA_API_KEY_SECRET are present. Resolves the key lazily and requests
        the configured plan without recommendation filters. This read-only result
        does not purchase, bind insurance or change recommendation eligibility.
        Vendor errors are mapped to fixed client messages, without implicit retries.
      responses:
        '200':
          description: Plan-wide comparison with exact decimal strings and disclosures.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcheraComparison'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          description: Vendor rate limit; Retry-After is present only for a positive vendor delay, rounded up to seconds.
          headers:
            Retry-After:
              description: Seconds before retrying; no automatic retry is performed.
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: >
            Vendor authentication, missing organization/plan, service or transport
            failure (including timeout), an inexact decimal, or a response over 5 MiB.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Missing configuration or the configured key could not be resolved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ---- Dashboard ----------------------------------------------------------
  /api/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [Dashboard]
      summary: Get dashboard summary
      parameters:
        - name: provider
          in: query
          description: >
            Filter by cloud provider. "all" or no value means every provider.
            Any other value is a 400.
          schema:
            type: string
            enum: [aws, azure, gcp, all]
        - name: account_ids
          in: query
          description: >
            Comma-separated cloud account UUIDs (at most 200). When present it
            takes precedence over account_id. The result is always narrowed
            to the caller's allowed accounts.
          schema:
            type: string
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/dashboard/upcoming:
    get:
      operationId: getUpcomingPurchases
      tags: [Dashboard]
      summary: Get upcoming scheduled purchases
      responses:
        '200':
          description: Upcoming purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingPurchaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- Configuration ------------------------------------------------------
  /api/config:
    get:
      operationId: getConfig
      tags: [Configuration]
      summary: Get full configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateConfig
      tags: [Configuration]
      summary: Update global configuration
      description: >
        Partial update: keys present in the body replace the stored values
        and absent keys are preserved. The response does not echo the
        configuration; read it back with GET /api/config.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalConfig'
      responses:
        '200':
          description: Configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/config/service/{provider}/{service}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [aws, azure, gcp]
      - name: service
        in: path
        required: true
        description: Service name within the provider, for example ec2 or rds. Letters, digits, hyphens and underscores only.
        schema:
          type: string
    get:
      operationId: getServiceConfig
      tags: [Configuration]
      summary: Get per-service configuration
      responses:
        '200':
          description: >
            Service configuration, or an empty object {} when none is stored
            for this provider and service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateServiceConfig
      tags: [Configuration]
      summary: Update per-service configuration
      description: >
        Provider and service are taken from the path. This is a partial
        update: any enabled, term, payment, coverage or filter key absent from
        the body keeps its stored value, and the merged row is validated. A
        key that is present, even with a zero value, replaces the stored one.
        The response does not echo the configuration; read it back with GET.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceConfig'
      responses:
        '200':
          description: Service configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/commitment-options:
    get:
      operationId: getCommitmentOptions
      tags: [Configuration]
      summary: Dynamically-probed AWS commitment combinations
      description: |
        Returns the (term, payment) combinations AWS actually sells for
        commitment-capable services, harvested from the reserved-offerings
        APIs at most once per server lifetime and persisted to Postgres.
        When probe data is unavailable (no AWS account connected, probe
        failed, transient DB error) returns `{"status":"unavailable"}` at
        HTTP 200 so the frontend can fall back to hardcoded rules without
        tripping its error-toast path.
      responses:
        '200':
          description: Commitment options or unavailable status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Recommendations ----------------------------------------------------
  /api/recommendations:
    get:
      operationId: getRecommendations
      tags: [Recommendations]
      summary: List commitment purchase recommendations
      parameters:
        - name: provider
          in: query
          description: Filter by cloud provider (aws, azure, gcp)
          schema:
            type: string
            enum: [aws, azure, gcp]
        - name: service
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: account_ids
          in: query
          description: >
            Comma-separated cloud account UUIDs (at most 200). Results are
            always narrowed to the caller's allowed accounts.
          schema:
            type: string
        - name: min_savings_usd
          in: query
          description: Minimum monthly savings in USD. Absent or 0 means no floor.
          schema:
            type: number
            minimum: 0
        - name: min_savings_pct
          in: query
          description: Minimum effective savings percentage (0-100). Absent or 0 means no floor.
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: limit
          in: query
          description: >-
            Opt-in maximum page size in rows (1-1000). When neither limit nor
            cursor is present, every matching recommendation is returned in
            one response (legacy behavior); a present but empty value is a
            400. When either is sent, rows are returned in ascending id order,
            one page at a time, and a page can hold fewer than limit rows
            (follow next_cursor, not the row count) because each page is also
            capped at 4 MiB of serialized JSON. A single row larger than that
            is returned alone. summary and regions still describe the full
            filtered set.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: >-
            Opaque next_cursor value from the previous page. Implies
            pagination; the page size defaults to 500 when limit is omitted.
          schema:
            type: string
            maxLength: 1024
      responses:
        '200':
          description: Recommendations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '400':
          description: >
            Invalid query parameter: a limit that is empty, not an integer or
            outside 1-1000; a cursor that is empty, longer than 1024
            characters or not a cursor this endpoint issued; or an invalid
            provider, service, region, account_ids, min_savings_usd or
            min_savings_pct filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/recommendations/refresh:
    post:
      operationId: refreshRecommendations
      tags: [Recommendations]
      summary: Trigger a fresh collection of recommendations from cloud providers
      description: >
        Starts a collection across every registered account; on Lambda it
        runs asynchronously. Poll GET /api/recommendations/freshness until
        last_collected_at passes started_at. Callers restricted to a subset
        of accounts get 403.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Collection started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A collection is already in progress (started within the last 5 minutes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recommendations/freshness:
    get:
      operationId: getRecommendationsFreshness
      tags: [Recommendations]
      summary: Get the recommendations cache freshness and last collection outcome
      description: >
        Returns when recommendations were last collected, the most recent
        collection error, whether a collection is in flight, and whether the
        last collection was partial (some subscriptions, projects or scopes
        could not be queried, so the stored recommendations under-state the
        real opportunity).
      responses:
        '200':
          description: Freshness state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsFreshness'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/recommendations/{id}/detail:
    parameters:
      - name: id
        in: path
        required: true
        description: >
          Recommendation ID as returned by GET /api/recommendations. It is a
          pipe-separated identity (provider, account, service, region,
          resource type, engine, term, payment, plus optional zone and
          platform/tenancy segments) that can contain "/" and spaces, so
          percent-encode it.
        schema:
          type: string
    get:
      operationId: getRecommendationDetail
      tags: [Recommendations]
      summary: Get the drill-down details of one recommendation
      description: >
        Backs the recommendation drawer. A recommendation hidden by an account
        service override still resolves, with hidden_by naming the override
        dimensions; a fully suppressed one answers 404.
      responses:
        '200':
          description: Recommendation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            No such recommendation, it is fully suppressed, or it belongs to
            an account outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---- Purchase Plans -----------------------------------------------------
  /api/plans:
    get:
      operationId: listPlans
      tags: [Plans]
      summary: List purchase plans
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Plans list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPlan
      tags: [Plans]
      summary: Create a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # target_accounts is required ONLY on plan creation. The shared
              # PlanRequest schema is reused by PUT/PATCH where omitting the
              # field means "leave the existing account list unchanged"; only
              # POST enforces non-empty target_accounts to prevent universal
              # plans. Scoping the requirement here (instead of in the shared
              # schema) keeps the update payload contract loose while still
              # advertising the create contract correctly to client codegen.
              allOf:
                - $ref: '#/components/schemas/PlanRequest'
                - type: object
                  required: [target_accounts]
      responses:
        '200':
          description: Created plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getPlan
      tags: [Plans]
      summary: Get a purchase plan by ID
      responses:
        '200':
          description: Purchase plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePlan
      tags: [Plans]
      summary: Replace a purchase plan
      description: >-
        A singleton legacy service alias retains its original key, hidden filters,
        minimum count, service ramp and Enabled value when edited through its canonical
        service name. Exact-key edits retain their existing Enabled overlay behavior;
        selecting a genuinely different singleton service still replaces its settings.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlanRequest'
                - type: object
                  properties:
                    expected_updated_at:
                      type: string
                      nullable: true
                      description: >-
                        Optional Update version from the plan's updated_at. Omission,
                        null or an empty string opts out. A nonempty value must be an
                        RFC3339 timestamp; malformed values return 400 and a different
                        instant returns 409 with refresh guidance.
      responses:
        '200':
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The plan changed concurrently, the request changes the ramp schedule of a plan that has already completed a step (keep the schedule, or create a new plan), or the plan is managed by the schedule editor and the request changes what only the editor may (code editor_reconciliation_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithCode'
    patch:
      operationId: patchPlan
      tags: [Plans]
      summary: Partially update a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Patched plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditorReconciliationRequired'
    delete:
      operationId: deletePlan
      tags: [Plans]
      summary: Delete a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The plan is managed by the schedule editor and still has active or unsettled purchases. Cancel or revoke them first (code managed_plan_has_live_executions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithCode'

  /api/plans/{id}/purchases:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: createPlannedPurchases
      tags: [Plans]
      summary: Generate planned purchase executions for a plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlannedPurchasesRequest'
      responses:
        '200':
          description: Planned purchases created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlannedPurchasesResponse'
        '400':
          description: >
            Invalid request body, count outside 1-52, start_date not in
            YYYY-MM-DD form, or start_date not in the future
            ("start_date must be in the future"). start_date is read as
            midnight UTC, so today's date and earlier are refused; the
            earliest accepted date is tomorrow in UTC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the caller lacks permission or access to
            the plan, or 4-eyes mode is on and the caller has no attributable
            user (the admin API key). Rows scheduled that way could never be
            approved under 4-eyes, so the request is refused; sign in or use a
            per-user API key instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The plan is disabled, has unsupported scheduling settings, no target
            accounts or insufficient remaining steps, or the requested steps are
            occupied. Automatic plans also require a valid commitment cap and
            the global automatic purchasing switch. A plan managed by the
            schedule editor is refused whole (code editor_reconciliation_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithCode'

  /api/plans/{id}/accounts:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listPlanAccounts
      tags: [Plans]
      summary: List the cloud accounts assigned to a plan
      description: >
        Requires view:plans. A caller with a restricted account scope sees
        only the plan's accounts inside that scope, and gets 404 when none of
        the plan's accounts is in scope. An unrestricted caller gets an empty
        list for an unknown plan ID.
      responses:
        '200':
          description: Accounts assigned to the plan, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudAccount'
        '400':
          description: The plan ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No account of the plan is inside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: setPlanAccounts
      tags: [Plans]
      summary: Replace the cloud accounts assigned to a plan
      description: >
        Requires update:plans. Replaces the plan's whole account list
        atomically. Every account's provider must match one of the providers
        of the plan's services. A caller with a restricted account scope must
        have every current account of the plan and every requested account in
        scope.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlanAccountsRequest'
      responses:
        '200':
          description: Accounts replaced. The body is an empty JSON object.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: >
            Invalid plan ID or request body, account_ids missing, empty or
            holding a non-UUID entry, or one or more accounts have a provider
            the plan's services do not use (every mismatch is listed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            The plan or a requested account does not exist, or the plan or a
            requested account is outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/EditorReconciliationRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---- Purchase Actions ---------------------------------------------------
  /api/purchases/execute:
    post:
      operationId: executePurchase
      tags: [Purchases]
      summary: Create a purchase execution from selected recommendations
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePurchaseRequest'
      responses:
        '200':
          description: Execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutePurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the caller lacks permission or exceeds its
            Constraints, 4-eyes mode rejects a direct execute, or 4-eyes mode is
            on and the caller has no attributable user (the admin API key). An
            execution created that way could never be approved under 4-eyes,
            so it is refused before anything is written; sign in or use a
            per-user API key instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            One of two conflict families. Idempotency: an identical submit
            already holds the idempotency claim, so THIS request was not
            executed (see the shared Conflict response for how to interpret
            that case). Stored-recommendation conflict (#1905): a
            recommendation in the request does not match any row in the
            current stored recommendation set (it was purchased, superseded,
            or never existed), two requested recommendations resolve to the
            same identity key, two rows in the stored set share one identity
            key (which is refused rather than resolved arbitrarily, and can
            occur even for a single-recommendation request), a matched stored
            row has no usable price to derive the spend cap from, or a
            Savings Plan's requested count does not equal the stored
            recommended count. Recovery differs by
            cause: for the idempotency case, verify the earlier submit's
            outcome with the provider before resubmitting; for a
            stored-recommendation conflict, refresh the recommendation set
            and resubmit with the current data. With execute_mode "direct",
            a lost claim on the new execution also answers 409.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >
            execute_mode "direct" only. The claim was won and the purchase
            ran, but it failed or only partly completed. Money may have moved;
            the body details carry execution_id and the row's actual status.
            A partially_completed run is revocable: the executed email with
            its revocation link is sent as for a completed run.
            Check the execution in History before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/approve/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: approvePurchase
      tags: [Purchases]
      summary: Approve a pending purchase execution
      description: >
        Two modes. Session mode: send the session bearer token plus the
        X-CSRF-Token header; the session must hold approve-any, or
        approve-own for an execution it created, and the execution must be
        inside the session's account scope. Token mode (email link): send the
        approval token; the caller must also be signed in with the email of
        the contact_email of a cloud account on the execution (the global
        notification address is not an accepted approver). A session that lacks the
        permission, or is outside the account scope, falls through to token
        mode when a token is present; with no token the denial is final.
        A session whose approve permission Constraints are exceeded is
        denied outright and does not fall through. GET is not routed: the
        approval email links to the dashboard, which POSTs after confirmation.
        When the global purchase delay is configured the response status is
        "scheduled" instead of "completed".
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          description: >
            Approval token. For POST it may instead be sent as a JSON body
            {"token": "..."} or a form field named token; the body is
            preferred so the token stays out of access logs.
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: >
            CSRF token from the login response. Required when the request
            carries a session bearer token and is handled in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Approved and executed ("completed"), or scheduled behind the purchase delay ("scheduled")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            The caller has no valid session, with or without a token. This
            is answered before the execution is looked up, so an existing
            and a missing execution ID get the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed for a signed-in session, the session lacks approve permission or
            exceeds its Constraints, the caller is not the account's contact
            email, no contact email is configured on the execution's
            accounts, 4-eyes mode rejects the approver, or (token mode) the
            approval token is invalid. Token mode validates the token on
            both the immediate and the delayed-approval (purchase delay
            configured) paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Execution not found, or outside the session's account scope and
            no token was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The execution cannot be approved: a non-AWS execution without a
            resolvable cloud account, a status other than pending or notified
            (in token mode the status check is the atomic transition, so a
            concurrent change answers the same way, and in either mode a
            lost claim answers 409 as well).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            Token mode only, the approval token has expired (checked on both
            the immediate and the delayed-approval paths).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >
            Session and token mode. The claim was won and the purchase ran,
            but it failed or only partly completed (a failed or
            partially_completed run). Money may have moved; the body details carry execution_id
            and the row's actual status. A partially_completed run is
            revocable: the executed email with its revocation link is sent as
            for a completed run. Check the execution in History before
            retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/cancel/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: cancelPurchase
      tags: [Purchases]
      summary: Cancel a pending purchase execution
      description: >
        Two modes, with the same dispatch as approve. Session mode: session
        bearer token plus X-CSRF-Token; the session must hold cancel-any, or
        cancel-own for an execution it created, and the execution must be
        inside the session's account scope. Token mode (email link): the
        approval token plus a session signed in as the contact email of an
        account on the execution. A session that lacks the permission, or is
        outside the account scope, falls through to token mode when a token
        is present; with no token the denial is final. GET is not routed:
        the email links to the dashboard, which POSTs after confirmation.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          description: >
            Approval token. For POST it may instead be sent as a JSON body
            {"token": "..."} or a form field named token.
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: >
            CSRF token from the login response. Required in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            The caller has no valid session, with or without a token. This
            is answered before the execution is looked up, so an existing
            and a missing execution ID get the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed for a signed-in session, the session lacks cancel permission, the caller is
            not the account's contact email, no contact email is
            configured on the execution's accounts, or (token mode) the
            approval token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Execution not found, or outside the session's account scope and
            no token was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The execution is not cancelable (in session mode, scheduled
            executions must use the revoke endpoint), or its status changed
            concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            Token mode only, the approval token has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/revoke/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRevokeConfirmationForm
      tags: [Purchases]
      summary: Render the revocation confirmation form for the email link
      description: >
        The revocation email links here. Returns an HTML page with a form
        that POSTs the token to this path; nothing is looked up or changed, so
        mail prefetchers cannot trigger a revocation. The form submits a
        plain browser form POST, which carries no Authorization or
        X-CSRF-Token header.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: >
            Approval token from the email link. Embedded unchanged (HTML
            escaped) in the form's hidden token field; it is not validated
            here.
          schema:
            type: string
      responses:
        '200':
          description: HTML confirmation page
          content:
            text/html:
              schema:
                type: string
        '400':
          description: The execution ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: revokePurchaseViaEmail
      tags: [Purchases]
      summary: Revoke a completed purchase from the email link
      description: >
        Records a revocation request for a completed or partially completed
        purchase. The same path also answers GET with an unauthenticated HTML
        confirmation form (no state change, so mail prefetchers cannot
        trigger a revocation), documented as the GET operation on this path;
        that form POSTs the token here.

        Two modes. Session mode: session bearer token plus
        X-CSRF-Token, with cancel-any or cancel-own and account scope, as for
        cancel. Token mode: the approval token plus a session signed in as
        the contact email of an account on the execution, within the
        24-hour revocation window. A session denial falls through to token
        mode only when a token is present.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          description: >
            Approval token. May instead be sent as a JSON body
            {"token": "..."} or a form field named token.
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: CSRF token from the login response. Required in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Revocation request recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revocation_requested
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            The caller has no valid session, with or without a token. This
            is answered before the execution is looked up, so an existing
            and a missing execution ID get the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed, the session lacks cancel permission, the
            token is invalid, the revocation window has closed, or the caller
            is not the account's contact email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Execution not found, or outside the session's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The execution status cannot be revoked (still pending or
            notified, or not completed), or its status changed concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            Token mode only, the revocation token matches but has expired.
            The token is matched first, so a wrong token on an expired link
            is 403, as on approve and cancel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/approve/{id}/details:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: getApprovalDetails
      tags: [Purchases]
      summary: Read a pending purchase's details for the approval link
      description: >
        Read-only; POST only so the approval token travels in the body. A
        signed-in session is always required. A session holding view:purchases
        with the execution in its account scope gets the details without a
        token. Otherwise the request needs both a valid approval token for
        this execution and a session whose email is the contact email of an
        account on the execution. Every final denial answers like a missing
        execution (404).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: token
          in: query
          required: false
          description: >
            Approval token, accepted as a fallback. Prefer the request body so
            the token stays out of access logs.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Approval token from the approval email link.
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Approval token from the approval email link.
      responses:
        '200':
          description: Purchase execution details, as returned by GET /api/purchases/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseExecution'
        '400':
          description: The execution ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >
            The caller has no valid session. This is answered before the
            execution is looked up, so an existing and a missing execution ID
            get the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF validation failed (checked before the execution is looked up).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Execution not found, or the caller may not read it (no
            view:purchases or out of scope, and no valid token plus matching
            contact email).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            Token path only. The approval token matches but has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/purchases/retry/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: retryPurchase
      tags: [Purchases]
      summary: Retry a failed purchase execution
      description: >
        Creates a new pending execution from a failed execution's stored
        recommendations and sends a fresh approval email; the failed row keeps
        its status and links to the new one. Requires a bearer session (an
        API key alone gets 401) holding retry-any, or retry-own for an
        execution the caller created, with the execution in the caller's
        account scope. The recommendations must also satisfy the Constraints
        of the caller's execute permission on purchases.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: force
          in: query
          required: false
          description: >
            "true" (case-insensitive) overrides the soft block applied once an
            execution has been retried 5 times. It does not override any other
            409.
          schema:
            type: string
      responses:
        '200':
          description: Retry execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryPurchaseResponse'
        '400':
          description: >
            Invalid execution ID, or the stored recommendations fail validation
            (negative cost or savings, totals above the allowed maximum, or a
            zero total commitment).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid bearer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed, the session lacks retry-any or retry-own
            (or retry-own on another user's execution), or the recommendations
            exceed the Constraints of the session's execute permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Execution not found, or outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The execution cannot be retried: its status is not failed, it was
            already retried (retry_execution_id names the successor when
            known; a concurrent retry also answers this way), it is a plan step
            with no recommendations, it belongs to a settled ladder tranche,
            a provider re-drive of it is unsafe (ops_hint plus
            redrive_unsafe, permanent and not overridable by force), its
            failure is operator-fixable (ops_hint plus failure_reason), or it
            reached the retry threshold without force=true (retry_attempt_n
            plus threshold).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      retry_execution_id:
                        type: string
                        format: uuid
                      ops_hint:
                        type: string
                      redrive_unsafe:
                        type: boolean
                      failure_reason:
                        type: string
                      retry_attempt_n:
                        type: integer
                      threshold:
                        type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /api/purchases/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        description: >
          A purchase execution ID, or the purchase_id of a purchase history
          row. For Azure the purchase_id is the reservation's ARM resource ID,
          which contains "/" and is sent as-is: everything between
          /api/purchases/ and /revoke is the ID.
        schema:
          type: string
    post:
      operationId: revokePurchase
      tags: [Purchases]
      summary: Revoke a purchase within its free-cancel window
      description: >
        Requires a bearer session (an API key alone gets 401) holding
        revoke-any or revoke-own on purchases, checked against the
        permission's Constraints. When the ID is an execution, a still
        scheduled execution is canceled before any provider call (status
        "canceled"). Otherwise the purchase history row is revoked: only
        Azure reservations are supported, within 7 days of purchase less a
        one-hour safety margin, and the body must echo the quote from GET
        /api/purchases/{id}/revoke/calculate. An already revoked row answers
        "already_revoked"; a row whose Azure refund was issued but not yet
        recorded, or is being posted by a concurrent revoke of the same
        purchase, answers code RECONCILE_PENDING and must not be retried.
        Only one revoke at a time posts the Azure return.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePurchaseRequest'
      responses:
        '200':
          description: Canceled, revoked, already revoked, or refund pending reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokePurchaseResponse'
        '400':
          description: >
            Invalid JSON body, expected_refund_amount or
            expected_refund_currency missing for an Azure revoke, or Azure
            rejected the refund calculation or return as a client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid bearer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed, the session lacks revoke-any and
            revoke-own, revoke-own on another user's scheduled execution, the
            purchase is in an account the session cannot access or has no
            account attribution, the request exceeds the permission's
            Constraints, or the authentication service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            No execution or purchase history row has this ID, or the
            execution is outside the caller's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            The ID is an execution that is no longer scheduled (the purchase
            already ran or the execution was never scheduled), so it cannot be
            canceled for free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The purchase cannot be revoked in-app: the provider is not Azure
            (AWS and GCP have no direct cancel API), the Azure return window
            has closed, the reservation IDs cannot be parsed from the
            purchase_id, Azure returned no refund quote, or the confirmed
            refund amount or currency diverges from Azure's current quote
            (re-quote and confirm again).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/purchases/{id}/revoke/calculate:
    parameters:
      - name: id
        in: path
        required: true
        description: >
          The purchase_id of a purchase history row. For Azure this is the
          reservation's ARM resource ID, which contains "/" and is sent as-is.
        schema:
          type: string
    get:
      operationId: calculateRevokeRefund
      tags: [Purchases]
      summary: Quote the refund for revoking an Azure reservation
      description: >
        First step of the quote-then-confirm revoke flow; nothing is changed.
        Runs Azure CalculateRefund and returns the amount and currency to send
        back as expected_refund_amount and expected_refund_currency on POST
        /api/purchases/{id}/revoke. Same session, permission and window rules
        as that POST.
      responses:
        '200':
          description: Refund quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeRefundQuote'
        '400':
          description: Azure rejected the refund calculation as a client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid bearer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            The session lacks revoke-any and revoke-own, the purchase is in an
            account the session cannot access or has no account attribution,
            the request exceeds the permission's Constraints, or the
            authentication service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No purchase history row has this purchase_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The provider is not Azure, the Azure return window has closed, the
            reservation IDs cannot be parsed from the purchase_id, or Azure
            returned no refund amount or currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/purchases/{id}/marketplace-list:
    parameters:
      - name: id
        in: path
        required: true
        description: The AWS Reserved Instance ID (purchase history purchase_id).
        schema:
          type: string
          format: uuid
    post:
      operationId: createMarketplaceListing
      tags: [Purchases]
      summary: List a Standard Reserved Instance on the AWS RI Marketplace
      description: >
        Requires a bearer session holding sell-any or sell-own on purchases,
        checked against the permission's Constraints. The purchase's cloud
        account must be in the caller's account scope; a purchase with no
        cloud account needs sell-any and an unrestricted scope. Only Standard RIs with
        at least one month remaining can be listed. Signs AWS calls as the
        purchase's own cloud account. A retry after an ambiguous failure
        reuses the stored client token and price schedule, so it does not
        create a second listing.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceListRequest'
      responses:
        '200':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceListResponse'
        '400':
          description: >
            Invalid ID or body, an invalid price_schedule (non-positive term
            or price, a term beyond the remaining months, a price below the
            floor, or no default price computable), the RI is not Standard,
            the purchase's cloud account is missing, not AWS or cannot be
            signed for, the account role could not be assumed, or AWS rejected
            the request as a client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid bearer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed, the session lacks sell-any and sell-own,
            the purchase is outside the caller's accounts or has no account
            attribution, or the request exceeds the permission's Constraints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No purchase history row has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A listing is already active or in progress for this RI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The purchase has no timestamp or an unsupported term, or less than
            one month of its term remains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: >
            AWS failed, the role assumption failed transiently, AWS returned a
            dead listing, or a created listing could not be saved (the message
            says whether it was canceled or may still be active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AWS throttled the role assumption; retry after the Retry-After delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/{id}/marketplace-cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: The AWS Reserved Instance ID (purchase history purchase_id).
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelMarketplaceListing
      tags: [Purchases]
      summary: Cancel an active AWS RI Marketplace listing
      description: >
        Same session, permission and account rules as marketplace-list.
        Cancels the RI's active listing on AWS and records the new state.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Listing canceled
          content:
            application/json:
              schema:
                type: object
                required: [listing_id, listing_state]
                properties:
                  listing_id:
                    type: string
                  listing_state:
                    type: string
                    description: Listing state reported by AWS after the cancel.
        '400':
          description: >
            Invalid ID, the purchase's cloud account is missing, not AWS or
            cannot be signed for, the account role could not be assumed, or
            AWS rejected the cancel as a client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid bearer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed, the session lacks sell-any and sell-own,
            the purchase is outside the caller's accounts or has no account
            attribution, or the request exceeds the permission's Constraints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No purchase history row has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The RI has no active listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            Server error, including a listing canceled on AWS whose new state
            could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: AWS failed, or the role assumption failed transiently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AWS throttled the role assumption; retry after the Retry-After delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---- Planned Purchases --------------------------------------------------
  /api/purchases/planned:
