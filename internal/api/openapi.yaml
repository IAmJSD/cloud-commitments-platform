  # ---- RI Exchange --------------------------------------------------------
  /api/ri-exchange/instances:
    get:
      operationId: listConvertibleRIs
      tags: [RIExchange]
      summary: List convertible Reserved Instances eligible for exchange
      description: >
        Requires `view:purchases` permission. Lists the convertible RIs of the
        deployment's own AWS account. When that account is outside the
        session's allowed accounts, the response is a 200 with an empty
        `instances` list rather than a 403 or 404. An `account_id` that names
        a different account also yields an empty list.
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: >
            Convertible RI list. Empty when the deployment's AWS account is
            outside the session's allowed accounts.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/azure-instances:
    get:
      operationId: listExchangeableAzureRIs
      tags: [RIExchange]
      summary: List Azure Reserved Instances eligible for exchange
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Azure exchangeable RI list
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/AzureExchangeableReservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/azure-instances/compatible-offerings:
    post:
      operationId: getAzureCompatibleOfferings
      tags: [RIExchange]
      summary: Price a proposed Azure RI exchange and list compatible offerings
      description: >
        Requires `view:purchases` permission and `allowed_accounts` scope
        over the cloud account registered for `subscription_id`. Runs Azure
        CalculateExchange against the given source reservations and target
        SKUs and returns the priced candidate offerings plus a cost preview,
        without committing any financial transaction.

        Each target's billing scope is always derived from `subscription_id`.
        A target may omit `billing_scope_id`; supplying one that names a
        different subscription is a 400.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, sources, targets]
              properties:
                subscription_id:
                  type: string
                sources:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeSource'
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeTarget'
      responses:
        '200':
          description: Compatible offerings and cost preview
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/ri-exchange/azure-instances/exchange:
    post:
      operationId: executeAzureExchange
      tags: [RIExchange]
      summary: Execute an Azure RI exchange (irreversible)
      description: >
        Requires `execute:ri-exchange` permission (deliberately separate from
        `execute:purchases`, mirroring the AWS execute endpoint) plus
        `allowed_accounts` scope over the cloud account registered for
        `subscription_id`. Each target's billing scope is derived from
        `subscription_id`, so the charge always lands on the account whose
        permission constraints were checked; a `billing_scope_id` naming a
        different subscription is a 400. The server
        re-runs CalculateExchange itself against the given sources/targets
        and only executes the fresh session that call returns -- a
        client-supplied session is never trusted. Execution is refused when
        the fresh quote carries policy errors, omits a net payable amount,
        is denominated in a different currency than requested, or exceeds
        `max_payment_due`. A source whose applied scope cannot be carried onto
        the purchased reservation (see `applied_scope_type` on
        AzureExchangeableReservation), or sources with different applied
        scopes, are refused with 422 before any Azure call; the same holds
        for the compatible-offerings preview.
        Submits are deduplicated for 15 minutes on a fingerprint of
        `subscription_id` plus the sources and targets with their quantities,
        so a retry after a client timeout returns 409 rather than committing
        the exchange a second time. The spend cap and currency are not part of
        that fingerprint: raising the cap does not make it a different
        purchase. See the 409 response: it does not assert that the earlier
        submit succeeded, only that it claimed the window.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, sources, targets, max_payment_due, currency]
              properties:
                subscription_id:
                  type: string
                sources:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeSource'
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeTarget'
                max_payment_due:
                  type: string
                  description: Spend-cap guardrail (decimal string, e.g. "1000.00")
                currency:
                  type: string
                  description: ISO 4217 currency code the cap is denominated in
      responses:
        '200':
          description: Exchange executed
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/ri-exchange/target-offerings:
    get:
      operationId: listTargetOfferings
      tags: [RIExchange]
      summary: List available RI offerings to exchange into
      description: >
        Requires `view:purchases` permission. Looks up the source RI in the
        deployment's own AWS account. When that account is outside the
        session's allowed accounts the response is 404, the same as for an
        unknown `source_ri_id`, so a scoped caller cannot tell which RIs
        exist. That check runs before `source_ri_id` is validated, so such a
        caller gets 404 even with no `source_ri_id`.
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - name: source_ri_id
          in: query
          required: true
          description: ID of the convertible RI to exchange from.
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: AWS region of the source RI. Defaults to the region the deployment's AWS SDK chain resolves.
          schema:
            type: string
      responses:
        '200':
          description: Target offering list
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '`source_ri_id` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            The deployment's AWS account is outside the session's allowed
            accounts, or no convertible RI with `source_ri_id` exists in the
            region. The two cases are indistinguishable to a scoped caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The source RI's scope and availability zone disagree (a zonal RI
            with no availability zone, or a regional RI that names one), so no
            offering lookup is made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ri-exchange/utilization:
    get:
      operationId: getRIUtilization
      tags: [RIExchange]
      summary: Get utilization metrics for Reserved Instances
      description: >
        Requires `view:purchases` permission. Reads the deployment's own AWS
        account. When that account is outside the session's allowed accounts,
        the response is a 200 with an empty `utilization` list rather than a
        403 or 404.
      responses:
        '200':
          description: >
            RI utilization data. Empty when the deployment's AWS account is
            outside the session's allowed accounts.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/reshape-recommendations:
    get:
      operationId: getReshapeRecommendations
      tags: [RIExchange]
      summary: Get reshape recommendations for convertible RIs
      description: >
        Requires `view:purchases` permission. Reads the deployment's own AWS
        account. When that account is outside the session's allowed accounts,
        the response is a 200 with an empty `recommendations` list rather
        than a 403 or 404.
      responses:
        '200':
          description: >
            Reshape recommendation list. Empty when the deployment's AWS
            account is outside the session's allowed accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  excluded_ris:
                    type: array
                    description: >
                      Convertible RIs left out of cost-based analysis
                      because their monthly cost cannot be computed (AWS
                      returned no term length, or no pricing: fixed, usage
                      and recurring charges total zero or less), so they have
                      no recommendation. reason says which. Omitted when
                      empty.
                    items:
                      type: object
                      properties:
                        ri_id:
                          type: string
                        reason:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/quote:
    post:
      operationId: getExchangeQuote
      tags: [RIExchange]
      summary: Get a quote for an RI exchange before executing
      description: >
        Requires `view:purchases` permission. Returns the exchange valuation
        without committing any financial transaction. The quote reads the
        deployment's own AWS account, so a session whose allowed accounts do
        not cover that account gets 403.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ri_ids]
              anyOf:
                - required: [targets]
                  properties:
                    targets:
                      minItems: 1
                - required: [target_offering_id, target_count]
                  properties:
                    target_offering_id:
                      minLength: 1
                    target_count:
                      minimum: 1
              description: >
                One of `targets` or `target_offering_id` with `target_count`
                is required, otherwise 400. When both are present, `targets`
                wins.
              properties:
                ri_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                targets:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExchangeTarget'
                target_offering_id:
                  type: string
                  description: Legacy single-target form. Needs `target_count`.
                target_count:
                  type: integer
                  format: int32
                  description: Legacy single-target form. Needs `target_offering_id`.
                region:
                  type: string
                  description: >
                    AWS region to price the quote in. Defaults to the
                    deployment's region.
      responses:
        '200':
          description: Exchange quote
          content:
            application/json:
              schema:
                type: object
                required: [Region]
                properties:
                  Region:
                    type: string
                    minLength: 1
                    description: >
                      AWS region the quote was priced in. Always set. Send
                      this same value as `region` on
                      `/api/ri-exchange/execute`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the session lacks `view:purchases`, or the
            deployment's AWS account is outside the session's allowed
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ri-exchange/execute:
    post:
      operationId: executeRIExchange
      tags: [RIExchange]
      summary: Execute an RI exchange (irreversible)
      description: >
        Requires `execute:ri-exchange` permission. This is intentionally a
        separate, narrower permission from `execute:purchases` because RI
        exchanges submitted to AWS cannot be rolled back. Non-admin users must
        be explicitly granted `execute:ri-exchange` via a custom group; there
        is no default user-role grant.
        Submits are deduplicated for 15 minutes on a fingerprint of the
        deployment's cloud account and region plus the source RIs and targets
        with their counts, so a retry after a client timeout returns 409 rather
        than committing the exchange a second time. `max_payment_due_usd` is
        not part of that fingerprint: raising the cap does not make it a
        different purchase. See the 409 response: it does not assert that the
        earlier submit succeeded, only that it claimed the window.
        The exchange runs in the deployment's own AWS account, so a session
        whose allowed accounts do not cover that account gets 403.
        A quote that is not denominated in USD, or names no currency, is
        refused with 422 before the exchange is accepted, because
        `max_payment_due_usd` cannot be enforced against it.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ri_ids, max_payment_due_usd, region]
              anyOf:
                - required: [targets]
                  properties:
                    targets:
                      minItems: 1
                - required: [target_offering_id, target_count]
                  properties:
                    target_offering_id:
                      minLength: 1
                    target_count:
                      minimum: 1
              description: >
                One of `targets` or `target_offering_id` with `target_count`
                is required, otherwise 400. When both are present, `targets`
                wins.
              properties:
                ri_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                targets:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExchangeTarget'
                target_offering_id:
                  type: string
                  description: Legacy single-target form. Needs `target_count`.
                target_count:
                  type: integer
                  format: int32
                  description: Legacy single-target form. Needs `target_offering_id`.
                max_payment_due_usd:
                  type: string
                  minLength: 1
                  description: Spend-cap guardrail (decimal string, e.g. "1000.00")
                region:
                  type: string
                  minLength: 1
                  description: >
                    AWS region to execute in. Required: a missing region is
                    rejected with 400 rather than defaulted, since an exchange
                    cannot be undone. Send the `Region` the quote returned.
      responses:
        '200':
          description: Exchange submitted
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the session lacks `execute:ri-exchange` or
            fails its constraints, 4-eyes approval mode is on (direct execution
            is disabled), or the deployment's AWS account is outside the
            session's allowed accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/ri-exchange/config:
    get:
      operationId: getRIExchangeConfig
      tags: [RIExchange]
      summary: Get RI exchange configuration
      description: Requires `view:config` permission.
      responses:
        '200':
          description: RI exchange configuration
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateRIExchangeConfig
      tags: [RIExchange]
      summary: Update RI exchange configuration
      description: >-
        Requires `update:config` permission. While 4-eyes approval mode
        (`require_different_approver`) is on, the scheduler runs `auto` mode
        as `manual`: it only raises pending exchanges, which need approval.
        The stored mode is not changed.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/history:
    get:
      operationId: getRIExchangeHistory
      tags: [RIExchange]
      summary: Get RI exchange history
      responses:
        '200':
          description: RI exchange history list
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/approve/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: approveRIExchange
      tags: [RIExchange]
      summary: Approve a pending RI exchange
      description: >
        Two modes. Session mode: session bearer token plus X-CSRF-Token; the
        session must hold approve-any, or approve-own for an exchange it
        created, within the deployment account scope. Token mode (email
        link): the approval token in the query string, no session needed
        unless 4-eyes mode is on, in which case a token request with no
        session fails with 500, including for an exchange with no recorded
        creator (every scheduler- or ladder-created exchange); such an
        exchange has no requester to differ from, so under 4-eyes any
        signed-in approver may approve it. A session that holds approve permission wins
        over a token in the same request (the token is ignored); a session
        that lacks the permission, or holds only approve-own for an exchange
        it did not create, falls through to token mode when a token is
        present; a CSRF rejection never falls through. The token is read
        from the query string only. This route
        never returns 401: a request with no token and no usable session
        fails CSRF validation with 403. The token alone authorizes, so the
        route is open to callers without a session; token mode answers an
        unknown exchange id with the same 403 as a wrong token, so it does
        not reveal which ids exist. Likewise a session holding only
        approve-own gets the same 403 for an unknown id as for another
        user's exchange in any status, and falls through to token mode for
        both.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: CSRF token from the login response. Required in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Exchange approved and executed (the body carries a status such as completed or failed)
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: >
            CSRF validation failed (including a request with neither a token
            nor a valid session), the session lacks approve permission, the
            token is invalid, or, when a session exists, 4-eyes mode rejects
            the approver (for example the creator approving their own
            exchange). In token mode an unknown exchange id, an exchange with
            no approval token and a wrong token get the same 403 and body. A
            session holding only approve-own gets the same 403 and body for an
            unknown id as for another user's exchange, pending or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Session mode with approve-any (or the admin key) only, the
            exchange does not exist. Token mode answers an unknown id with
            403, like a wrong token, and an approve-own session answers it
            like another user's exchange.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The exchange is no longer pending (already processed, or canceled
            by a newer analysis run), including when a concurrent approve or
            reject changed it first. An approve-own session gets this only
            for an exchange it created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            The exchange has expired (its expires_at has passed). Token mode
            checks this once the token matches, so a wrong token on an
            expired exchange is 403; both modes also get 410 when the
            exchange expires before the atomic transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: >
            Server error, or 4-eyes mode is on and a token request carried no
            resolvable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ri-exchange/reject/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: rejectRIExchange
      tags: [RIExchange]
      summary: Reject a pending RI exchange (token-based, no session required)
      description: >
        Authorized by the rejection token in the query string alone. A session
        is ignored and no CSRF check runs. A missing token is 400. An unknown
        exchange id gets the same 403 and body as a wrong token, so the route
        does not reveal which ids exist.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Exchange rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: >
            The rejection token is invalid. An unknown exchange id and an
            exchange with no token get the same answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The exchange is no longer pending (already processed or canceled),
            including when a concurrent approve or reject changed it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            The rejection token matches but the exchange has expired (its
            expires_at has passed). A wrong token on an expired exchange is 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ri-exchange/resolve/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: resolveRIExchange
      tags: [RIExchange]
      summary: Record an operator's outcome for a stale processing RI exchange
      description: >
        A run that crashed between the provider call and its ledger write
        leaves the exchange processing, holding its reserved ceiling against
        the daily cap. After checking AWS, an operator records whether the
        exchange happened. `failed` releases the hold and requires
        `acknowledge_unknown_outcome`; `completed` keeps the reserved amount
        on today's books and may name the provider `exchange_id`. Requires
        `execute:ri-exchange`, checked against the permission's constraints
        with `checked_region` as the region, and a signed-in user or user API
        key (the admin API key is refused). The store refuses a row that a
        running writer may still settle, and a repeat of the same request
        returns the stored result with `replayed: true`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, reason, cloud_check]
              properties:
                outcome:
                  type: string
                  enum: [failed, completed]
                reason:
                  type: string
                  minLength: 10
                  maxLength: 300
                  description: Free text, trimmed, without control characters.
                exchange_id:
                  type: string
                  pattern: '^[A-Za-z0-9-]{1,100}$'
                  description: Provider exchange id. Only allowed with outcome completed.
                acknowledge_unknown_outcome:
                  type: boolean
                  description: Must be true when outcome is failed.
                cloud_check:
                  type: object
                  additionalProperties: false
                  required: [checked_account_id, checked_region, checked_at]
                  description: >
                    Where the operator verified the exchange at AWS. The store
                    requires the exchange's own account and region and a time
                    after its last change.
                  properties:
                    checked_account_id:
                      type: string
                      pattern: '^\d{12}$'
                    checked_region:
                      type: string
                      pattern: '^[a-z0-9-]{1,32}$'
                    checked_at:
                      type: string
                      format: date-time
      responses:
        '200':
          description: Exchange resolved, or the same resolve replayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  payment_due:
                    type: string
                  note:
                    type: string
                  replayed:
                    type: boolean
        '400':
          description: >
            Invalid id or body: body over 4096 bytes, unknown fields, a
            missing or invalid field, or a cloud check that does not match
            the exchange.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the session lacks `execute:ri-exchange` or
            fails its constraints, or the caller is the admin API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such exchange, or the deployment's AWS account is outside the session's allowed accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The exchange is not a stale processing row this request can resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: RI exchange resolve storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---- History ------------------------------------------------------------
  /api/history:
    get:
      operationId: getHistory
      tags: [History]
      summary: Get purchase history
      description: >-
        Lists completed purchases and terminal executions (failed, expired,
        canceled, ...) newest first, `limit` rows per page, plus the actionable
        executions (pending approvals and in-flight purchases). Actionable
        executions are not paged: the first page lists all of them, up to
        `actionable_executions_limit`, and pages fetched with `cursor` leave
        them out. To fetch the next page, repeat the request with the same
        filters and `cursor` set to the previous response's `next_cursor`.
        Rows written after the first page was loaded never shift, repeat or
        skip a row on a later page.
      parameters:
        - $ref: '#/components/parameters/HistoryProvider'
        - name: account_ids
          in: query
          description: >
            Comma-separated cloud account UUIDs (at most 200). Combined with
            account_id (the union of both is matched).
          schema:
            type: string
        - $ref: '#/components/parameters/AccountID'
        - name: start
          in: query
          description: >
            First day to include (YYYY-MM-DD, UTC). When only one of start
            and end is sent, the other defaults to 366 days away from it.
          schema:
            type: string
            format: date
        - name: end
          in: query
          description: Last day to include (YYYY-MM-DD, UTC, inclusive). The range may span at most 366 days.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: >-
            Page size for completed purchases and terminal executions together.
            Values below 1 use the default; values above 1000 are capped at 1000.
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: cursor
          in: query
          description: >-
            Opaque position to continue from: the `next_cursor` value of the
            previous page, passed unchanged. Omit it for the first page. Any
            other value is rejected with 400. There is no `offset` parameter;
            sending one is rejected with 400.
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Purchase history with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/history/analytics:
    get:
      operationId: getHistoryAnalytics
      tags: [History]
      summary: Get time-series analytics for purchase history
      parameters:
        - $ref: '#/components/parameters/AnalyticsAccountID'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: interval
          in: query
          description: Bucket size of the returned data points.
          schema:
            type: string
            enum: [hourly, daily, weekly, monthly]
            default: hourly
        - $ref: '#/components/parameters/HistoryProvider'
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: account_id is outside the caller's allowed accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /api/history/breakdown:
    get:
      operationId: getHistoryBreakdown
      tags: [History]
      summary: Get savings breakdown by dimension
      parameters:
        - $ref: '#/components/parameters/AnalyticsAccountID'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: dimension
          in: query
          schema:
            type: string
            enum: [service, provider, region, account]
            default: service
      responses:
        '200':
          description: Breakdown data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: account_id is outside the caller's allowed accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  # ---- Analytics ----------------------------------------------------------
  /api/analytics/collect:
    post:
      operationId: triggerAnalyticsCollection
      tags: [Analytics]
      summary: Trigger manual analytics data collection (admin only)
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
