          format: double
        count:
          type: integer

    RecommendationRecord:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        service:
          type: string
        region:
          type: string
        resource_type:
          type: string
        engine:
          type: string
        cloud_account_id:
          type: string
          nullable: true
          description: >
            The cloud account this recommendation belongs to. Matched
            against the stored recommendation set together with provider,
            service, region, resource_type, engine, term and payment
            (#1905); an account-scoped recommendation cannot be resolved
            without it. Null or omitted only for recommendations that are
            not tied to a specific account.
        count:
          type: integer
        recommended_count:
          type: integer
          description: >
            The pre-scaling count originally recommended, before any
            Capacity % scaling was applied to produce count. Optional:
            omitted or 0 means "not supplied" and the capacity-consistency
            check is skipped for this recommendation. For a Savings Plan,
            the stored value of this field is also the count that count
            must equal, since Savings Plans are priced by hourly commitment
            rather than by count.
        term:
          type: integer
        payment:
          type: string
        upfront_cost:
          type: number
          format: double
        monthly_cost:
          type: number
          format: double
        savings:
          type: number
          format: double
        selected:
          type: boolean
        purchased:
          type: boolean
        purchase_id:
          type: string
        error:
          type: string

    CollectResult:
      type: object
      description: Result of a recommendation collection run
      properties:
        collected:
          type: integer
        errors:
          type: array
          items:
            type: string

    RecommendationsFreshness:
      type: object
      required: [last_collected_at, last_collection_error, last_collection_started_at, last_collection_partial]
      properties:
        last_collected_at:
          type: string
          format: date-time
          nullable: true
          description: When recommendations were last persisted; null on a cold start.
        last_collection_error:
          type: string
          nullable: true
          description: Error from the most recent collection when a provider failed; null otherwise.
        last_collection_started_at:
          type: string
          format: date-time
          nullable: true
          description: Set while a collection is in flight.
        last_collection_partial:
          $ref: '#/components/schemas/RecommendationsCollectionPartial'

    RecommendationsCollectionPartial:
      type: object
      nullable: true
      description: >
        Non-null when the most recent persisted collection kept rows from
        at least one incomplete sweep. Cleared by the next collection whose
        sweeps are all complete. Carries counts and reason categories only.
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/PartialProviderSweep'

    PartialProviderSweep:
      type: object
      required: [provider, incomplete_accounts, attempted_scopes, failed_scopes, failed_details, reasons]
      properties:
        provider:
          type: string
          enum: [aws, azure, gcp]
        incomplete_accounts:
          type: integer
          description: Accounts (or the ambient host identity) whose sweep was incomplete.
        attempted_scopes:
          type: integer
          description: >
            Scopes (Azure subscriptions, GCP projects) the incomplete sweeps
            were asked to cover; 0 when the provider does not report it (AWS).
        failed_scopes:
          type: integer
          description: Scopes that could not be queried.
        failed_details:
          type: integer
          description: Individual recommendation details rejected inside answering scopes (AWS).
        reasons:
          type: object
          description: >
            Failure count per reason category. Keys are drawn from a closed
            set: permission_denied, throttled, timeout, canceled, not_found,
            provider_unavailable, other.
          additionalProperties:
            type: integer
          example:
            permission_denied: 2
            throttled: 1

    # -- Plans --------------------------------------------------------------
    PlansResponse:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanWithHealth'

    PlanRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        auto_purchase:
          type: boolean
        notification_days_before:
          type: integer
        max_step_commitment:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: >-
            Ceiling on the total commitment (upfront + monthly * term) one ramp
            step may auto-purchase. Omit on create for no cap (auto-purchase of
            steps with recommendations is then refused); omit on update to keep
            the current cap. On update, explicit null clears a manual plan's
            cap and is refused while auto_purchase is true.
        provider:
          type: string
        service:
          type: string
        term:
          type: integer
        payment:
          type: string
        target_coverage:
          type: integer
        ramp_schedule:
          type: string
          enum: [immediate, weekly-25pct, monthly-10pct, custom]
        custom_step_percent:
          type: integer
        custom_interval_days:
          type: integer
        target_accounts:
          type: array
          minItems: 1
          description: >
            UUIDs of cloud accounts the plan will purchase for. Required on
            POST /plans — a plan must be tied to at least one account. Sending
            an empty array returns HTTP 400.
          items:
            type: string
            format: uuid

    PurchasePlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        auto_purchase:
          type: boolean
        notification_days_before:
          type: integer
        max_step_commitment:
          type: number
          nullable: true
          description: Cap on the total commitment one ramp step may auto-purchase; null means auto-purchase of steps with recommendations is refused.
        services:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceConfig'
        ramp_schedule:
          $ref: '#/components/schemas/RampSchedule'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        next_execution_date:
          type: string
          format: date-time
          nullable: true
        last_execution_date:
          type: string
          format: date-time
          nullable: true
        last_notification_sent:
          type: string
          format: date-time
          nullable: true

    # PlanWithHealth wraps PurchasePlan with a read-time-only health-score
    # badge (issue #340 follow-up): score/factors are computed from the
    # plan's attributes and recent executions, never persisted, so they
    # can't drift into the PurchasePlan schema above.
    PlanWithHealth:
      allOf:
        - $ref: '#/components/schemas/PurchasePlan'
        - type: object
          properties:
            health_score:
              type: integer
              nullable: true
              minimum: 0
              maximum: 100
              description: >
                0-100 plan health score. Green >= 80, amber 50-79, red < 50.
                Null when the score could not be computed because one of its
                required inputs was unavailable: the plan's execution counts,
                or the stuck-ramp report that ramp_blocked is derived from.
                Every factor only ever subtracts, so a score computed without
                one of them would read healthier than the plan is; the whole
                score is withheld instead. Clients must render null as
                "unknown" rather than substituting a default.
            health_factors:
              type: array
              items:
                $ref: '#/components/schemas/PlanHealthFactor'

    PlanHealthFactor:
      type: object
      description: One penalty subtracted from a plan's health score, named so a bad score is actionable instead of opaque.
      properties:
        code:
          type: string
          description: >
            Which check produced the penalty. The two execution-based codes
            (failed_executions, canceled_executions) count only executions
            that entered that state within the trailing execution-retention
            window (30 days), not over all history, so they describe the
            plan's recent behaviour rather than its lifetime record.
            ramp_blocked is derived from the execution rows of the plan's next
            ramp step, not time-windowed, and pre-empts stalled /
            behind_schedule: it means the step cannot complete because one of
            its executions (one per cloud account, once the step has fanned
            out) failed with no retry in flight, as opposed to the plan merely
            running late. The remaining codes are derived from the plan's
            current attributes and ramp schedule.
          enum: [overdue, failed_executions, canceled_executions, ramp_blocked, stalled, behind_schedule, disabled_midway]
        penalty:
          type: integer
          description: Points subtracted from 100 by this factor.
        note:
          type: string
          description: >
            Human-readable reason for display in the badge tooltip. Free
            text, and its wording may change; clients must branch on `code`
            rather than parsing this.

    RampSchedule:
      type: object
      properties:
        type:
          type: string
          enum: [immediate, weekly, monthly, custom]
        percent_per_step:
          type: number
          format: double
        step_interval_days:
          type: integer
        current_step:
          type: integer
        total_steps:
          type: integer
        start_date:
          type: string
          format: date-time

    CreatePlannedPurchasesRequest:
      type: object
      properties:
        count:
          type: integer
        start_date:
          type: string
          format: date
          description: >
            First purchase date (YYYY-MM-DD), interpreted as midnight UTC.
            Must be after the current time, so the earliest accepted value
            is tomorrow's date in UTC.

    CreatePlannedPurchasesResponse:
      type: object
      properties:
        created:
          type: integer

    # -- Purchases ----------------------------------------------------------
    ExecutePurchaseRequest:
      type: object
      required: [recommendations]
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationRecord'
          minItems: 1
          maxItems: 1000
          description: >
            Each item must match a recommendation in the current recommendation set on
            (provider, cloud_account_id, service, region, resource_type, engine, term,
            payment). Only count, recommended_count and selected are honoured; every other
            field (including id, details, upfront_cost, monthly_cost, savings,
            on_demand_cost, purchased, purchase_id and error) is replaced server-side from
            the stored recommendation, with the cost fields scaled by count. The spend-cap
            check, execution record and approval email use those replaced values. Savings
            plan items must keep the recommended count.

    ExecutePurchaseResponse:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        status:
          type: string
        recommendation_count:
          type: integer
        total_upfront_cost:
          type: number
          format: double
        estimated_savings:
          type: number
          format: double
        message:
          type: string

    PurchaseExecution:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        plan_id:
          type: string
        plan_name:
          type: string
        status:
          type: string
          # Migration 000089 (expand-contract rename, cancelled -> canceled):
          # both spellings are valid during the rolling deploy window. New code
          # writes "canceled" (US); rows written by old code retain "cancelled"
          # until the CONTRACT migration (#1278) normalizes them, at which
          # point the legacy entry can be removed from this enum.
          enum: [pending, notified, approved, canceled, cancelled, completed, failed, running, paused]
        step_number:
          type: integer
        scheduled_date:
          type: string
          format: date
        total_upfront_cost:
          type: number
          format: double
        estimated_savings:
          type: number
          format: double
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationRecord'
        notification_sent:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string

    PlannedPurchasesResponse:
      type: object
      properties:
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/PlannedPurchase'

    PlannedPurchase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
        plan_name:
          type: string
        scheduled_date:
          type: string
          format: date
        provider:
          type: string
        service:
          type: string
        resource_type:
          type: string
        region:
          type: string
        count:
          type: integer
        term:
          type: integer
        payment:
          type: string
        estimated_savings:
          type: number
          format: double
        upfront_cost:
          type: number
          format: double
        has_recommendations:
          type: boolean
          description: >
            False for a plan step that carries no recommendations; count,
            resource_type, upfront_cost and estimated_savings are then
            placeholders, not data (platform#609).
        status:
          type: string
        step_number:
          type: integer
        total_steps:
          type: integer

    RunPurchaseResponse:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        status:
          type: string
        message:
          type: string

    # -- History / Analytics ------------------------------------------------
    HistoryResponse:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/HistorySummary'
        summary_complete:
          type: boolean
          description: >-
            True when summary counts and sums every row matching the request's
            filters and the caller's account scope, including rows beyond the
            row caps. False only when that aggregate failed and summary fell
            back to the rows in purchases, which under-reports when truncated
            is true.
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseHistoryRecord'
        truncated:
          type: boolean
          description: >-
            True when a fetch reached its row cap, so older rows (and possibly
            pending approvals) may be missing from purchases. summary still
            counts them while summary_complete is true. May
            be a false positive when exactly `limit` or `executions_limit` rows exist.
            Also true when the actionable executions class (pending, approved,
            running, ...) reached its own cap of 1000 rows.
        limit:
          type: integer
          description: Row cap on completed purchase history rows for this request.
        executions_limit:
          type: integer
          description: >-
            Row cap on terminal executions (failed, expired, canceled, ...),
            fixed and ignoring the limit parameter. Actionable executions use a
            separate cap of 1000.

    HistorySummary:
      type: object
      description: >-
        Counts and dollar totals. Dollar totals cover completed, non-revoked
        rows only; audit-gap and partially completed execution rows count as
        completed without dollars, and canceled rows count only toward
        total_purchases.
      properties:
        total_purchases:
          type: integer
        total_completed:
          type: integer
        total_pending:
          type: integer
        total_in_progress:
          type: integer
        total_failed:
          type: integer
        total_expired:
          type: integer
        total_revoked:
          type: integer
        total_upfront:
          type: number
          format: double
          nullable: true
        total_monthly_savings:
          type: number
          format: double
        total_annual_savings:
          type: number
          format: double

    PurchaseHistoryRecord:
      type: object
      properties:
        account_id:
          type: string
        purchase_id:
          type: string
        timestamp:
          type: string
          format: date-time
        provider:
          type: string
        service:
          type: string
        region:
          type: string
        resource_type:
          type: string
        count:
          type: integer
        term:
          type: integer
        payment:
          type: string
        upfront_cost:
          type: number
          format: double
          nullable: true
        monthly_cost:
          type: number
          format: double
        estimated_savings:
          type: number
          format: double
        plan_id:
          type: string
        plan_name:
          type: string
        ramp_step:
          type: integer

    AnalyticsResponse:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        interval:
          type: string
        summary:
          $ref: '#/components/schemas/HistorySummary'
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/HistoryDataPoint'

    HistoryDataPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        total_savings:
          type: number
          format: double
        total_upfront:
          type: number
          format: double
          nullable: true
        purchase_count:
          type: integer
        cumulative_savings:
          type: number
          format: double
        by_service:
          type: object
          additionalProperties:
            type: number
            format: double
        by_provider:
          type: object
          additionalProperties:
            type: number
            format: double

    BreakdownResponse:
      type: object
      properties:
        dimension:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BreakdownValue'

    BreakdownValue:
      type: object
      properties:
        total_savings:
          type: number
          format: double
        total_upfront:
          type: number
          format: double
          nullable: true
        purchase_count:
          type: integer
        percentage:
          type: number
          format: double

    # -- Health -------------------------------------------------------------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        message:
          type: string
          description: Fixed human-readable text; never a raw error string.
        reason:
          type: string
          description: Stable code for a failed check, e.g. db_unreachable or migration_failed.

    # -- Info ---------------------------------------------------------------
    PublicInfoResponse:
      type: object
      description: >
        Unauthenticated public info. Only safe-to-expose fields are included.
        Sensitive identifiers (API key secret URL, AWS account ID) are served
        by the authenticated /api/info/deployment endpoint (#633).
      properties:
        version:
          type: string
        admin_exists:
          type: boolean

    DeploymentInfoResponse:
      type: object
      description: >
        Deployment-scoped identifiers. Requires AuthUser. Not accessible to
        unauthenticated callers (#633).
      properties:
        api_key_secret_url:
          type: string
          description: AWS Console deep-link to the Secrets Manager secret holding the API key.
        deployment_aws_account_id:
          type: string
          description: >
            AWS account ID of the CUDly Lambda deployment (from STS GetCallerIdentity).
            Present only on AWS-hosted deployments; omitted on Azure/GCP or when STS
            is unreachable. Used by the frontend to distinguish legitimate ambient-credential
            executions (cloud_account_id IS NULL because the rec targets this account)
            from orphan rows whose account was deleted (issue #608).
