  /api/purchases/planned/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    delete:
      operationId: deletePlannedPurchase
      tags: [PlannedPurchases]
      summary: Cancel and delete a planned purchase
      description: >-
        Cancels the execution and disables its plan. A caller scoped to some
        accounts must have access to every account on the plan; otherwise the
        request is refused with 403 before anything changes. If the plan's
        accounts change during the request so that the disable is refused
        after the cancel, the response is 409 and the plan stays enabled.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
