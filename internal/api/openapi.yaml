        upfront_one_time_cost: {$ref: '#/components/schemas/ArcheraDecimal'}
        discount_rate: {$ref: '#/components/schemas/ArcheraDecimal'}
        breakeven_days: {$ref: '#/components/schemas/ArcheraDecimal'}

    ArcheraHypotheticalDelta:
      type: object
