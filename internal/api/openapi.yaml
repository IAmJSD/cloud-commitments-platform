  # ---- RI Exchange --------------------------------------------------------
  /api/ri-exchange/instances:
    get:
      operationId: listConvertibleRIs
      tags: [RIExchange]
      summary: List convertible Reserved Instances eligible for exchange
      description: >
        Requires `view:purchases` permission. Lists the convertible RIs of the
        deployment's own AWS account. When that account is outside the
        session's allowed accounts, the response is a 200 with an empty
        `instances` list rather than a 403 or 404. An `account_id` that names
        a different account also yields an empty list.
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: >
            Convertible RI list. Empty when the deployment's AWS account is
            outside the session's allowed accounts.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/azure-instances:
    get:
      operationId: listExchangeableAzureRIs
      tags: [RIExchange]
      summary: List Azure Reserved Instances eligible for exchange
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Azure exchangeable RI list
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/azure-instances/compatible-offerings:
    post:
      operationId: getAzureCompatibleOfferings
      tags: [RIExchange]
      summary: Price a proposed Azure RI exchange and list compatible offerings
      description: >
        Requires `view:purchases` permission and `allowed_accounts` scope
        over the cloud account registered for `subscription_id`. Runs Azure
        CalculateExchange against the given source reservations and target
        SKUs and returns the priced candidate offerings plus a cost preview,
        without committing any financial transaction.

        Each target's billing scope is always derived from `subscription_id`.
        A target may omit `billing_scope_id`; supplying one that names a
        different subscription is a 400.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, sources, targets]
              properties:
                subscription_id:
                  type: string
                sources:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeSource'
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeTarget'
      responses:
        '200':
          description: Compatible offerings and cost preview
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/ri-exchange/azure-instances/exchange:
    post:
      operationId: executeAzureExchange
      tags: [RIExchange]
      summary: Execute an Azure RI exchange (irreversible)
      description: >
        Requires `execute:ri-exchange` permission (deliberately separate from
        `execute:purchases`, mirroring the AWS execute endpoint) plus
        `allowed_accounts` scope over the cloud account registered for
        `subscription_id`. Each target's billing scope is derived from
        `subscription_id`, so the charge always lands on the account whose
        permission constraints were checked; a `billing_scope_id` naming a
        different subscription is a 400. The server
        re-runs CalculateExchange itself against the given sources/targets
        and only executes the fresh session that call returns -- a
        client-supplied session is never trusted. Execution is refused when
        the fresh quote carries policy errors, omits a net payable amount,
        is denominated in a different currency than requested, or exceeds
        `max_payment_due`.
        Submits are deduplicated for 15 minutes on a fingerprint of
        `subscription_id` plus the sources and targets with their quantities,
        so a retry after a client timeout returns 409 rather than committing
        the exchange a second time. The spend cap and currency are not part of
        that fingerprint: raising the cap does not make it a different
        purchase. See the 409 response: it does not assert that the earlier
        submit succeeded, only that it claimed the window.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, sources, targets, max_payment_due, currency]
              properties:
                subscription_id:
                  type: string
                sources:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeSource'
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeTarget'
                max_payment_due:
                  type: string
                  description: Spend-cap guardrail (decimal string, e.g. "1000.00")
                currency:
                  type: string
                  description: ISO 4217 currency code the cap is denominated in
      responses:
        '200':
          description: Exchange executed
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/ri-exchange/target-offerings:
    get:
      operationId: listTargetOfferings
      tags: [RIExchange]
      summary: List available RI offerings to exchange into
      description: >
        Requires `view:purchases` permission. Looks up the source RI in the
        deployment's own AWS account. When that account is outside the
        session's allowed accounts the response is 404, the same as for an
        unknown `source_ri_id`, so a scoped caller cannot tell which RIs
        exist. That check runs before `source_ri_id` is validated, so such a
        caller gets 404 even with no `source_ri_id`.
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - name: source_ri_id
          in: query
          required: true
          description: ID of the convertible RI to exchange from.
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: AWS region of the source RI. Defaults to the region the deployment's AWS SDK chain resolves.
          schema:
            type: string
      responses:
        '200':
          description: Target offering list
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '`source_ri_id` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            The deployment's AWS account is outside the session's allowed
            accounts, or no convertible RI with `source_ri_id` exists in the
            region. The two cases are indistinguishable to a scoped caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The source RI's scope and availability zone disagree (a zonal RI
            with no availability zone, or a regional RI that names one), so no
            offering lookup is made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ri-exchange/utilization:
    get:
      operationId: getRIUtilization
      tags: [RIExchange]
      summary: Get utilization metrics for Reserved Instances
      description: >
        Requires `view:purchases` permission. Reads the deployment's own AWS
        account. When that account is outside the session's allowed accounts,
        the response is a 200 with an empty `utilization` list rather than a
        403 or 404.
      responses:
        '200':
          description: >
            RI utilization data. Empty when the deployment's AWS account is
            outside the session's allowed accounts.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/reshape-recommendations:
    get:
      operationId: getReshapeRecommendations
      tags: [RIExchange]
      summary: Get reshape recommendations for convertible RIs
      description: >
        Requires `view:purchases` permission. Reads the deployment's own AWS
        account. When that account is outside the session's allowed accounts,
        the response is a 200 with an empty `recommendations` list rather
        than a 403 or 404.
      responses:
        '200':
          description: >
            Reshape recommendation list. Empty when the deployment's AWS
            account is outside the session's allowed accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  excluded_ris:
                    type: array
                    description: >
                      Convertible RIs left out of cost-based analysis (for
                      example AWS returned no term length), so they have no
                      recommendation. Omitted when empty.
                    items:
                      type: object
                      properties:
                        ri_id:
                          type: string
                        reason:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/quote:
    post:
      operationId: getExchangeQuote
      tags: [RIExchange]
      summary: Get a quote for an RI exchange before executing
      description: >
        Requires `view:purchases` permission. Returns the exchange valuation
        without committing any financial transaction. The quote reads the
        deployment's own AWS account, so a session whose allowed accounts do
        not cover that account gets 403.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Exchange quote
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the session lacks `view:purchases`, or the
            deployment's AWS account is outside the session's allowed
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ri-exchange/execute:
    post:
      operationId: executeRIExchange
      tags: [RIExchange]
      summary: Execute an RI exchange (irreversible)
      description: >
        Requires `execute:ri-exchange` permission. This is intentionally a
        separate, narrower permission from `execute:purchases` because RI
        exchanges submitted to AWS cannot be rolled back. Non-admin users must
        be explicitly granted `execute:ri-exchange` via a custom group; there
        is no default user-role grant.
        Submits are deduplicated for 15 minutes on a fingerprint of the
        deployment's cloud account and region plus the source RIs and targets
        with their counts, so a retry after a client timeout returns 409 rather
        than committing the exchange a second time. `max_payment_due_usd` is
        not part of that fingerprint: raising the cap does not make it a
        different purchase. See the 409 response: it does not assert that the
        earlier submit succeeded, only that it claimed the window.
        The exchange runs in the deployment's own AWS account, so a session
        whose allowed accounts do not cover that account gets 403.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ri_ids, targets, max_payment_due_usd]
              properties:
                ri_ids:
                  type: array
                  items:
                    type: string
                targets:
                  type: array
                  items:
                    type: object
                max_payment_due_usd:
                  type: string
                  description: Spend-cap guardrail (decimal string, e.g. "1000.00")
      responses:
        '200':
          description: Exchange submitted
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the session lacks `execute:ri-exchange` or
            fails its constraints, 4-eyes approval mode is on (direct execution
            is disabled), or the deployment's AWS account is outside the
            session's allowed accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/ri-exchange/config:
    get:
      operationId: getRIExchangeConfig
      tags: [RIExchange]
      summary: Get RI exchange configuration
      description: Requires `view:config` permission.
      responses:
        '200':
          description: RI exchange configuration
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateRIExchangeConfig
      tags: [RIExchange]
      summary: Update RI exchange configuration
      description: Requires `update:config` permission.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/history:
    get:
      operationId: getRIExchangeHistory
      tags: [RIExchange]
      summary: Get RI exchange history
      responses:
        '200':
          description: RI exchange history list
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/approve/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: approveRIExchange
      tags: [RIExchange]
      summary: Approve a pending RI exchange
      description: >
        Two modes. Session mode: session bearer token plus X-CSRF-Token; the
        session must hold approve-any, or approve-own for an exchange it
        created, within the deployment account scope. Token mode (email
        link): the approval token in the query string, no session needed
        unless 4-eyes mode is on, in which case a token request with no
        session fails with 500, including for an exchange with no recorded
        creator (every scheduler- or ladder-created exchange); such an
        exchange has no requester to differ from, so under 4-eyes any
        signed-in approver may approve it. A session that holds approve permission wins
        over a token in the same request (the token is ignored); a session
        that lacks the permission, or holds only approve-own for an exchange
        it did not create, falls through to token mode when a token is
        present; a CSRF rejection never falls through. The token is read
        from the query string only. This route
        never returns 401: a request with no token and no usable session
        fails CSRF validation with 403. A missing record (404) and a wrong
        token (403) are distinguishable for unauthenticated callers.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: CSRF token from the login response. Required in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Exchange approved and executed (the body carries a status such as completed or failed)
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: >
            CSRF validation failed (including a request with neither a token
            nor a valid session), the session lacks approve permission, the
            token is invalid, the record does not support approval, or, when a
            session exists, 4-eyes mode rejects the approver (for example the
            creator approving their own exchange).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The exchange is no longer pending (already processed, expired or
            canceled by a newer analysis run).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: >
            Server error, or 4-eyes mode is on and a token request carried no
            resolvable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ri-exchange/reject/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: rejectRIExchange
      tags: [RIExchange]
      summary: Reject a pending RI exchange (token-based, no session required)
      description: >
        Authorized by the rejection token in the query string alone. A session
        is ignored and no CSRF check runs. A missing token is 400; a missing
        record (404) and a wrong token (403) are distinguishable for
        unauthenticated callers.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Exchange rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The rejection token is invalid, or the record does not support rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The exchange is no longer pending (already processed, expired or canceled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

