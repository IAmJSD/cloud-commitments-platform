      properties:
        monthly_730h_net_savings: {$ref: '#/components/schemas/ArcheraDecimal'}
        monthly_730h_commitment_cost: {$ref: '#/components/schemas/ArcheraDecimal'}
        upfront_one_time_cost: {$ref: '#/components/schemas/ArcheraDecimal'}

