openapi: 3.0.3
info:
  title: CUDly API
  description: >
    CUDly is a multi-cloud commitment (Reserved Instances, Savings Plans)
    purchase automation and cost-optimization dashboard.
  version: "1.0.0"
  license:
    name: Proprietary

servers:
  - url: /
    description: Same-origin (relative)

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

tags:
  - name: Dashboard
  - name: Configuration
  - name: Credentials
  - name: Recommendations
  - name: Plans
  - name: Purchases
  - name: PlannedPurchases
  - name: History
  - name: Analytics
  - name: Auth
  - name: APIKeys
  - name: Users
  - name: Groups
  - name: Health
  - name: Info
  - name: Docs
  - name: Insurance
    description: Read-only configuration status and configured plan comparison.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /api/insurance/status:
    get:
      operationId: getInsuranceStatus
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      tags: [Insurance]
      summary: Check insurance comparison configuration
      description: >
        Requires view:recommendations and unrestricted account scope; scoped
        sessions receive 404. Reports setting presence only, without resolving
        secrets or contacting Archera. Missing contains setting names, never values.
      responses:
        '200':
          description: Configuration presence; an unwired provider is unconfigured.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsuranceStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/insurance/comparison:
    get:
      operationId: getInsuranceComparison
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      tags: [Insurance]
      summary: Read the configured plan's insurance comparison
      description: >
        Requires view:recommendations and unrestricted account scope; scoped
        sessions receive 404. Disabled until ARCHERA_ORG_ID, ARCHERA_PLAN_ID and
        ARCHERA_API_KEY_SECRET are present. Resolves the key lazily and requests
        the configured plan without recommendation filters. This read-only result
        does not purchase, bind insurance or change recommendation eligibility.
        Vendor errors are mapped to fixed client messages, without implicit retries.
      responses:
        '200':
          description: Plan-wide comparison with exact decimal strings and disclosures.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcheraComparison'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          description: Vendor rate limit; Retry-After is present only for a positive vendor delay, rounded up to seconds.
          headers:
            Retry-After:
              description: Seconds before retrying; no automatic retry is performed.
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: >
            Vendor authentication, missing organization/plan, service or transport
            failure (including timeout), an inexact decimal, or a response over 5 MiB.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Missing configuration or the configured key could not be resolved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ---- Dashboard ----------------------------------------------------------
  /api/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [Dashboard]
      summary: Get dashboard summary
      parameters:
        - name: provider
          in: query
          description: Filter by cloud provider (aws, azure, gcp)
          schema:
            type: string
            enum: [aws, azure, gcp]
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/dashboard/upcoming:
    get:
      operationId: getUpcomingPurchases
      tags: [Dashboard]
      summary: Get upcoming scheduled purchases
      responses:
        '200':
          description: Upcoming purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingPurchaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- Configuration ------------------------------------------------------
  /api/config:
    get:
      operationId: getConfig
      tags: [Configuration]
      summary: Get full configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateConfig
      tags: [Configuration]
      summary: Update global configuration
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalConfig'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/config/service/{service}:
    parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
          enum: [ec2, rds, elasticache, opensearch]
    get:
      operationId: getServiceConfig
      tags: [Configuration]
      summary: Get per-service configuration
      responses:
        '200':
          description: Service configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateServiceConfig
      tags: [Configuration]
      summary: Update per-service configuration
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceConfig'
      responses:
        '200':
          description: Updated service configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/commitment-options:
    get:
      operationId: getCommitmentOptions
      tags: [Configuration]
      summary: Dynamically-probed AWS commitment combinations
      description: |
        Returns the (term, payment) combinations AWS actually sells for
        commitment-capable services, harvested from the reserved-offerings
        APIs at most once per server lifetime and persisted to Postgres.
        When probe data is unavailable (no AWS account connected, probe
        failed, transient DB error) returns `{"status":"unavailable"}` at
        HTTP 200 so the frontend can fall back to hardcoded rules without
        tripping its error-toast path.
      responses:
        '200':
          description: Commitment options or unavailable status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Recommendations ----------------------------------------------------
  /api/recommendations:
    get:
      operationId: getRecommendations
      tags: [Recommendations]
      summary: List commitment purchase recommendations
      parameters:
        - name: provider
          in: query
          description: Filter by cloud provider (aws, azure, gcp)
          schema:
            type: string
            enum: [aws, azure, gcp]
        - name: service
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Recommendations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/recommendations/refresh:
    post:
      operationId: refreshRecommendations
      tags: [Recommendations]
      summary: Trigger a fresh collection of recommendations from cloud providers
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Collection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/recommendations/freshness:
    get:
      operationId: getRecommendationsFreshness
      tags: [Recommendations]
      summary: Get the recommendations cache freshness and last collection outcome
      description: >
        Returns when recommendations were last collected, the most recent
        collection error, whether a collection is in flight, and whether the
        last collection was partial (some subscriptions, projects or scopes
        could not be queried, so the stored recommendations under-state the
        real opportunity).
      responses:
        '200':
          description: Freshness state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsFreshness'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- Purchase Plans -----------------------------------------------------
  /api/plans:
    get:
      operationId: listPlans
      tags: [Plans]
      summary: List purchase plans
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Plans list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPlan
      tags: [Plans]
      summary: Create a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # target_accounts is required ONLY on plan creation. The shared
              # PlanRequest schema is reused by PUT/PATCH where omitting the
              # field means "leave the existing account list unchanged"; only
              # POST enforces non-empty target_accounts to prevent universal
              # plans. Scoping the requirement here (instead of in the shared
              # schema) keeps the update payload contract loose while still
              # advertising the create contract correctly to client codegen.
              allOf:
                - $ref: '#/components/schemas/PlanRequest'
                - type: object
                  required: [target_accounts]
      responses:
        '200':
          description: Created plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getPlan
      tags: [Plans]
      summary: Get a purchase plan by ID
      responses:
        '200':
          description: Purchase plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePlan
      tags: [Plans]
      summary: Replace a purchase plan
      description: >-
        A singleton legacy service alias retains its original key, hidden filters,
        minimum count, service ramp and Enabled value when edited through its canonical
        service name. Exact-key edits retain their existing Enabled overlay behavior;
        selecting a genuinely different singleton service still replaces its settings.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlanRequest'
                - type: object
                  properties:
                    expected_updated_at:
                      type: string
                      nullable: true
                      description: >-
                        Optional Update version from the plan's updated_at. Omission,
                        null or an empty string opts out. A nonempty value must be an
                        RFC3339 timestamp; malformed values return 400 and a different
                        instant returns 409 with refresh guidance.
      responses:
        '200':
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The plan changed concurrently, the request changes the ramp schedule of a plan that has already completed a step (keep the schedule, or create a new plan), or the plan is managed by the schedule editor and the request changes what only the editor may (code editor_reconciliation_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithCode'
    patch:
      operationId: patchPlan
      tags: [Plans]
      summary: Partially update a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Patched plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditorReconciliationRequired'
    delete:
      operationId: deletePlan
      tags: [Plans]
      summary: Delete a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The plan is managed by the schedule editor and still has active or unsettled purchases. Cancel or revoke them first (code managed_plan_has_live_executions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithCode'

  /api/plans/{id}/purchases:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: createPlannedPurchases
      tags: [Plans]
      summary: Generate planned purchase executions for a plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlannedPurchasesRequest'
      responses:
        '200':
          description: Planned purchases created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlannedPurchasesResponse'
        '400':
          description: >
            Invalid request body, count outside 1-52, start_date not in
            YYYY-MM-DD form, or start_date not in the future
            ("start_date must be in the future"). start_date is read as
            midnight UTC, so today's date and earlier are refused; the
            earliest accepted date is tomorrow in UTC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the caller lacks permission or access to
            the plan, or 4-eyes mode is on and the caller has no attributable
            user (the admin API key). Rows scheduled that way could never be
            approved under 4-eyes, so the request is refused; sign in or use a
            per-user API key instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The plan is disabled, has unsupported scheduling settings, no target
            accounts or insufficient remaining steps, or the requested steps are
            occupied. Automatic plans also require a valid commitment cap and
            the global automatic purchasing switch. A plan managed by the
            schedule editor is refused whole (code editor_reconciliation_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithCode'

  # ---- Purchase Actions ---------------------------------------------------
  /api/purchases/execute:
    post:
      operationId: executePurchase
      tags: [Purchases]
      summary: Create a purchase execution from selected recommendations
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePurchaseRequest'
      responses:
        '200':
          description: Execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutePurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            CSRF validation failed, the caller lacks permission or exceeds its
            Constraints, 4-eyes mode rejects a direct execute, or 4-eyes mode is
            on and the caller has no attributable user (the admin API key). An
            execution created that way could never be approved under 4-eyes,
            so it is refused before anything is written; sign in or use a
            per-user API key instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            One of two conflict families. Idempotency: an identical submit
            already holds the idempotency claim, so THIS request was not
            executed (see the shared Conflict response for how to interpret
            that case). Stored-recommendation conflict (#1905): a
            recommendation in the request does not match any row in the
            current stored recommendation set (it was purchased, superseded,
            or never existed), two requested recommendations resolve to the
            same identity key, two rows in the stored set share one identity
            key (which is refused rather than resolved arbitrarily, and can
            occur even for a single-recommendation request), a matched stored
            row has no usable price to derive the spend cap from, or a
            Savings Plan's requested count does not equal the stored
            recommended count. Recovery differs by
            cause: for the idempotency case, verify the earlier submit's
            outcome with the provider before resubmitting; for a
            stored-recommendation conflict, refresh the recommendation set
            and resubmit with the current data. With execute_mode "direct",
            a lost claim on the new execution also answers 409.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >
            execute_mode "direct" only. The claim was won and the purchase
            ran, but it failed or only partly completed. Money may have moved;
            the body details carry execution_id and the row's actual status.
            Check the execution in History before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/approve/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: approvePurchase
      tags: [Purchases]
      summary: Approve a pending purchase execution
      description: >
        Two modes. Session mode: send the session bearer token plus the
        X-CSRF-Token header; the session must hold approve-any, or
        approve-own for an execution it created, and the execution must be
        inside the session's account scope. Token mode (email link): send the
        approval token; the caller must also be signed in with the email of
        the contact_email of a cloud account on the execution (the global
        notification address is not an accepted approver). A session that lacks the
        permission, or is outside the account scope, falls through to token
        mode when a token is present; with no token the denial is final.
        A session whose approve permission Constraints are exceeded is
        denied outright and does not fall through. GET is not routed: the
        approval email links to the dashboard, which POSTs after confirmation.
        When the global purchase delay is configured the response status is
        "scheduled" instead of "completed".
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          description: >
            Approval token. For POST it may instead be sent as a JSON body
            {"token": "..."} or a form field named token; the body is
            preferred so the token stays out of access logs.
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: >
            CSRF token from the login response. Required when the request
            carries a session bearer token and is handled in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Approved and executed ("completed"), or scheduled behind the purchase delay ("scheduled")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            The caller has no valid session, with or without a token. This
            is answered before the execution is looked up, so an existing
            and a missing execution ID get the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed for a signed-in session, the session lacks approve permission or
            exceeds its Constraints, the caller is not the account's contact
            email, no contact email is configured on the execution's
            accounts, 4-eyes mode rejects the approver, or (token mode) the
            approval token is invalid. Token mode validates the token on
            both the immediate and the delayed-approval (purchase delay
            configured) paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Execution not found, or outside the session's account scope and
            no token was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The execution cannot be approved: a non-AWS execution without a
            resolvable cloud account, a status other than pending or notified
            (in token mode the status check is the atomic transition, so a
            concurrent change answers the same way, and in session mode a
            lost claim answers 409 as well).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            Token mode only, the approval token has expired (checked on both
            the immediate and the delayed-approval paths).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >
            Session mode only. The claim was won and the purchase ran, but it
            failed or only partly completed (a failed or partially_completed
            run). Money may have moved; the body details carry execution_id
            and the row's actual status. Check the execution in History
            before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/cancel/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: cancelPurchase
      tags: [Purchases]
      summary: Cancel a pending purchase execution
      description: >
        Two modes, with the same dispatch as approve. Session mode: session
        bearer token plus X-CSRF-Token; the session must hold cancel-any, or
        cancel-own for an execution it created, and the execution must be
        inside the session's account scope. Token mode (email link): the
        approval token plus a session signed in as the contact email of an
        account on the execution. A session that lacks the permission, or is
        outside the account scope, falls through to token mode when a token
        is present; with no token the denial is final. GET is not routed:
        the email links to the dashboard, which POSTs after confirmation.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          description: >
            Approval token. For POST it may instead be sent as a JSON body
            {"token": "..."} or a form field named token.
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: >
            CSRF token from the login response. Required in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            The caller has no valid session, with or without a token. This
            is answered before the execution is looked up, so an existing
            and a missing execution ID get the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed for a signed-in session, the session lacks cancel permission, the caller is
            not the account's contact email, no contact email is
            configured on the execution's accounts, or (token mode) the
            approval token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Execution not found, or outside the session's account scope and
            no token was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The execution is not cancelable (in session mode, scheduled
            executions must use the revoke endpoint), or its status changed
            concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >
            Token mode only, the approval token has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/purchases/revoke/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: revokePurchaseViaEmail
      tags: [Purchases]
      summary: Revoke a completed purchase from the email link
      description: >
        Records a revocation request for a completed or partially completed
        purchase. The same path also answers GET with an unauthenticated HTML
        confirmation form (no state change, so mail prefetchers cannot
        trigger a revocation); that form POSTs the token here. The GET
        operation is not listed separately because the permission-gate
        guard in openapi_403_test.go matches routes by prefix and would
        mistake it for the GET /api/purchases/{id} details route.

        Two modes. Session mode: session bearer token plus
        X-CSRF-Token, with cancel-any or cancel-own and account scope, as for
        cancel. Token mode: the approval token plus a session signed in as
        the contact email of an account on the execution, within the
        24-hour revocation window. A session denial falls through to token
        mode only when a token is present.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          required: false
          description: >
            Approval token. May instead be sent as a JSON body
            {"token": "..."} or a form field named token.
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          description: CSRF token from the login response. Required in session mode.
          schema:
            type: string
      responses:
        '200':
          description: Revocation request recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revocation_requested
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            The caller has no valid session, with or without a token. This
            is answered before the execution is looked up, so an existing
            and a missing execution ID get the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            CSRF validation failed, the session lacks cancel permission, the
            token is invalid, the revocation window has closed, or the caller
            is not the account's contact email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Execution not found, or outside the session's account scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The execution status cannot be revoked (still pending or
            notified, or not completed), or the revocation link has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---- Planned Purchases --------------------------------------------------
  /api/purchases/planned:
