          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/trends:
    get:
      operationId: getAnalyticsTrends
      tags: [Analytics]
      summary: Get savings-snapshot trends
      description: >
        Requires `view:purchases` permission. Returns monthly savings totals
        plus by-provider and by-service breakdowns from the savings snapshot
        store. The monthly series covers `months` calendar months counted back
        from the current month; the breakdowns cover the requested range.
      parameters:
        - name: account_id
          in: query
          description: >
            Cloud account ID or external account ID. Required for sessions
            restricted to specific accounts; omit for all accessible accounts.
          schema:
            type: string
        - name: start
          in: query
          description: RFC 3339 or YYYY-MM-DD. Defaults to 7 days before `end`.
          schema:
            type: string
        - name: end
          in: query
          description: >
            RFC 3339 or YYYY-MM-DD (a date covers the whole day). Defaults to
            now. The range may span at most 366 days.
          schema:
            type: string
        - name: provider
          in: query
          description: Filters `by_service` only. Not validated; an unknown value yields no rows.
          schema:
            type: string
      responses:
        '200':
          description: Savings trends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTrendsResponse'
        '400':
          description: >
            Invalid date, start after end, range over 366 days, or a
            restricted session omitted `account_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The account is outside the session's allowed accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The savings snapshot store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---- Auth ---------------------------------------------------------------
  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate and obtain a session token
      description: >
        Two request forms. The password form sends email and password, plus
        mfa_code for an MFA-enrolled account. When the password is right but
        the account needs a code and none was sent, the 401 body is
        `mfa_required` with an `mfa_token`: a single-use continuation token
        valid for 5 minutes and for at most 3 code attempts. The code step
        then sends email, mfa_token and mfa_code with no password. The
        password + mfa_code form keeps working.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >
            Not signed in. `error` is `mfa_required` (password right, code
            needed; carries mfa_token unless one could not be stored, in
            which case resend password + mfa_code), `invalid_mfa_code`
            (wrong code),
            `invalid_mfa_token` (the token is unknown, expired, used, out of
            attempts or not this account's; start again from the password),
            or `invalid credentials` for every other failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimiterUnavailable'

  /api/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Invalidate current session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/check-admin:
    get:
      operationId: checkAdminExists
      tags: [Auth]
      summary: Check whether an admin account has been set up
      security: []
      responses:
        '200':
          description: Admin existence status
