  /api/auth/reset-password/status:
    get:
      operationId: getResetPasswordStatus
      tags: [Auth]
      summary: Check a password reset or invite token without consuming it
      description: >
        Returns 200 for every token state. `used` also covers tokens that were
        never issued and accounts that are deactivated. Shares the
        reset-password rate limit (10 requests per 15 minutes per IP).
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Reset or invite token from the email link
          schema:
            type: string
      responses:
        '200':
          description: Token state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordStatusResponse'
        '400':
          description: The token parameter is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The rate limiter is unavailable (fails closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/setup:
    post:
      operationId: setupMFA
      tags: [Auth]
      summary: Start MFA enrollment
      description: >
        Generates a pending TOTP secret (valid for 5 minutes) and its
        otpauth provisioning URI. Repeating the call replaces the pending
        secret. Requires a bearer-token session; API keys get 401. Rate
        limited to 10 MFA requests per 15 minutes per IP and per user. A
        missing user, failed lookup or locked account answers 401.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFASetupRequest'
      responses:
        '200':
          description: Pending secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'
        '400':
          description: Invalid body, password encoding or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CSRF validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            MFA is already enabled (disable it first), or the account changed
            concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The rate limiter is unavailable (fails closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/enable:
    post:
      operationId: enableMFA
      tags: [Auth]
      summary: Finish MFA enrollment
      description: >
        Verifies a TOTP code against the pending secret, enables MFA and
        returns 10 recovery codes, shown only once. Requires a bearer-token
        session; API keys get 401. Rate limited to 10 MFA requests per 15
        minutes per IP and per user. A wrong code counts toward account
        lockout; a locked account answers 401.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAEnableRequest'
      responses:
        '200':
          description: MFA enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFARecoveryCodesResponse'
        '400':
          description: >
            Invalid body, invalid code, no enrollment in progress, or the
            enrollment expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CSRF validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: MFA is already enabled, or the account changed concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The rate limiter is unavailable (fails closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/disable:
    post:
      operationId: disableMFA
      tags: [Auth]
      summary: Disable MFA
      description: >
        Requires the current password and, while MFA is on, a TOTP code or an
        unused recovery code. With MFA already off, the correct password alone
        succeeds and clears any pending enrollment. Requires a bearer-token
        session; API keys get 401. Rate limited to 10 MFA requests per 15
        minutes per IP and per user. A wrong code counts toward account
        lockout; a locked account answers 401.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFADisableRequest'
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: >
            Invalid body or password encoding, wrong password, missing code,
            or invalid code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CSRF validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The account changed concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The rate limiter is unavailable (fails closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/regenerate-recovery-codes:
    post:
      operationId: regenerateMFARecoveryCodes
      tags: [Auth]
      summary: Replace MFA recovery codes
      description: >
        Requires a current TOTP code (a recovery code is not accepted).
        Replaces all stored recovery codes and returns 10 new ones, shown only
        once. Requires a bearer-token session; API keys get 401. Rate limited
        to 10 MFA requests per 15 minutes per IP and per user. A wrong code
        counts toward account lockout; a locked account answers 401.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFARegenerateRequest'
      responses:
        '200':
          description: New recovery codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFARecoveryCodesResponse'
        '400':
          description: Invalid body, invalid code, or MFA is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CSRF validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The account changed concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The rate limiter is unavailable (fails closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

