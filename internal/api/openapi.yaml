                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimiterUnavailable'

  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
